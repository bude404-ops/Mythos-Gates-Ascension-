name: Artwork Auto Import

on:
  push:
    branches:
      - main
    paths:
      - 'artwork_import/dropbox/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artwork-auto-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-artwork:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Import Big Bot artwork dropbox files
        run: npm run artwork:auto-import

      - name: Detect generated changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit imported artwork and refreshed registries
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-import Big Bot artwork"
          git push
