<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Titan Gates: Ascension — Development Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://static.print.world/reaper-cdn/print-lol-tokens.js"></script>
</head>
<body class="font-rajdhani min-h-screen bg-neutral-950 text-neutral-50 overflow-auto">
  <div class="fixed inset-0 pointer-events-none opacity-40 bg-[radial-gradient(circle_at_top,rgba(239,68,68,.18),transparent_35%),radial-gradient(circle_at_bottom_right,rgba(245,158,11,.12),transparent_35%)]"></div>
  <div class="relative mx-auto max-w-7xl px-4 pb-28 pt-5 md:px-8">
    <header class="sticky top-0 z-30 -mx-4 mb-4 border-b border-neutral-800 bg-neutral-950/90 px-4 py-3 backdrop-blur md:-mx-8 md:px-8">
      <div class="flex items-center justify-between gap-3">
        <a href="#/" class="min-w-0">
          <p class="text-xs font-black uppercase tracking-[.28em] text-primary">Titan Gates: Ascension</p>
          <h1 class="truncate text-2xl font-black md:text-4xl">GitHub Dev Platform</h1>
        </a>
        <a id="repoLink" target="_blank" rel="noreferrer" class="rounded-2lg border border-primary/40 bg-primary/10 px-3 py-2 text-sm font-black text-primary">GitHub</a><a href="#/sync" class="rounded-2lg border border-bull-500/40 bg-bull-950/20 px-3 py-2 text-sm font-black text-bull-400">Sync</a>
      </div>
      <div class="mt-3 flex gap-2">
        <input id="search" class="w-full rounded-2lg border border-neutral-700 bg-neutral-900 px-4 py-3 text-neutral-50 placeholder-neutral-500 focus:border-primary" placeholder="Search Titans, factions, lore, prompts, tasks..." />
        <button onclick="go('#/search')" class="rounded-2lg bg-primary px-4 py-3 font-black text-white">Search</button>
      </div>
    </header>
    <main id="app" class="min-h-[70vh]"></main>
  </div>
  <nav class="fixed bottom-0 left-0 right-0 z-40 border-t border-neutral-800 bg-neutral-950/95 p-2 backdrop-blur md:hidden">
    <div class="grid grid-cols-5 gap-1 text-center text-[11px] font-black uppercase tracking-wide">
      <a class="rounded-xl bg-neutral-900 p-2" href="#/">Home</a>
      <a class="rounded-xl bg-neutral-900 p-2" href="#/game">Game</a>
      <a class="rounded-xl bg-neutral-900 p-2" href="#/titans">Titans</a>
      <a class="rounded-xl bg-neutral-900 p-2" href="#/art">Art</a>
      <a class="rounded-xl bg-neutral-900 p-2" href="#/sync">Sync</a>
      <a class="rounded-xl bg-neutral-900 p-2" href="#/dev">Dev</a>
    </div>
  </nav>
  <script>
    const DATA = {};
    const files = ['project','factions','titans','characters','units','art-prompts','artworks','directors','development-tasks','lore-index','npcs','creatures','maps','campaigns','chapters','dialogue-scripts','visual-screens','visual-change-rules','visual-baselines','realm-codex','hybrid-visual-architecture','asset-pipeline','github-sync-policy','github-sync-status','change-history','campaign-architecture','campaign-chapter-registry','mission-registry','mission-dialogue','mission-art-packages','objective-system','reward-system','campaign-audit','index'];
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const slug = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    const go = h => { location.hash = h; };
    async function copyText(text, label='Copied'){
      try { await navigator.clipboard.writeText(text); toast(label); }
      catch(e){ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); toast(label); }
    }

    async function refreshGithubLiveStatus(){
      const s=DATA['github-sync-status']; if(!s) return;
      const repo=s.repository || 'bude404-ops/Titans-Gate-';
      try{
        const commit=await fetch(`https://api.github.com/repos/${repo}/commits/main`).then(r=>r.ok?r.json():null);
        if(commit?.sha){ s.commit=commit.sha.slice(0,7); s.lastPushTime=commit.commit?.committer?.date || s.lastPushTime; s.status='SYNCED'; s.github='SYNCED'; }
        const runs=await fetch(`https://api.github.com/repos/${repo}/actions/runs?branch=main&per_page=1`).then(r=>r.ok?r.json():null);
        const run=runs?.workflow_runs?.[0];
        if(run){ s.deployment = run.status==='completed' ? (run.conclusion==='success'?'SUCCESS':'FAILED') : 'IN_PROGRESS'; }
      }catch(e){ s.deployment = s.deployment || 'UNKNOWN'; }
    }

    function toast(msg){ let el=$('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.className='fixed left-4 right-4 top-4 z-50 rounded-2lg border border-bull-500/50 bg-neutral-900 p-3 text-center font-black text-bull-400 md:left-auto md:w-96'; document.body.appendChild(el);} el.textContent=msg; clearTimeout(window.__toast); window.__toast=setTimeout(()=>el.remove(),1800); }
    function card(title, body, href, meta=''){ return `<a href="${href}" class="block rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5 shadow-dark-outline active:scale-[.99]"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(meta)}</p><h3 class="mt-1 text-2xl font-black">${esc(title)}</h3><p class="mt-2 text-sm text-neutral-300">${esc(body)}</p></a>`; }
    async function load(){ for(const f of files){ const r=await fetch(`data/${f}.json?v=${Date.now()}`); if(!r.ok) throw new Error(`Missing data/${f}.json`); DATA[f]=await r.json(); } $('repoLink').href=DATA.project.githubRepo; window.addEventListener('hashchange', render); $('search').addEventListener('keydown', e=>{ if(e.key==='Enter') go('#/search') }); render(); }
    function counts(){ return DATA.index.counts; }
    function directorRecommendation(){
      const tasks=DATA['development-tasks'];
      const order={High:3,Medium:2,Low:1};
      return [...tasks].filter(t=>['NEXT','ACTIVE','BLOCKED'].includes(t.status)).sort((a,b)=>(order[b.priority]||0)-(order[a.priority]||0))[0];
    }
    
function syncColor(status){ return status==='SYNCED' ? 'bull' : status==='SYNC_ERROR' ? 'bear' : 'primary'; }
function githubStatusPanel(){
  const s=DATA['github-sync-status']||{}, h=DATA['change-history']||{entries:[]}, color=syncColor(s.status);
  const icon=s.status==='SYNCED'?'🟢':s.status==='SYNC_ERROR'?'🔴':'🟡';
  const command=`npm run precommit:verify && npm run sync:github -- ${s.commitMessage||'chore: sync approved titan gates changes'}`;
  return `<section class="rounded-3xl border border-${color}-500/40 bg-${color}-950/10 p-5">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div><p class="text-xs font-black uppercase tracking-[.35em] text-${color}-400">GitHub Status</p><h3 class="mt-1 text-3xl font-black">${icon} ${esc(s.status||'UNKNOWN')}</h3><p class="mt-2 text-neutral-300">GitHub main is the authoritative source of truth. Do not call a change complete until it is pushed and verified.</p></div>
      <div class="rounded-2lg border border-neutral-800 bg-neutral-950 p-3 text-sm"><b>BUILD</b> ${esc(s.build||'—')}<br/><b>GITHUB</b> ${esc(s.github||'—')}<br/><b>DEPLOYMENT</b> ${esc(s.deployment||'—')}</div>
    </div>
    <div class="mt-4 grid gap-2 md:grid-cols-4">
      <div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Version</p><b>${esc(s.version||DATA.project.version)}</b></div>
      <div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Commit</p><b>${esc(s.commit||'pending')}</b></div>
      <div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Last GitHub Push</p><b>${esc(s.lastPushTime||'pending')}</b></div>
      <div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Previous Stable</p><b>${esc(s.previousStableVersion||DATA.project.previousStableVersion||'—')}</b></div>
    </div>
    <div class="mt-4 rounded-2lg border border-neutral-800 bg-neutral-950 p-4">
      <div class="flex flex-wrap items-center justify-between gap-2"><div><p class="text-xs font-black uppercase tracking-[.24em] text-primary">Manual Push Backup</p><p class="text-neutral-300">Runs validate → build → Visual QA → secret scan → commit → push. Requires secure local/GitHub Actions authentication; never browser tokens.</p></div><button onclick="copyText(${JSON.stringify(command)},'Manual push command copied')" class="rounded-2lg bg-primary px-4 py-3 font-black text-white">Push to GitHub</button></div>
    </div>
    <div class="mt-4 grid gap-2 md:grid-cols-2">${(h.entries||[]).slice(0,4).map(e=>`<article class="rounded-2lg border border-neutral-800 bg-neutral-950 p-3"><p class="text-xs font-black uppercase tracking-[.2em] text-neutral-500">${esc(e.status)} · ${esc(e.version)}</p><h4 class="text-xl font-black">${esc(e.summary)}</h4><p class="text-sm text-neutral-400">Commit ${esc(e.commit||'pending')}</p></article>`).join('')}</div>
  </section>`;
}

function home(){ const c=counts(), p=DATA.project, rec=directorRecommendation(); return `<section class="space-y-4">
      <div class="rounded-3xl border border-primary/40 bg-neutral-900 p-5">
        <p class="text-xs font-black uppercase tracking-[.35em] text-primary">Build ${esc(p.version)}</p>
        <h2 class="mt-1 text-4xl font-black md:text-6xl">Titan Gates: Ascension</h2>
        <p class="mt-2 text-neutral-300">${esc(p.phase)} · ${esc(p.buildStatus)} · Last update ${esc(p.lastUpdate)}</p>
        <div class="mt-4 grid grid-cols-2 gap-2 md:grid-cols-6">${[['Titans',c.titans],['Factions',c.factions],['NPCs',c.npcs||0],['Creatures',c.creatures||0],['Maps',c.maps||0],['Campaigns',c.campaigns||0],['Dialogue',c.dialogueScripts||0],['Missions',c.missions||0],['Prompts',c.artPrompts],['Tasks',c.developmentTasks]].map(x=>`<div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">${x[0]}</p><b class="text-2xl">${x[1]}</b></div>`).join('')}</div>
      </div>
      ${githubStatusPanel()}
      <div class="rounded-3xl border border-bull-500/40 bg-bull-950/10 p-5"><p class="text-xs font-black uppercase tracking-[.3em] text-bull-400">What should we work on next?</p><h3 class="mt-1 text-3xl font-black">${esc(rec.description)}</h3><p class="mt-2 text-neutral-300">Priority ${esc(rec.priority)} · ${esc(rec.director)} · ${esc(rec.status)}</p><p class="mt-2 text-sm text-neutral-400">Reason: project data shows this task has the highest active priority and clear dependencies.</p><div class="mt-4 grid gap-3 sm:grid-cols-2"><a href="game/preview.html" class="rounded-2lg bg-primary px-5 py-4 text-center text-xl font-black text-white no-underline">▶ GAME PREVIEW · Game Preview</a><a href="#/visual-qa" class="rounded-2lg border border-amber-700 bg-amber-950/40 px-5 py-4 text-center text-xl font-black text-amber-300 no-underline">🔍 Visual QA</a></div></div>
      <section class="grid gap-3 md:grid-cols-3">${[
        ['Game','Open the playable Titan Gates build.','#/game','Play'],['Tactical Map Prototype','Play the mobile isometric battle prototype with Realm terrain, 2D tokens, movement, attack, enemy phase, and camera modes.','game/tactical-map-prototype.html','Prototype'],['Game Preview','Open the current development preview with device presets and Dev/Player view.','game/preview.html','Visual'],['Visual QA','Review screen status, warnings, baselines, and affected changes.','#/visual-qa','Review'],['Lore Codex','Read canon lore, timeline, Realms, powers, and history.','#/lore','Canon'],['Titans','Browse all 63 Titan profiles and prompts.','#/titans','Database'],['Characters','Browse non-playable campaign character records.','#/characters','NPCs'],['Creatures','Browse Hollow, Gateborn, Beast Realm, Forgotten, and world boss threats.','#/creatures','Threats'],['Maps','Open tactical and campaign maps with hazards and objectives.','#/maps','World'],['Campaigns','Browse acts, chapters, maps, NPCs, and creatures.','#/campaigns','Campaign'],['Campaign Architecture','Overview for faction campaign architecture, Normal/Elite mission totals, audit status, and next build target.','#/missions','System'],['Dialogue Viewer','Browse mission intro, mid-battle, low-health, victory, defeat, and post-mission lines by campaign and chapter.','#/dialogue','Script'],['Factions','Open seven Realm faction pages.','#/factions','Realms'],['Art Studio','Copy prompts and register artwork safely.','#/art','Production'],['Development','View active, next, blocked, and completed tasks.','#/dev','Tasks'],['Directors','View governance authority by Director.','#/directors','Governance'],['GitHub Repository','Open the source of truth.','#/github','Source']
      ].map(x=>card(x[0],x[1],x[2],x[3])).join('')}</section></section>`; }
    function game(){ return `<section class="space-y-4"><h2 class="text-4xl font-black">Game</h2><div class="grid gap-3 md:grid-cols-2">${card('Play First Build','5-Titan strike force tactical Gate encounter.','game/index.html','Playable')}${card('Tactical Map Prototype','Mobile isometric battlefield: Realm terrain, 2D combatants, movement, attacks, enemy phase, and camera modes.','game/tactical-map-prototype.html','Prototype')}${card('Legacy Dev Platform','Open the preserved original development platform export.','titan-gates-dev-platform.html','Archive')}</div><iframe class="mt-4 h-[70vh] w-full rounded-3xl border border-neutral-800 bg-neutral-900" src="game/index.html"></iframe></section>`; }
    function lore(){ return listPage('Lore Codex', DATA['lore-index'], x=>`<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(x.id)} · ${esc(x.category)}</p><h3 class="mt-1 text-2xl font-black">${esc(x.title)}</h3><p class="mt-2 text-neutral-300">${esc(x.summary)}</p><a class="mt-4 inline-block rounded-2lg bg-primary px-4 py-2 font-black text-white" href="${esc(x.file)}">Open File</a></article>`); }
    function factions(){ return listPage('Factions', DATA.factions, f=>`<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(f.id)} · ${esc(f.inspiration)}</p><h3 class="mt-1 text-3xl font-black">${esc(f.name)}</h3><p class="mt-2 text-neutral-300">${esc(f.culture)}</p><div class="mt-3 rounded-2lg bg-neutral-950 p-3 text-sm text-neutral-300"><b>Combat:</b> ${esc(f.combatPhilosophy)}<br><b>Mixing:</b> ${esc(f.mixingRule)}</div><a href="#/titans?faction=${esc(f.slug)}" class="mt-3 inline-block rounded-2lg bg-primary px-4 py-2 font-black text-white">View Titans</a></article>`); }
    function titans(){ let q=new URLSearchParams(location.hash.split('?')[1]||''); let faction=q.get('faction'); let items=DATA.titans.filter(t=>!faction || slug(t.faction)===faction); return listPage(faction?`Titans · ${faction}`:'Titans', items, titanCard); }
    function titanCard(t){ const pr=DATA['art-prompts'].find(p=>p.id===t.artPromptId); return `<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(t.id)} · ${esc(t.faction)} · ${esc(t.rarity)}</p><h3 class="mt-1 text-2xl font-black">${esc(t.name)}</h3><p class="mt-1 text-neutral-300">${esc(t.role)} · ${esc(t.developmentStatus)}</p><div class="mt-3 grid grid-cols-5 gap-2 text-center text-xs">${Object.entries(t.stats).map(([k,v])=>`<span class="rounded bg-neutral-950 p-2">${esc(k)}<br><b>${v}</b></span>`).join('')}</div><p class="mt-3 text-sm text-neutral-300">${esc(t.lore)}</p><div class="mt-4 flex flex-wrap gap-2"><button onclick="copyText(${JSON.stringify(pr?.prompt||'')},'Prompt copied')" class="rounded-2lg bg-primary px-3 py-2 font-black text-white">Copy Prompt</button><button onclick="copyText(${JSON.stringify(pr?.negativePrompt||'')},'Negative prompt copied')" class="rounded-2lg bg-neutral-800 px-3 py-2 font-black">Copy Negative</button><a href="#/art?entity=${esc(t.id)}" class="rounded-2lg border border-neutral-700 px-3 py-2 font-black">View Art Studio</a></div></article>`; }
    function characters(){ const items=DATA.npcs||[]; return `<section class="space-y-4"><h2 class="text-4xl font-black">Non-Playable Characters</h2><div class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-4 text-neutral-300">Canon guard: these records are NPCs only. They do not enter five-Titan strike forces.</div><div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">${items.map(n=>`<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(n.id)} · ${esc(n.faction||'Hollow')} · ${esc(n.director)}</p><h3 class="mt-1 text-2xl font-black">${esc(n.name)}</h3><p class="mt-2 text-neutral-300">${esc(n.role)}</p><p class="mt-3 text-sm text-neutral-400">${esc(n.lore)}</p><div class="mt-4 flex flex-wrap gap-2"><a href="#/art?entity=${esc(n.id)}" class="rounded-2lg bg-primary px-3 py-2 font-black text-white">Art Prompt</a></div></article>`).join('')}</div></section>`; }
    function creatures(){ return listPage('Creatures', DATA.creatures||[], c=>`<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(c.id)} · ${esc(c.category)} · ${esc(c.threatTier)}</p><h3 class="mt-1 text-2xl font-black">${esc(c.name)}</h3><p class="mt-2 text-neutral-300">${esc(c.lore)}</p><p class="mt-3 text-sm text-neutral-400">Abilities: ${esc((c.abilities||[]).join(', '))}</p><a href="#/art?entity=${esc(c.id)}" class="mt-4 inline-block rounded-2lg bg-primary px-3 py-2 font-black text-white">Art Prompt</a></article>`); }
    function maps(){ return listPage('Maps', DATA.maps||[], m=>`<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(m.id)} · ${esc(m.realm)} · ${esc(m.status)}</p><h3 class="mt-1 text-2xl font-black">${esc(m.name)}</h3><p class="mt-2 text-neutral-300">${esc(m.description)}</p><p class="mt-3 text-sm text-neutral-400">Objectives: ${esc((m.objectives||[]).join(', '))}</p><p class="text-sm text-neutral-400">Hazards: ${esc((m.hazards||[]).join(', '))}</p><a href="#/art?entity=${esc(m.id)}" class="mt-4 inline-block rounded-2lg bg-primary px-3 py-2 font-black text-white">Art Prompt</a></article>`); }
    function campaigns(){ return listPage('Campaigns', DATA.campaigns||[], c=>`<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(c.id)} · ${esc(c.phase)} · ${esc(c.status)}</p><h3 class="mt-1 text-2xl font-black">${esc(c.name)}</h3><p class="mt-2 text-neutral-300">${esc(c.summary)}</p><p class="mt-3 text-sm text-neutral-400">Chapters: ${esc((c.chapters||[]).length)} · Maps: ${esc((c.maps||[]).length)} · NPCs: ${esc((c.npcs||[]).length)} · Creatures: ${esc((c.creatures||[]).length)}</p><div class="mt-3 flex flex-wrap gap-2">${(c.chapters||[]).map(id=>`<a href="#/chapter?id=${esc(id)}" class="rounded-xl border border-neutral-700 px-2 py-1 text-xs font-black text-neutral-200">${esc(id.replace('TG-CHAPTER-','CH '))}</a>`).join('')}</div><p class="mt-2 text-sm text-primary">Next: ${esc(c.recommendedNextTask)}</p></article>`); }
    function dialogueViewer(){
      const params=new URLSearchParams(location.hash.split('?')[1]||'');
      const selected=params.get('campaign') || 'all';
      const campaigns=DATA.campaigns||[], chapters=DATA.chapters||[], scripts=DATA['dialogue-scripts']||[];
      const campaignById=Object.fromEntries(campaigns.map(c=>[c.id,c]));
      const chapterById=Object.fromEntries(chapters.map(c=>[c.id,c]));
      const beatLabels={missionIntro:'Mission Intro',midBattlePressure:'Mid-Battle Pressure',lowHealthWarning:'Low-Health Warning',victory:'Victory',defeat:'Defeat / Fallback',postMission:'Post-Mission Consequence'};
      const filtered=scripts.filter(s=>selected==='all'||s.campaignId===selected).sort((a,b)=>String(a.chapterId).localeCompare(String(b.chapterId)));
      const totalLines=filtered.reduce((n,s)=>n+Object.values(s.beats||{}).reduce((m,lines)=>m+(lines||[]).length,0),0);
      const tabs=['all',...campaigns.map(c=>c.id)].map(id=>`<a href="#/dialogue${id==='all'?'':'?campaign='+esc(id)}" class="rounded-2lg border ${selected===id?'border-primary bg-primary text-white':'border-neutral-800 bg-neutral-900 text-neutral-300'} px-3 py-2 text-sm font-black">${id==='all'?'All Campaigns':esc(campaignById[id]?.name||id)}</a>`).join('');
      return `<section class="space-y-4"><div class="rounded-3xl border border-primary/40 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.28em] text-primary">Script System</p><h2 class="mt-1 text-4xl font-black">Dialogue Viewer</h2><p class="mt-2 text-neutral-300">Mission-ready lines grouped by campaign, chapter, and tactical beat. Tone remains ancient, restrained, strategic, and canon-safe.</p><div class="mt-4 grid grid-cols-2 gap-2 md:grid-cols-4"><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Chapters Shown</p><b class="text-2xl">${filtered.length}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Lines Shown</p><b class="text-2xl">${totalLines}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Beat Types</p><b class="text-2xl">6</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Canon Rule</p><b class="text-lg">Titan-only</b></div></div><div class="mt-4 flex flex-wrap gap-2">${tabs}</div></div><div class="grid gap-4">${filtered.map(s=>{ const ch=chapterById[s.chapterId]||{}, camp=campaignById[s.campaignId]||{}; return `<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><div class="flex flex-wrap items-start justify-between gap-3"><div><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(s.chapterId)} · ${esc(camp.name||s.campaignId)}</p><h3 class="mt-1 text-2xl font-black"><a class="hover:text-primary" href="#/chapter?id=${esc(s.chapterId)}">${esc(s.chapterTitle||ch.title)}</a></h3><p class="mt-1 text-sm text-neutral-400">${esc(s.tone)} · ${esc(s.status)}</p></div><button onclick="copyText(${JSON.stringify(JSON.stringify(s,null,2))},'Dialogue JSON copied')" class="rounded-2lg bg-primary px-3 py-2 font-black text-white">Copy JSON</button></div><div class="mt-4 grid gap-3 md:grid-cols-2 xl:grid-cols-3">${Object.entries(beatLabels).map(([beat,label])     }
    function art(){ const params=new URLSearchParams(location.hash.split('?')[1]||''); const entity=params.get('entity'); const category=params.get('category')||'all'; const prompts=DATA['art-prompts'].filter(p=>(!entity||p.entityId===entity)&&(category==='all'||p.category===category)); const mapCampaignCount=DATA['art-prompts'].filter(p=>['Map','Campaign'].includes(p.category)).length; return `<section class="space-y-4"><h2 class="text-4xl font-black">Art Studio</h2><div class="rounded-3xl border border-primary/40 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">Clipboard-Ready Production Prompts</p><h3 class="mt-1 text-3xl font-black">Map & Campaign Art Queue</h3><p class="mt-2 text-neutral-300">Browse, filter, and copy production prompts for campaign key art, tactical maps, Titans, NPCs, and threats.</p><div class="mt-4 grid grid-cols-2 gap-2 md:grid-cols-4"><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Shown</p><b class="text-2xl">${prompts.length}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Map + Campaign</p><b class="text-2xl">${mapCampaignCount}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Campaigns</p><b class="text-2xl">${DATA['art-prompts'].filter(p=>p.category==='Campaign').length}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Maps</p><b class="text-2xl">${DATA['art-prompts'].filter(p=>p.category==='Map').length}</b></div></div><div class="mt-4">${artFilterTabs(category)}</div></div><div class="rounded-3xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-neutral-300">GitHub Pages is presentation only. It never stores a personal token. Import finished artwork by adding images to repository folders and registering metadata in <code>data/artworks.json</code>. Safe folders: <code>art/imported</code>, <code>art/concepts</code>, <code>art/approved</code>, <code>art/reference</code>.</p><div class="mt-3 grid gap-2 md:grid-cols-3"><input id="assetName" class="rounded-2lg border border-neutral-700 bg-neutral-950 p-3" placeholder="image filename.png"/><input id="assetEntity" class="rounded-2lg border border-neutral-700 bg-neutral-950 p-3" placeholder="TG-TITAN-001"/><button onclick="makeArtworkRecord()" class="rounded-2lg bg-primary p-3 font-black text-white">Generate Artwork Metadata</button></div><pre id="artRecord" class="mt-3 overflow-auto rounded-2lg bg-neutral-950 p-3 text-xs text-neutral-300"></pre></div><div class="grid gap-3 md:grid-cols-2">${prompts.map(promptCard).join('')}</div></section>`; }
    function promptCard(p){ return `<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(p.id)} · ${esc(p.category)} · ${esc(p.status)}</p><h3 class="mt-1 text-2xl font-black">${esc(p.entity)}</h3><p class="mt-2 text-sm text-neutral-300 line-clamp-4">${esc(p.prompt)}</p><div class="mt-4 flex flex-wrap gap-2"><button onclick="copyText(${JSON.stringify(p.prompt)},'Prompt copied')" class="rounded-2lg bg-primary px-3 py-2 font-black text-white">Copy Prompt</button><button onclick="copyText(${JSON.stringify(p.negativePrompt)},'Negative prompt copied')" class="rounded-2lg bg-neutral-800 px-3 py-2 font-black">Copy Negative Prompt</button><button onclick="copyText(${JSON.stringify(p.prompt+'\n\nNEGATIVE PROMPT:\n'+p.negativePrompt)},'Full prompt copied')" class="rounded-2lg border border-neutral-700 px-3 py-2 font-black">Copy Full Prompt</button><a href="game/preview.html?screen=${p.category==='Map'?'campaign':p.category==='Creature'?'battle':p.category==='NPC'?'character-profile':'titan-profile'}&entity=${esc(p.entityId)}" class="rounded-2lg border border-amber-700 bg-amber-950/40 px-3 py-2 font-black text-amber-300 no-underline">Preview In Game</a></div></article>`; }
    function makeArtworkRecord(){ const file=$('assetName').value.trim(), entity=$('assetEntity').value.trim(); const ok=/\.(png|jpg|jpeg|webp)$/i.test(file); const rec= ok ? {id:'TG-ART-'+Date.now(),entityId:entity,status:'Pending Review',type:'Concept',file:'art/imported/'+file,version:1,created:new Date().toISOString().slice(0,10)} : {error:'Invalid image extension. Use PNG, JPG, JPEG, or WEBP only.'}; $('artRecord').textContent=JSON.stringify(rec,null,2); if(ok) copyText(JSON.stringify(rec,null,2),'Artwork metadata copied'); }
    function visualQA(){ const screens=DATA['visual-screens']||[]; const passed=screens.filter(s=>s.status==='PASS').length; return `<section class="space-y-4"><div class="rounded-3xl border border-neutral-800 bg-neutral-900 p-6"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">Visual QA</p><h2 class="text-4xl font-black">${passed} / ${screens.length} screens passed</h2><p class="mt-2 text-neutral-300">Open Game Preview to inspect current game screens, mobile sizes, Dev View, Player View, warnings, and affected-change rules.</p><div class="mt-4 grid gap-3 sm:grid-cols-2"><a href="game/preview.html" class="rounded-2lg bg-primary px-5 py-4 text-center text-xl font-black text-white no-underline">▶ GAME PREVIEW · Game Preview</a><a href="game/preview.html?screen=titan-selection" class="rounded-2lg border border-amber-700 bg-amber-950/40 px-5 py-4 text-center text-xl font-black text-amber-300 no-underline">Test Titan Selection</a></div></div><div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">${screens.map(s=>`<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(s.id)} · ${esc(s.director)}</p><h3 class="mt-1 text-2xl font-black">${esc(s.name)}</h3><p class="mt-2 text-sm ${s.status==='PASS'?'text-emerald-300':s.status==='FAIL'?'text-red-300':s.status==='WARNING'?'text-amber-300':'text-neutral-400'}">${esc(s.status)}</p><p class="mt-2 text-neutral-300">${esc(s.description)}</p>${(s.warnings||[]).map(w=>`<p class="mt-2 rounded-2lg border border-amber-700 bg-amber-950/30 px-3 py-2 text-amber-200">${esc(w)}</p>`).join('')}<a href="game/preview.html?screen=${esc(s.slug)}" class="mt-4 inline-block rounded-2lg bg-primary px-3 py-2 font-black text-white no-underline">Preview</a></article>`).join('')}</div></section>`; }
    function dev(){ const groups=['ACTIVE','NEXT','BLOCKED','COMPLETED']; return `<section class="space-y-4"><h2 class="text-4xl font-black">Development</h2>${groups.map(g=>`<div><h3 class="mb-2 text-2xl font-black text-primary">${g}</h3><div class="grid gap-3 md:grid-cols-2">${DATA['development-tasks'].filter(t=>t.status===g).map(t=>`<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(t.id)} · ${esc(t.director)} · ${esc(t.priority)}</p><h4 class="mt-1 text-xl font-black">${esc(t.description)}</h4><p class="mt-2 text-sm text-neutral-400">Dependencies: ${esc(t.dependencies.join(', '))}</p><p class="text-sm text-neutral-400">Files: ${esc(t.relatedFiles.join(', '))}</p></article>`).join('')||'<p class="text-neutral-500">None.</p>'}</div></div>`).join('')}</section>`; }
    function directors(){ return listPage('Directors', DATA.directors, d=>`<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(d.id)} · ${esc(d.status)}</p><h3 class="mt-1 text-3xl font-black">${esc(d.name)}</h3><p class="mt-2 text-neutral-300">${esc(d.currentFocus)}</p><p class="mt-3 text-sm text-neutral-400">Authority: ${esc(d.authority.join(', '))}</p></article>`); }
    function search(){ const q=$('search').value.toLowerCase(); const all=[...DATA.titans.map(x=>({...x,type:'Titan'})),...DATA.factions.map(x=>({...x,type:'Faction'})),...DATA['lore-index'].map(x=>({...x,name:x.title,type:'Lore'})),...DATA['art-prompts'].map(x=>({...x,name:x.entity,type:'Prompt'})),...DATA['development-tasks'].map(x=>({...x,name:x.description,type:'Task'})),...DATA.npcs.map(x=>({...x,type:'NPC'})),...DATA.creatures.map(x=>({...x,type:'Creature'})),...DATA.maps.map(x=>({...x,type:'Map'})),...DATA.campaigns.map(x=>({...x,type:'Campaign'})),...DATA.chapters.map(x=>({...x,name:x.title,type:'Chapter'})),...DATA['dialogue-scripts'].map(x=>({...x,name:x.chapterTitle,type:'Dialogue'})),...DATA['mission-registry'].map(x=>({...x,name:x.title,type:'Mission'}))]; const res=all.filter(x=>JSON.stringify(x).toLowerCase().includes(q)); return listPage(`Search ${q?'· '+q:''}`, res, x=>`<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(x.type)} · ${esc(x.id)}</p><h3 class="mt-1 text-2xl font-black">${esc(x.name||x.title||x.entity||x.description)}</h3><p class="mt-2 text-sm text-neutral-300">${esc(x.faction||x.category||x.director||'Titan Gates')}</p></article>`); }
    function listPage(title, items, renderItem){ return `<section class="space-y-4"><h2 class="text-4xl font-black">${esc(title)}</h2><div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">${items.map(renderItem).join('')}</div></section>`; }
    function render(){ const r=(location.hash||'#/').split('?')[0]; const routes={'#/':home,'#/game':game,'#/lore':lore,'#/factions':factions,'#/titans':titans,'#/characters':characters,'#/creatures':creatures,'#/maps':maps,'#/campaigns':campaigns,'#/missions':campaignArchitecture,'#/mission-list':missionList,'#/mission':missionDetail,'#/campaign-audit':campaignAudit,'#/dialogue':dialogueViewer,'#/chapter':chapterDetail,'#/visual-qa':visualQA,'#/sync':()=>`<section class="space-y-4">${githubStatusPanel()}</section>`,'#/art':art,'#/dev':dev,'#/development':dev,'#/directors':directors,'#/search':search,'#/github':()=>{ location.href=DATA.project.githubRepo; return home(); }}; $('app').innerHTML=(routes[r]||home)(); }
    load().then(refreshGithubLiveStatus).then(render).catch(e=>{ $('app').innerHTML=`<div class="rounded-3xl border border-bear-500 bg-bear-950/20 p-5"><h2 class="text-3xl font-black text-bear-400">Build data failed</h2><p>${esc(e.message)}</p></div>`; console.error(e); });
  </script>
</body>
</html>
