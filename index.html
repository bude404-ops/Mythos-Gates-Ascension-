  <script>
    const DATA = {};
    const files = ['project','factions','hollow-faction','hollow-encounter-system','titans','characters','units','art-prompts','artworks','art-import-pipeline','directors','development-tasks','lore-index','npcs','creatures','character-backstories','maps','campaigns','chapters','dialogue-scripts','visual-screens','visual-change-rules','visual-baselines','realm-codex','hybrid-visual-architecture','asset-pipeline','github-sync-policy','github-sync-status','change-history','campaign-architecture','campaign-chapter-registry','mission-registry','mission-dialogue','mission-art-packages','objective-system','reward-system','campaign-audit','storyline-arc-registry','campaign-consequence-registry','endgame-architecture','squad-system','progression-system','ascension-system','async-arena-system','weekly-trials','raid-system','faction-mastery','season-system','achievement-system','balance-analytics','endgame-dashboard','monetization-policy','index'];
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const slug = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    const go = h => { location.hash = h; };
    async function copyText(text, label='Copied'){
      const value=String(text||'');
      let copied=false;
      try{
        if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(value); copied=true; }
      }catch(e){ copied=false; }
      if(!copied){
        const t=document.createElement('textarea');
        t.value=value; t.setAttribute('readonly',''); t.setAttribute('aria-hidden','true');
        t.style.position='fixed'; t.style.top='0'; t.style.left='0'; t.style.width='1px'; t.style.height='1px'; t.style.opacity='0';
        document.body.appendChild(t); t.focus({preventScroll:true}); t.select(); t.setSelectionRange(0, value.length);
        try { copied=document.execCommand('copy'); } catch(e){ copied=false; }
        t.remove();
      }
      const fallback=$('mobileClipboardFallback');
      if(fallback){ fallback.value=value; fallback.classList.toggle('hidden', copied); }
      toast(copied ? label : 'Tap and hold fallback text to copy');
      return copied;
    }


    const ART_IMPORT_KEY='tg_art_import_queue_v1';
    function artImportQueue(){ try{return JSON.parse(localStorage.getItem(ART_IMPORT_KEY)||'[]')}catch(e){return []} }
    function saveArtImportQueue(q){ localStorage.setItem(ART_IMPORT_KEY, JSON.stringify(q)); }
    function artPromptOptions(){ return (DATA['art-prompts']||[]).map(p=>`<option value="${esc(p.id)}" data-entity="${esc(p.entityId)}">${esc(p.category)} · ${esc(p.entity)} · ${esc(p.id)}</option>`).join(''); }
    function selectedPrompt(){ const id=$('importPromptId')?.value; return (DATA['art-prompts']||[]).find(p=>p.id===id) || null; }
    function syncImportPromptFields(){ const p=selectedPrompt(); if(!p) return; $('importEntityId').value=p.entityId||''; $('importEntityName').value=p.entity||''; $('importCategory').value=p.category||'Concept'; }
    function buildArtworkRecordFromForm(){
      const file=($('importFileName')?.value||'').trim(); const prompt=selectedPrompt(); const entityId=($('importEntityId')?.value||prompt?.entityId||'').trim(); const entityName=($('importEntityName')?.value||prompt?.entity||'').trim(); const category=($('importCategory')?.value||prompt?.category||'Concept').trim(); const source=($('importSource')?.value||'Generated Art').trim();
      const ok=/\.(png|jpg|jpeg|webp)$/i.test(file);
      if(!ok) return {error:'Invalid image extension. Use PNG, JPG, JPEG, or WEBP only.'};
      if(!entityId || !entityName) return {error:'Choose a prompt/entity before saving the import.'};
      return {id:'TG-ART-'+Date.now(),entityId,promptId:prompt?.id||'',entityName,category,status:'Pending Review',type:'Generated Import',file:'art/imported/'+file,version:1,created:new Date().toISOString().slice(0,10),source,negativePrompt:prompt?.negativePrompt||'',prompt:prompt?.prompt||''};
    }
    function previewArtworkImport(){ const rec=buildArtworkRecordFromForm(); $('artImportRecord').textContent=JSON.stringify(rec,null,2); if(!rec.error) copyText(JSON.stringify(rec,null,2),'Artwork import metadata copied'); }
    function saveArtworkImport(){ const rec=buildArtworkRecordFromForm(); $('artImportRecord').textContent=JSON.stringify(rec,null,2); if(rec.error){ toast(rec.error); return; } const q=artImportQueue(); q.unshift(rec); saveArtImportQueue(q); toast('Artwork import saved to queue'); render(); }
    function clearArtworkImportQueue(){ saveArtImportQueue([]); toast('Art import queue cleared'); render(); }
    function exportArtworkImports(){ const q=artImportQueue(); copyText(JSON.stringify(q,null,2), 'Art import queue copied'); }
    function importPromptFromCard(promptId){ go('#/art-import?prompt='+encodeURIComponent(promptId)); }

    async function refreshGithubLiveStatus(){
      const s=DATA['github-sync-status']; if(!s) return;
      const repo=s.repository || 'bude404-ops/Titans-Gate-';
      try{
        const commit=await fetch(`https://api.github.com/repos/${repo}/commits/main`).then(r=>r.ok?r.json():null);
        if(commit?.sha){ s.commit=commit.sha.slice(0,7); s.lastPushTime=commit.commit?.committer?.date || s.lastPushTime; s.status='SYNCED'; s.github='SYNCED'; }
        const runs=await fetch(`https://api.github.com/repos/${repo}/actions/runs?branch=main&per_page=1`).then(r=>r.ok?r.json():null);
        const run=runs?.workflow_runs?.[0];
        if(run){ s.deployment = run.status==='completed' ? (run.conclusion==='success'?'SUCCESS':'FAILED') : 'IN_PROGRESS'; }
      }catch(e){ s.deployment = s.deployment || 'UNKNOWN'; }
    }

    function toast(msg){ let el=$('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.className='fixed left-4 right-4 top-4 z-50 rounded-2lg border border-bull-500/50 bg-neutral-900 p-3 text-center font-black text-bull-400 md:left-auto md:w-96'; document.body.appendChild(el);} el.textContent=msg; clearTimeout(window.__toast); window.__toast=setTimeout(()=>el.remove(),1800); }
    function card(title, body, href, meta=''){ return `<a href="${href}" class="block rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5 shadow-dark-outline active:scale-[.99]"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(meta)}</p><h3 class="mt-1 text-2xl font-black">${esc(title)}</h3><p class="mt-2 text-sm text-neutral-300">${esc(body)}</p></a>`; }
    async function load(){ for(const f of files){ const r=await fetch(`data/${f}.json?v=${Date.now()}`); if(!r.ok) throw new Error(`Missing data/${f}.json`); DATA[f]=await r.json(); } $('repoLink').href=DATA.project.githubRepo; window.addEventListener('hashchange', render); $('search').addEventListener('keydown', e=>{ if(e.key==='Enter') go('#/search') }); render(); }
    function counts(){ return DATA.index.counts; }
    function directorRecommendation(){
      const tasks=DATA['development-tasks'];
      const order={High:3,Medium:2,Low:1};
      return [...tasks].filter(t=>['NEXT','ACTIVE','BLOCKED'].includes(t.status)).sort((a,b)=>(order[b.priority]||0)-(order[a.priority]||0))[0];
    }
    
function syncColor(status){ return status==='SYNCED' ? 'bull' : status==='SYNC_ERROR' ? 'bear' : 'primary'; }
function githubStatusPanel(){
  const s=DATA['github-sync-status']||{}, h=DATA['change-history']||{entries:[]}, color=syncColor(s.status);
  const icon=s.status==='SYNCED'?'🟢':s.status==='SYNC_ERROR'?'🔴':'🟡';
  const command=`npm run precommit:verify && npm run sync:github -- ${s.commitMessage||'chore: sync approved titan gates changes'}`;
  return `<section class="rounded-3xl border border-${color}-500/40 bg-${color}-950/10 p-5">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div><p class="text-xs font-black uppercase tracking-[.35em] text-${color}-400">GitHub Status</p><h3 class="mt-1 text-3xl font-black">${icon} ${esc(s.status||'UNKNOWN')}</h3><p class="mt-2 text-neutral-300">GitHub main is the authoritative source of truth. Do not call a change complete until it is pushed and verified.</p></div>
      <div class="rounded-2lg border border-neutral-800 bg-neutral-950 p-3 text-sm"><b>BUILD</b> ${esc(s.build||'—')}<br/><b>GITHUB</b> ${esc(s.github||'—')}<br/><b>DEPLOYMENT</b> ${esc(s.deployment||'—')}</div>
    </div>
    <div class="mt-4 grid gap-2 md:grid-cols-4">
      <div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Version</p><b>${esc(s.version||DATA.project.version)}</b></div>
      <div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Commit</p><b>${esc(s.commit||'pending')}</b></div>
      <div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Last GitHub Push</p><b>${esc(s.lastPushTime||'pending')}</b></div>
      <div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Previous Stable</p><b>${esc(s.previousStableVersion||DATA.project.previousStableVersion||'—')}</b></div>
    </div>
    <div class="mt-4 rounded-2lg border border-neutral-800 bg-neutral-950 p-4">
      <div class="flex flex-wrap items-center justify-between gap-2"><div><p class="text-xs font-black uppercase tracking-[.24em] text-primary">Manual Push Backup</p><p class="text-neutral-300">Runs validate → build → Visual QA → secret scan → commit → push. Requires secure local/GitHub Actions authentication; never browser tokens.</p></div><button onclick="copyText(${JSON.stringify(command)},'Manual push command copied')" class="rounded-2lg bg-primary px-4 py-3 font-black text-white">Push to GitHub</button></div>
    </div>
    <div class="mt-4 grid gap-2 md:grid-cols-2">${(h.entries||[]).slice(0,4).map(e=>`<article class="rounded-2lg border border-neutral-800 bg-neutral-950 p-3"><p class="text-xs font-black uppercase tracking-[.2em] text-neutral-500">${esc(e.status)} · ${esc(e.version)}</p><h4 class="text-xl font-black">${esc(e.summary)}</h4><p class="text-sm text-neutral-400">Commit ${esc(e.commit||'pending')}</p></article>`).join('')}</div>
  </section>`;
}

      </div>
      ${githubStatusPanel()}

      <section class="grid gap-3 md:grid-cols-3">${[
        ['Titan Gates Mini App','Open the live Mini App export with playable campaign shell, faction copy packs, Lore Codex copy buttons, Art Needs, validation, and simulator tools.','mini-app/galaxy-reapers-ascension.html','Mini App'],['Game','Open the playable Titan Gates build.','#/game','Play'],['Tactical Map Prototype','Play the mobile isometric battle prototype with Realm terrain, 2D tokens, movement, attack, enemy phase, and camera modes.','game/tactical-map-prototype.html','Prototype'],['Game Preview','Open the current development preview with device presets and Dev/Player view.','game/preview.html','Visual'],['Visual QA','Review screen status, warnings, baselines, and affected changes.','#/visual-qa','Review'],['Lore Codex','Read canon lore, timeline, Realms, powers, and history.','#/lore','Canon'],['Titans','Browse all 63 Titan profiles and prompts.','#/titans','Database'],['Characters','Browse non-playable campaign character records.','#/characters','NPCs'],['Creatures','Browse Hollow, Gateborn, Beast Realm, Forgotten, and world boss threats.','#/creatures','Threats'],['Hollow Threat','Open the Hollow hostile faction, encounter pools, campaign use rules, and breach event roster.','#/hollow','Enemy Faction'],['Maps','Open tactical and campaign maps with hazards and objectives.','#/maps','World'],['Campaigns','Browse acts, chapters, maps, NPCs, and creatures.','#/campaigns','Campaign'],['Campaign Architecture','Overview for faction campaign architecture, Normal/Elite mission totals, audit status, and next build target.','#/missions','System'],['Story Arcs','Campaign arcs, faction consequences, and next hooks.','#/storylines','Story'],['Endgame Dashboard','Clean mobile overview for 5-Titan squads, Ascension, Async Arena, Trials, Raids, Seasons, and next goals.','#/endgame','5 Titans'],['Dialogue Viewer','Browse mission intro, mid-battle, low-health, victory, defeat, and post-mission lines by campaign and chapter.','#/dialogue','Script'],['Factions','Open seven Realm faction pages.','#/factions','Realms'],['Art Map Prompts','Open every tactical map art prompt and click any prompt body to copy it.','#/art?category=Map','Clipboard'],['Art Import Queue','Attach generated images to the right prompt/entity, save local review records, and export artwork JSON.','#/art-import','Import'],['Art Studio','Copy prompts and register artwork safely.','#/art','Production'],['Development','View active, next, blocked, and completed tasks.','#/dev','Tasks'],['Directors','View governance authority by Director.','#/directors','Governance'],['GitHub Repository','Open the source of truth.','#/github','Source']
      ].map(x=>card(x[0],x[1],x[2],x[3])).join('')}</section></section>`; }
    function game(){ return `<section class="space-y-4"><h2 class="text-4xl font-black">Game</h2><div class="grid gap-3 md:grid-cols-2">${card('Titan Gates Mini App','Open the latest Mini App export: playable campaign shell, faction copy packs, content database, Art Needs, simulator, and validation.','mini-app/galaxy-reapers-ascension.html','Mini App')}${card('Play First Build','5-Titan strike force tactical Gate encounter.','game/index.html','Playable')}${card('Tactical Map Prototype','Mobile isometric battlefield: Realm terrain, 2D combatants, movement, attacks, enemy phase, and camera modes.','game/tactical-map-prototype.html','Prototype')}${card('Legacy Dev Platform','Open the preserved original development platform export.','titan-gates-dev-platform.html','Archive')}</div><iframe class="mt-4 h-[70vh] w-full rounded-3xl border border-neutral-800 bg-neutral-900" src="game/index.html"></iframe></section>`; }
    function lore(){ return listPage('Lore Codex', DATA['lore-index'], x=>`<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(x.id)} · ${esc(x.category)}</p><h3 class="mt-1 text-2xl font-black">${esc(x.title)}</h3><p class="mt-2 text-neutral-300">${esc(x.summary)}</p><a class="mt-4 inline-block rounded-2lg bg-primary px-4 py-2 font-black text-white" href="${esc(x.file)}">Open File</a></article>`); }

    function hollowThreat(){ const h=DATA['hollow-faction']||{}, sys=DATA['hollow-encounter-system']||{pools:{},sampleMissionInjectors:[]}; const roster=(DATA.creatures||[]).filter(c=>(sys.roster||[]).includes(c.id)); return `<section class="space-y-4"><div class="rounded-3xl border border-red-500/40 bg-red-950/20 p-5"><p class="text-xs font-black uppercase tracking-[.28em] text-red-300">Hostile Threat Faction · Non-playable</p><h2 class="mt-1 text-5xl font-black">${esc(h.name||'The Hollow')}</h2><p class="mt-2 text-neutral-200">${esc(h.canonRule)}</p><div class="mt-4 grid grid-cols-2 gap-2 md:grid-cols-5"><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Roster</p><b class="text-2xl">${roster.length}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Pools</p><b class="text-2xl">${Object.keys(sys.pools||{}).length}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Playable</p><b>${h.playable?'YES':'NO'}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Use</p><b>Campaign/Event</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Passive</p><b>Hollowing</b></div></div></div><div class="grid gap-4 xl:grid-cols-[1fr_1fr]"><article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-red-300">Doctrine</p><p class="mt-2 text-neutral-300"><b>Philosophy:</b> ${esc(h.philosophy)}</p><p class="mt-2 text-neutral-300"><b>Combat:</b> ${esc(h.combatPhilosophy)}</p><p class="mt-2 text-neutral-300"><b>Passive:</b> ${esc(h.factionPassive)}</p></article><article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-red-300">Usable In</p><div class="mt-3 flex flex-wrap gap-2">${(h.campaignUse||[]).map(x=>`<span class="rounded-xl bg-neutral-950 px-3 py-2 text     function factions(){ return listPage('Factions', DATA.factions, f=>`<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(f.id)} · ${esc(f.inspiration)}</p><h3 class="mt-1 text-3xl font-black">${esc(f.name)}</h3><p class="mt-2 text-neutral-300">${esc(f.culture)}</p><div class="mt-3 rounded-2lg bg-neutral-950 p-3 text-sm text-neutral-300"><b>Combat:</b> ${esc(f.combatPhilosophy)}<br><b>Mixing:</b> ${esc(f.mixingRule)}</div><a href="#/titans?faction=${esc(f.slug)}" class="mt-3 inline-block rounded-2lg bg-primary px-4 py-2 font-black text-white">View Titans</a></article>`); }

    function backstoryDetail(){ const id=new URLSearchParams(location.hash.split('?')[1]||'').get('id'); const b=(DATA['character-backstories']||[]).find(x=>x.id===id)||(DATA['character-backstories']||[])[0]||{}; const entity=[...(DATA.titans||[]),...(DATA.npcs||[]),...(DATA.creatures||[])].find(x=>x.id===b.entityId)||{}; return `<section class="space-y-4"><div class="rounded-3xl border border-primary/40 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.28em] text-primary">${esc(b.entityType)} Backstory · ${esc(b.id)}</p><h2 class="mt-1 text-4xl font-black">${esc(b.name)}</h2><p class="mt-2 text-neutral-300">${esc(b.shortBackstory)}</p><div class="mt-4 grid grid-cols-2 gap-2 md:grid-cols-5"><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Faction / Realm</p><b>${esc(b.faction||'Threat')}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Type</p><b>${esc(b.entityType)}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Role</p><b>${esc(b.role)}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Story Arcs</p><b>${esc((b.storyArcIds||[]).length)}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Entity</p><b>${esc(b.entityId)}</b></div></div></div><div class="grid gap-4 xl:grid-cols-[2fr_1fr]"><article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">Readable Background</p>${(b.chapters||[]).map(ch=>`<section class="mt-4 rounded-2lg bg-neutral-950 p-4"><h3 class="text-xl font-black">${esc(ch.title)}</h3><p class="mt-2 leading-relaxed text-neutral-300">${esc(ch.text)}</p></section>`).join('')}</article><aside class="space-y-4"><article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">Lore Ties</     function dialogueViewer(){
      const params=new URLSearchParams(location.hash.split('?')[1]||'');
      const selected=params.get('campaign') || 'all';
      const campaigns=DATA.campaigns||[], chapters=DATA.chapters||[], scripts=DATA['dialogue-scripts']||[];
      const campaignById=Object.fromEntries(campaigns.map(c=>[c.id,c]));
      const chapterById=Object.fromEntries(chapters.map(c=>[c.id,c]));
      const beatLabels={missionIntro:'Mission Intro',midBattlePressure:'Mid-Battle Pressure',lowHealthWarning:'Low-Health Warning',victory:'Victory',defeat:'Defeat / Fallback',postMission:'Post-Mission Consequence'};
      const filtered=scripts.filter(s=>selected==='all'||s.campaignId===selected).sort((a,b)=>String(a.chapterId).localeCompare(String(b.chapterId)));
      const totalLines=filtered.reduce((n,s)=>n+Object.values(s.beats||{}).reduce((m,lines)=>m+(lines||[]).length,0),0);
      const tabs=['all',...campaigns.map(c=>c.id)].map(id=>`<a href="#/dialogue${id==='all'?'':'?campaign='+esc(id)}" class="rounded-2lg border ${selected===id?'border-primary bg-primary text-white':'border-neutral-800 bg-neutral-900 text-neutral-300'} px-3 py-2 text-sm font-black">${id==='all'?'All Campaigns':esc(campaignById[id]?.name||id)}</a>`).join('');
      return `<section class="space-y-4"><div class="rounded-3xl border border-primary/40 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.28em] text-primary">Script System</p><h2 class="mt-1 text-4xl font-black">Dialogue Viewer</h2><p class="mt-2 text-neutral-300">Mission-ready lines grouped by campaign, chapter, and tactical beat. Tone remains ancient, restrained, strategic, and canon-safe.</p><div class="mt-4 grid grid-cols-2 gap-2 md:grid-cols-4"><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Chapters Shown</p><b class="text-2xl">${filtered.length}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Lines Shown</p><b class="text-2xl">${totalLines}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Beat Types</p><b class="text-2xl">6</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Canon Rule</p><b class="text-lg">Titan-only</b></div></div><div class="mt-4 flex flex-wrap gap-2">${tabs}</div></div><div class="grid gap-4">${filtered.map(s=>{ const ch=chapterById[s.chapterId]||{}, camp=campaignById[s.campaignId]||{}; return `<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><div class="flex flex-wrap items-start justify-between gap-3"><div><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(s.chapterId)} · ${esc(camp.name||s.campaignId)}</p><h3 class="mt-1 text-2xl font-black"><a class="hover:text-primary" href="#/chapter?id=${esc(s.chapterId)}">${esc(s.chapterTitle||ch.title)}</a></h3><p class="mt-1 text-sm text-neutral-400">${esc(s.tone)} · ${esc(s.status)}</p></div><button onclick="copyText(${JSON.stringify(JSON.stringify(s,null,2))},'Dialogue JSON copied')" class="rounded-2lg bg-primary px-3 py-2 font-black text-white">Copy JSON</button></div><div class="mt-4 grid gap-3 md:grid-cols-2 xl:grid-cols-3">${Object.entries(beatLabels).map(([beat,label])=>`<section class="rounded-2lg border border-neutral-800 bg-neutral-950 p-4"><p class="text-xs font-black uppercase tracking-[.2em] text-amber-300">${esc(label)}</p>${(s.beats?.[beat]||[]).map(line=>`<blockquote class="mt-3 border-l-2 border-primary pl-3 text-neutral-200"><b class="text-primary">${esc(line.speaker)}</b><br/>“${esc(line.text)}”</blockquote>`).join('')}</section>`).join('')}</div></article>`; }).join('')}</div></section>`;
    }

    function chapterDetail(){
      const params=new URLSearchParams(location.hash.split('?')[1]||'');
      const id=params.get('id') || DATA.chapters?.[0]?.id;
      const ch=(DATA.chapters||[]).find(x=>x.id===id) || DATA.chapters?.[0] || {};
      const camp=(DATA.campaigns||[]).find(x=>x.id===ch.campaignId) || {};
      const map=(DATA.maps||[]).find(x=>x.id===ch.mapId) || {};
      const script=(DATA['dialogue-scripts']||[]).find(x=>x.chapterId===ch.id) || {beats:{}};
      const lore=(DATA['lore-index']||[]).filter(x=>(ch.unlocks||[]).includes(x.id) || x.title===camp.name+' — Campaign Lore' || (x.title||'').includes(camp.name));
      const npcs=(DATA.npcs||[]).filter(n=>(camp.npcs||[]).includes(n.id) || (ch.unlocks||[]).includes(n.id));
      const creatures=(DATA.creatures||[]).filter(c=>(camp.creatures||[]).includes(c.id));
      const siblings=(DATA.chapters||[]).filter(x=>x.campaignId===ch.campaignId);
      const beatLabels={missionIntro:'Mission Intro',midBattlePressure:'Mid-Battle Pressure',lowHealthWarning:'Low-Health Warning',victory:'Victory',defeat:'Defeat / Fallback',postMission:'Post-Mission Consequence'};

      return `<section class="space-y-4"><div class="rounded-3xl border border-primary/40 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.28em] text-primary">Mission Detail · ${esc(m.id)}</p><h2 class="mt-1 text-4xl font-black">${esc(m.title)}</h2><p class="mt-2 text-neutral-300">${esc(m.description)}</p><div class="mt-4 grid grid-cols-2 gap-2 md:grid-cols-5"><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Type</p><b>${esc(m.campaignType)}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Chapter</p><b>${esc(m.chapter)}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Mission</p><b>${esc(m.missionNumber)}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Power</p><b>${esc(m.recommendedPower)}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Team</p><b>${esc(m.teamSize)} Titans</b></div></div></div>
      <div class="grid gap-4 xl:grid-cols-2"><article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">Objectives</p><h3 class="mt-1 text-2xl font-black">Primary</h3><p class="mt-2 rounded-2lg bg-neutral-950 p-3">${esc(m.objectives?.primary)}</p><h3 class="mt-4 text-xl font-black">Optional</h3>${(m.objectives?.optional||[]).map(o=>`<p class="mt-2 rounded-xl border border-neutral-800 p-3 text-neutral-300">${esc(o)}</p>`).join('')}<h3 class="mt-4 text-xl font-black">Victory / Defeat</h3><p class="mt-2 text-sm text-bull-300">${esc((m.victoryConditions||[]).join(' · '))}</p><p class="mt-1 text-sm text-red-300">${esc((m.defeatConditions||[]).join(' · '))}</p></article>
      <article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">Encounter</p><h3 class="mt-1 text-2xl font-black">Terrain & Waves</h3><p class="mt-2 text-neutral-300">${esc(m.terrain)}</p>${(m.enemyWaves||[]).map(w=>`<p class="mt-2 rounded-xl bg-neutral-950 p-3"><b>Wave ${esc(w.wave)}:</b> ${esc((w.enemyIds||[]).join(', '))}<br/><span class="text-sm text-neutral-400">${esc(w.entry)} · ${esc(w.trigger||'opening deployment')}</span></p>`).join('')}<p class="mt-3 text-sm text-amber-300"><b>Boss:</b> ${esc(m.boss?.enemyId||'None')}</p></article></div>
      <div class="grid gap-4 xl:grid-cols-2"><article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">Dialogue</p>${Object.entries(dlg.lines||{}).map(([beat,lines])=>`<section class="mt-3 rounded-2lg bg-neutral-950 p-3"><b class="text-primary">${esc(beat)}</b>${(lines||[]).map(l=>`<blockquote class="mt-2 border-l-2 border-primary pl-3 text-neutral-200">${esc(l.speaker)}: “${esc(l.text)}”</blockquote>`).join('')}</section>`).join('')}<button onclick="copyText(${JSON.stringify(JSON.stringify(dlg,null,2))},'Mission dialogue copied')" class="mt-4 rounded-2lg bg-primary px-3 py-2 font-black text-white">Copy Dialogue JSON</button></article>
      <article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">Art Package</p><p class="mt-2 text-neutral-300">${esc(art.mapEnvironmentPrompt)}</p><p class="mt-3 text-sm text-neutral-400"><b>Objective Art:</b> ${esc(art.objectiveArtworkRequirements)}</p><p class="mt-2 text-sm text-neutral-400"><b>VFX:</b> ${esc((art.vfxRequirements||[]).join(', '))}</p><button onclick="copyText(${JSON.stringify(JSON.stringify(art,null,2))},'Mission art package copied')" class="mt-4 rounded-2lg bg-primary px-3 py-2 font-black text-white">Copy Art JSON</button></article></div></section>`;
    }
    function campaignAudit(){ const audit=DATA['campaign-audit']||{findings:[]}; return `<section class="space-y-4"><h2 class="text-4xl font-black">Campaign Audit</h2><div class="grid gap-3">${(audit.findings||[]).map(f=>`<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(f.director)} · ${esc(f.severity)}</p><h3 class="mt-1 text-2xl font-black">${esc(f.issue)}</h3><p class="mt-2 text-neutral-300">${esc(f.resolution)}</p></article>`).join('')}</div></section>`; }
    function artFilterTabs(active){
      const tabs=[['all','All Prompts'],['Campaign','Campaign Art'],['Map','Map Art'],['Titan','Titans'],['NPC','NPCs'],['Creature','Creatures']];
      return `<div class="flex flex-wrap gap-2">${tabs.map(([key,label])=>`<a href="#/art${key==='all'?'':'?category='+esc(key)}" class="rounded-2lg border ${active===key?'border-primary bg-primary text-white':'border-neutral-800 bg-neutral-900 text-neutral-300'} px-3 py-2 text-sm font-black">${esc(label)}</a>`).join('')}</div>`;
    }
    function art(){ const params=new URLSearchParams(location.hash.split('?')[1]||''); const entity=params.get('entity'); const category=params.get('category')||'all'; const prompts=DATA['art-prompts'].filter(p=>(!entity||p.entityId===entity)&&(category==='all'||p.category===category)); const index=DATA.index||{}; const mapPromptCount=index.counts?.artMapPrompts ?? DATA['art-prompts'].filter(p=>p.category==='Map').length; const campaignPromptCount=index.counts?.artCampaignPrompts ?? DATA['art-prompts'].filter(p=>p.category==='Campaign').length; const mapCampaignCount=mapPromptCount+campaignPromptCount; return `<section class="space-y-4"><h2 class="text-4xl font-black">Art Studio</h2><div class="rounded-3xl border border-primary/40 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">Clipboard-Ready Production Prompts</p><h3 class="mt-1 text-3xl font-black">Map & Campaign Art Queue</h3><p class="mt-2 text-neutral-300">Browse, filter, and copy production prompts for campaign key art, tactical maps, Titans, NPCs, and threats. Tap any prompt body or copy button to place it on your clipboard.</p><textarea id="mobileClipboardFallback" class="hidden mt-3 min-h-32 w-full rounded-2lg border border-primary/50 bg-neutral-950 p-3 text-xs text-neutral-200" readonly aria-label="Mobile clipboard fallback"></textarea><div class="mt-4 grid grid-cols-2 gap-2 md:grid-cols-4"><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Shown</p><b class="text-2xl">${prompts.length}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Map + Campaign</p><b class="text-2xl">${mapCampaignCount}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Campaigns</p><b class="text-2xl">${campaignPromptCount}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Maps</p><b class="text-2xl">${mapPromptCount}</b></div></div><div class="mt-4">${artFilterTabs(category)}</div></div><div class="rounded-3xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-neutral-300">GitHub Pages is presentation only. It never stores a personal token. Import finished artwork by adding images to repository folders and registering metadata in <code>data/artworks.json</code>. Safe folders: <code>art/imported</code>, <code>art/concepts</code>, <code>art/approved</code>, <code>art/reference</code>.</p><div class="mt-3 grid gap-2 md:grid-cols-3"><input id="assetName" class="rounded-2lg border border-neutral-700 bg-neutral-950 p-3" placeholder="image filename.png"/><input id="assetEntity" class="rounded-2lg border border-neutral-700 bg-neutral-950 p-3" placeholder="TG-TITAN-001"/><button onclick="makeArtworkRecord()" class="rounded-2lg bg-primary p-3 font-black text-white">Generate Artwork Metadata</button></div><pre id="artRecord" class="mt-3 overflow-auto rounded-2lg bg-neutral-950 p-3 text-xs text-neutral-300"></pre></div><div class="grid gap-3 md:grid-cols-2">${prompts.map(promptCard).join('')}</div></section>`; }
    function promptCard(p){ const full=p.prompt+'\n\nNEGATIVE PROMPT:\n'+(p.negativePrompt||''); return `<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-4 md:p-5" data-art-prompt-card="${esc(p.id)}"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(p.id)} · ${esc(p.category)} · ${esc(p.status)}</p><h3 class="mt-1 text-2xl font-black">${esc(p.entity)}</h3><button type="button" data-copy-prompt="${esc(p.id)}" data-mobile-copy="prompt-body" data-copy-text="${esc(p.prompt)}" data-copy-label="${esc(p.category)} prompt copied" aria-label="Copy ${esc(p.entity)} art prompt" onclick="copyText(this.dataset.copyText,this.dataset.copyLabel)" class="mt-3 block min-h-[96px] w-full touch-manipulation select-text rounded-2lg border border-primary/40 bg-neutral-950 p-4 text-left text-base leading-relaxed text-neutral-100 shadow-inner transition hover:border-primary hover:bg-primary/10 active:scale-[.99] active:border-primary"><span class="mb-2 block select-none text-xs font-black uppercase tracking-[.2em] text-primary">Tap prompt to copy</span><span class="line-clamp-6">${esc(p.prompt)}</span></button><details class="mt-3 rounded-2lg border border-neutral-800 bg-neutral-950 p-3"><summary class="cursor-pointer text-sm font-black text-neutral-200">Negative Prompt</summary><button type="button" data-mobile-copy="negative-prompt" data-copy-text="${esc(p.negativePrompt||'')}" data-copy-label="Negative prompt copied" onclick="copyText(this.dataset.copyText,this.dataset.copyLabel)" class="mt-3 block min-h-20 w-full touch-manipulation rounded-xl bg-neutral-900 p-3 text-left text-sm leading-relaxed text-neutral-300 active:scale-[.99]">${esc(p.negativePrompt||'No negative prompt registered')}</button></details><div class="mt-4 grid grid-cols-1 gap-2 sm:grid-cols-2 lg:flex lg:flex-wrap"><button type="button" data-mobile-copy="copy-prompt-button" data-copy-text="${esc(p.prompt)}" data-copy-label="Prompt copied" onclick="copyText(this.dataset.copyText,this.dataset.copyLabel)" class="min-h-12 touch-manipulation rounded-2lg bg-primary px-4 py-3 text-center font-black text-white active:scale-[.98]">Copy Prompt</button><button type="button" data-mobile-copy="copy-full-button" data-copy-text="${esc(full)}" data-copy-label="Full prompt copied" onclick="copyText(this.dataset.copyText,this.dataset.copyLabel)" class="min-h-12 touch-manipulation rounded-2lg border border-neutral-700 px-4 py-3 text-center font-black active:scale-[.98]">Copy Full Prompt</button><button type="button" data-import-prompt="${esc(p.id)}" onclick="importPromptFromCard(this.dataset.importPrompt)" class="min-h-12 touch-manipulation rounded-2lg border border-bull-600 bg-bull-950/30 px-4 py-3 text-center font-black text-bull-300 active:scale-[.98]">Import Art</button><a href="game/preview.html?screen=${p.category==='Map'?'campaign':p.category==='Creature'?'battle':p.category==='NPC'?'character-profile':'titan-profile'}&entity=${esc(p.entityId)}" class="min-h-12 rounded-2lg border border-amber-700 bg-amber-950/40 px-4 py-3 text-center font-black text-amber-300 no-underline">Preview In Game</a></div></article>`; }
    function makeArtworkRecord(){ const file=$('assetName').value.trim(), entity=$('assetEntity').value.trim(); const ok=/\.(png|jpg|jpeg|webp)$/i.test(file); const rec= ok ? {id:'TG-ART-'+Date.now(),entityId:entity,status:'Pending Review',type:'Concept',file:'art/imported/'+file,version:1,created:new Date().toISOString().slice(0,10)} : {error:'Invalid image extension. Use PNG, JPG, JPEG, or WEBP only.'}; $('artRecord').textContent=JSON.stringify(rec,null,2); if(ok) copyText(JSON.stringify(rec,null,2),'Artwork metadata copied'); }

    function artImportPage(){
      const params=new URLSearchParams(location.hash.split('?')[1]||''); const selected=params.get('prompt')||''; const q=artImportQueue(); const pipe=DATA['art-import-pipeline']||{};
      setTimeout(()=>{ if(selected && $('importPromptId')){ $('importPromptId').value=selected; syncImportPromptFields(); } },0);
      return `<section class="space-y-4"><div class="rounded-3xl border border-primary/40 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">Art Import Queue</p><h2 class="mt-1 text-4xl font-black">Attach generated art to the proper record</h2><p class="mt-2 text-neutral-300">Generated art can be matched to a prompt/entity, saved into a local review queue, and exported as artwork metadata for repository registration.</p><p class="mt-3 rounded-2lg bg-neutral-950 p-3 text-sm text-neutral-400">${esc(pipe.storagePolicy||'Local review queue only; export JSON for repository registration.')}</p><div class="mt-4 grid grid-cols-2 gap-2 md:grid-cols-4"><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Queue</p><b class="text-2xl">${q.length}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Safe Folders</p><b class="text-2xl">${esc((pipe.safeFolders||[]).length)}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Prompt Records</p><b class="text-2xl">${esc((DATA['art-prompts']||[]).length)}</b></div><div class="rounded-2lg bg-neutral-950 p-3"><p class="text-xs text-neutral-400">Repository Art</p><b class="text-2xl">${esc((DATA.artworks||[]).length)}</b></div></div></div>
      <article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">New Import</p><div class="mt-3 grid gap-3 md:grid-cols-2"><label class="block"><span class="text-xs font-black uppercase tracking-[.18em] text-neutral-400">Prompt / Entity</span><select id="importPromptId" onchange="syncImportPromptFields()" class="mt-2 w-full rounded-2lg border border-neutral-700 bg-neutral-950 p-3"><option value="">Choose generated prompt…</option>${artPromptOptions()}</select></label><label class="block"><span class="text-xs font-black uppercase tracking-[.18em] text-neutral-400">Generated image filename</span><input id="importFileName" class="mt-2 w-full rounded-2lg border border-neutral-700 bg-neutral-950 p-3" placeholder="aten-ra-map-final.png"/></label><label class="block"><span class="text-xs font-black uppercase tracking-[.18em] text-neutral-400">Entity ID</span><input id="importEntityId" class="mt-2 w-full rounded-2lg border border-neutral-700 bg-neutral-950 p-3" placeholder="TG-MAP-001"/></label><label class="block"><span class="text-xs font-black uppercase tracking-[.18em] text-neutral-400">Entity Name</span><input id="importEntityName" class="mt-2 w-full rounded-2lg border border-neutral-700 bg-neutral-950 p-3" placeholder="The First Reopening Gate"/></label><label class="block"><span class="text-xs font-black uppercase tracking-[.18em] text-neutral-400">Category</span><input id="importCategory" class="mt-2 w-full rounded-2lg border border-neutral-700 bg-neutral-950 p-3" placeholder="Map"/></label><label class="block"><span class="text-xs font-black uppercase tracking-[.18em] text-neutral-400">Source</span><input id="importSource" class="mt-2 w-full rounded-2lg border border-neutral-700 bg-neutral-950 p-3" placeholder="Midjourney / Firefly / Art Studio" value="Generated Art"/></label></div><div class="mt-4 flex flex-wrap gap-2"><button onclick="previewArtworkImport()" class="rounded-2lg border border-neutral-700 px-3 py-2 font-black">Preview + Copy Metadata</button><button onclick="saveArtworkImport()" class="rounded-2lg bg-primary px-3 py-2 font-black text-white">Save To Import Queue</button><button onclick="exportArtworkImports()" class="rounded-2lg bg-neutral-800 px-3 py-2 font-black">Copy Queue JSON</button><button onclick="clearArtworkImportQueue()" class="rounded-2lg border border-danger-500/60 px-3 py-2 font-black text-danger-300">Clear Queue</button></div><pre id="artImportRecord" class="mt-3 max-h-80 overflow-auto rounded-2lg bg-neutral-950 p-3 text-xs text-neutral-300"></pre></article>
      <div class="grid gap-3 md:grid-cols-2">${q.map(r=>`<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(r.status)} · ${esc(r.category)}</p><h3 class="mt-1 text-2xl font-black">${esc(r.entityName)}</h3><p class="mt-2 text-sm text-neutral-300">${esc(r.file)}</p><p class="mt-2 text-xs text-neutral-500">Prompt: ${esc(r.promptId||'manual')}</p><button onclick="copyText(${JSON.stringify(JSON.stringify(r,null,2))},'Artwork record copied')" class="mt-4 rounded-2lg bg-primary px-3 py-2 font-black text-white">Copy Record</button></article>`).join('')}</div></section>`;
    }

    function visualQA(){ const screens=DATA['visual-screens']||[]; const passed=screens.filter(s=>s.status==='PASS').length; return `<section class="space-y-4"><div class="rounded-3xl border border-neutral-800 bg-neutral-900 p-6"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">Visual QA</p><h2 class="text-4xl font-black">${passed} / ${screens.length} screens passed</h2><p class="mt-2 text-neutral-300">Open Game Preview to inspect current game screens, mobile sizes, Dev View, Player View, warnings, and affected-change rules.</p><div class="mt-4 grid gap-3 sm:grid-cols-2"><a href="game/preview.html" class="rounded-2lg bg-primary px-5 py-4 text-center text-xl font-black text-white no-underline">▶ GAME PREVIEW · Game Preview</a><a href="game/preview.html?screen=titan-selection" class="rounded-2lg border border-amber-700 bg-amber-950/40 px-5 py-4 text-center text-xl font-black text-amber-300 no-underline">Test Titan Selection</a></div></div><div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">${screens.map(s=>`<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(s.id)} · ${esc(s.director)}</p><h3 class="mt-1 text-2xl font-black">${esc(s.name)}</h3><p class="mt-2 text-sm ${s.status==='PASS'?'text-emerald-300':s.status==='FAIL'?'text-red-300':s.status==='WARNING'?'text-amber-300':'text-neutral-400'}">${esc(s.status)}</p><p class="mt-2 text-neutral-300">${esc(s.description)}</p>${(s.warnings||[]).map(w=>`<p class="mt-2 rounded-2lg border border-amber-700 bg-amber-950/30 px-3 py-2 text-amber-200">${esc(w)}</p>`).join('')}<a href="game/preview.html?screen=${esc(s.slug)}" class="mt-4 inline-block rounded-2lg bg-primary px-3 py-2 font-black text-white no-underline">Preview</a></article>`).join('')}</div></section>`; }
    function dev(){ const groups=['ACTIVE','NEXT','BLOCKED','COMPLETED']; return `<section class="space-y-4"><h2 class="text-4xl font-black">Development</h2>${groups.map(g=>`<div><h3 class="mb-2 text-2xl font-black text-primary">${g}</h3><div class="grid gap-3 md:grid-cols-2">${DATA['development-tasks'].filter(t=>t.status===g).map(t=>`<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(t.id)} · ${esc(t.director)} · ${esc(t.priority)}</p><h4 class="mt-1 text-xl font-black">${esc(t.description)}</h4><p class="mt-2 text-sm text-neutral-400">Dependencies: ${esc(t.dependencies.join(', '))}</p><p class="text-sm text-neutral-400">Files: ${esc(t.relatedFiles.join(', '))}</p></article>`).join('')||'<p class="text-neutral-500">None.</p>'}</div></div>`).join('')}</section>`; }
    function directors(){ return listPage('Directors', DATA.directors, d=>`<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(d.id)} · ${esc(d.status)}</p><h3 class="mt-1 text-3xl font-black">${esc(d.name)}</h3><p class="mt-2 text-neutral-300">${esc(d.currentFocus)}</p><p class="mt-3 text-sm text-neutral-400">Authority: ${esc(d.authority.join(', '))}</p></article>`); }
    function search(){ const q=$('search').value.toLowerCase(); const all=[...DATA.titans.map(x=>({...x,type:'Titan'})),...DATA.factions.map(x=>({...x,type:'Faction'})),{...DATA['hollow-faction'],type:'Threat Faction'},...DATA['lore-index'].map(x=>({...x,name:x.title,type:'Lore'})),...DATA['art-prompts'].map(x=>({...x,name:x.entity,type:'Prompt'})),...DATA['development-tasks'].map(x=>({...x,name:x.description,type:'Task'})),...DATA.npcs.map(x=>({...x,type:'NPC'})),...DATA.creatures.map(x=>({...x,type:'Creature'})),...DATA.maps.map(x=>({...x,type:'Map'})),...DATA.campaigns.map(x=>({...x,type:'Campaign'})),...DATA.chapters.map(x=>({...x,name:x.title,type:'Chapter'})),...DATA['dialogue-scripts'].map(x=>({...x,name:x.chapterTitle,type:'Dialogue'})),...DATA['mission-registry'].map(x=>({...x,name:x.title,type:'Mission'})),...(DATA['achievement-system'].achievements||[]).map(x=>({...x,type:'Achievement'}))]; const res=all.filter(x=>JSON.stringify(x).toLowerCase().includes(q)); return listPage(`Search ${q?'· '+q:''}`, res, x=>`<article class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(x.type)} · ${esc(x.id)}</p><h3 class="mt-1 text-2xl font-black">${esc(x.name||x.title||x.entity||x.description)}</h3><p class="mt-2 text-sm text-neutral-300">${esc(x.faction||x.category||x.director||'Titan Gates')}</p></article>`); }
    function listPage(title, items, renderItem){ return `<section class="space-y-4"><h2 class="text-4xl font-black">${esc(title)}</h2><div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">${items.map(renderItem).join('')}</div></section>`; }
    function render(){ const r=(location.hash||'#/').split('?')[0]; const routes={'#/':home,'#/game':game,'#/mini-app':()=>{ location.href='mini-app/galaxy-reapers-ascension.html'; return home(); },'#/lore':lore,'#/factions':factions,'#/hollow':hollowThreat,'#/titans':titans,'#/characters':characters,'#/creatures':creatures,'#/backstories':backstoriesPage,'#/backstory':backstoryDetail,'#/maps':maps,'#/campaigns':campaigns,'#/storylines':storylines,'#/endgame':endgameDashboard,'#/squads':squadSystemPage,'#/arena':asyncArenaPage,'#/ascension':ascensionPage,'#/trials':trialsPage,'#/raids':raidsPage,'#/goals':goalsPage,'#/missions':campaignArchitecture,'#/mission-list':missionList,'#/mission':missionDetail,'#/campaign-audit':campaignAudit,'#/dialogue':dialogueViewer,'#/chapter':chapterDetail,'#/visual-qa':visualQA,'#/sync':()=>`<section class="space-y-4">${githubStatusPanel()}</section>`,'#/art':art,'#/art-import':artImportPage,'#/dev':dev,'#/development':dev,'#/directors':directors,'#/search':search,'#/github':()=>{ location.href=DATA.project.githubRepo; return home(); }}; $('app').innerHTML=(routes[r]||home)(); }
    load().then(refreshGithubLiveStatus).then(render).catch(e=>{ $('app').innerHTML=`<div class="rounded-3xl border border-bear-500 bg-bear-950/20 p-5"><h2 class="text-3xl font-black text-bear-400">Build data failed</h2><p>${esc(e.message)}</p></div>`; console.error(e); });
  </script>
