<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AVALON: THE WAKING GATES — GATE MECHANICS PROTOTYPE (The Tether)</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0a0a10;font-family:Georgia,serif;-webkit-user-select:none;user-select:none;touch-action:none}
  #hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#e8c47a;text-align:center;z-index:10;pointer-events:none;text-shadow:0 2px 6px #000}
  #gstate{font-size:13px;letter-spacing:3px}
  #obj{font-size:13px;margin-top:4px;letter-spacing:1px}
  .barwrap{width:190px;height:9px;background:#1c1410;border:1px solid #4a3218;margin:5px auto 0}
  .blab{font-size:9px;color:#9a8b6f;letter-spacing:2px;margin-top:4px}
  #faithfill{height:100%;width:0%;background:linear-gradient(90deg,#c07010,#ffcf6a)}
  #intfill{height:100%;width:100%;background:linear-gradient(90deg,#3a6a8a,#7ac0d8)}
  #linkfill{height:100%;width:100%;background:linear-gradient(90deg,#8a2a10,#ff5a10)}
  .btn{position:fixed;z-index:10;padding:16px 14px;background:rgba(30,22,14,.85);border:1px solid #7a5a2a;color:#e8c47a;font-size:14px;letter-spacing:1px;border-radius:12px;text-align:center;line-height:1.1}
  .btn small{display:block;font-size:9px;color:#a8895a;letter-spacing:1px;margin-top:2px}
  .btn:active{background:#4a3214}
  #btnA{right:20px;bottom:20px}
  #btnB{right:108px;bottom:64px}
  #btnRite{left:20px;bottom:20px;display:none;border-color:#ffcf6a}
  .pop{position:fixed;color:#ffcf6a;font-size:13px;letter-spacing:1px;text-shadow:0 2px 4px #000;pointer-events:none;z-index:12;white-space:nowrap}
  .pop.heavy{font-size:16px;color:#ffe8b0}
  #overlay{display:none;position:fixed;inset:0;background:rgba(4,3,2,.92);z-index:20;color:#e8c47a;text-align:center}
  #overlay .big{margin-top:28vh;font-size:26px;letter-spacing:5px;text-shadow:0 4px 12px #000}
  #overlay .stats{margin-top:14px;font-size:13px;color:#9a8b6f;line-height:1.9}
  #overlay .btn{position:relative;display:inline-block;margin:26px auto 0;left:0;right:0}
</style>
</head>
<body>
<div id="hud">
  <div id="gstate">THE CINDER GATE — DORMANT</div>
  <div id="obj">OBJECTIVE: BANK 100 FAITH — FELL THE HOLLOW WISPS</div>
  <div class="blab">GATE CHARGE (BANKED FAITH)</div>
  <div class="barwrap"><div id="faithfill"></div></div>
  <div class="blab">GATE INTEGRITY</div>
  <div class="barwrap"><div id="intfill"></div></div>
  <div class="blab" id="linklab" style="display:none">ESSENCE LINK — DISTANCE TO GATE</div>
  <div class="barwrap" id="linkwrap" style="display:none"><div id="linkfill"></div></div>
</div>
<div class="btn" id="btnA">SLASH<small>SPRITE</small></div>
<div class="btn" id="btnB">ROLL<small>DODGE</small></div>
<div class="btn" id="btnRite">RITE<small>KINDLE THE GATE</small></div>
<div id="overlay">
  <div class="big" id="obig"></div>
  <div class="stats" id="ostats"></div>
  <div class="btn" onclick="location.reload()">RUN IT AGAIN</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  // ============ CORE ============
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x2a2a30, 60, 300);   // DORMANT grey-cold fog
  const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 600);
  scene.add(new THREE.HemisphereLight(0x6a6a7a, 0x14101a, 0.9));
  const sun = new THREE.DirectionalLight(0x9a9aa8, 0.7); sun.position.set(50, 90, 30); scene.add(sun);

  const groundMat = new THREE.MeshStandardMaterial({color:0x4a4448, roughness:1});  // dormant grey-ash
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), groundMat);
  ground.rotation.x = -Math.PI/2; scene.add(ground);
  function box(w,h,d,mat,x,y,z,parent){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); (parent||scene).add(m); return m; }

  // ============ POPUPS / PARTICLES ============
  const popups = []; const v3 = new THREE.Vector3();
  function popup(text, worldPos, heavy){
    const el = document.createElement('div');
    el.className = 'pop' + (heavy ? ' heavy' : ''); el.textContent = text;
    document.body.appendChild(el);
    popups.push({el, pos:worldPos.clone(), t:0});
  }
  function updatePopups(dt){
    for (let i=popups.length-1;i>=0;i--){
      const p = popups[i]; p.t += dt;
      if (p.t > 1.4){ p.el.remove(); popups.splice(i,1); continue; }
      v3.copy(p.pos); v3.y += 2 + p.t*2.5; v3.project(camera);
      if (v3.z > 1){ p.el.style.display='none'; continue; }
      p.el.style.display='block';
      p.el.style.left = ((v3.x*0.5+0.5)*innerWidth) + 'px';
      p.el.style.top = ((-v3.y*0.5+0.5)*innerHeight) + 'px';
      p.el.style.opacity = Math.max(0, 1 - p.t/1.4);
    }
  }
  const particles = [];
  const partGeo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
  function burst(pos, color, n, power, size){
    if (particles.length > 160) return;
    for (let i=0;i<n;i++){
      const m = new THREE.Mesh(size ? new THREE.BoxGeometry(size,size,size) : partGeo, new THREE.MeshBasicMaterial({color, transparent:true, opacity:1}));
      m.position.copy(pos);
      particles.push({m, vel:new THREE.Vector3((Math.random()-.5)*power, Math.random()*power*0.8, (Math.random()-.5)*power), life:0.9+Math.random()*0.5});
      scene.add(m);
    }
  }

  // ============ THE CINDER GATE ============
  const GATE = new THREE.Vector3(0, 0, -60);
  const gateStone = new THREE.MeshStandardMaterial({color:0x6a6670, roughness:1});
  const gateGrp = new THREE.Group();
  const pillarL = box(6, 44, 6, gateStone, -10, 22, 0, gateGrp);
  const pillarR = box(6, 44, 6, gateStone, 10, 22, 0, gateGrp);
  const lintel = box(26, 6, 7, gateStone, 0, 47, 0, gateGrp);
  // heart sigil
  const heart = new THREE.Mesh(new THREE.RingGeometry(2.2, 3.4, 6), new THREE.MeshBasicMaterial({color:0x3a3a44, transparent:true, opacity:0.6, side:THREE.DoubleSide}));
  heart.position.set(0, 20, 3.2); gateGrp.add(heart);
  // glow plane (behind pillars)
  const gateGlow = new THREE.Mesh(new THREE.PlaneGeometry(13, 40), new THREE.MeshBasicMaterial({color:0xff5a10, transparent:true, opacity:0, side:THREE.DoubleSide}));
  gateGlow.position.set(0, 20, -1); gateGrp.add(gateGlow);
  // SKY BEAM (activation)
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(3, 4.5, 240, 12, 1, true), new THREE.MeshBasicMaterial({color:0xff8a30, transparent:true, opacity:0, side:THREE.DoubleSide, depthWrite:false}));
  beam.position.set(0, 120, 0); gateGrp.add(beam);
  // rite ring at gate foot
  const riteRing = new THREE.Mesh(new THREE.RingGeometry(2.2, 2.8, 32), new THREE.MeshBasicMaterial({color:0xff8a30, transparent:true, opacity:0.35, side:THREE.DoubleSide}));
  riteRing.rotation.x = -Math.PI/2; riteRing.position.set(0, 0.08, -48); scene.add(riteRing);
  gateGrp.position.copy(GATE); scene.add(gateGrp);
  // corruption veins (appear as integrity drops)
  const veins = [];
  for (let i=0;i<8;i++){
    const vn = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 5+Math.random()*6), new THREE.MeshBasicMaterial({color:0x8a2ab0, transparent:true, opacity:0}));
    vn.position.set((Math.random()>.5?6.2:-6.2), 6+Math.random()*30, 3.05);
    gateGrp.add(vn); veins.push(vn);
  }
  // THE TETHER — visible ember thread from gate to god
  const tether = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 1, 4), new THREE.MeshBasicMaterial({color:0xff5a10, transparent:true, opacity:0.5}));
  tether.geometry.translate(0, 0.5, 0);   // pivot at base
  scene.add(tether);
  // biome bloom rings (radiate on activation)
  const bloomRings = [];
  for (let i=0;i<5;i++){
    const b = new THREE.Mesh(new THREE.CircleGeometry(10+i*14, 36), new THREE.MeshBasicMaterial({color:0x3a7a3a, transparent:true, opacity:0}));
    b.rotation.x = -Math.PI/2; b.position.set(GATE.x, 0.05+ i*0.002, GATE.z);
    scene.add(b); bloomRings.push(b);
  }
  // ember snowfall (active weather)
  const snow = [];
  for (let i=0;i<80;i++){
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.12, 5, 5), new THREE.MeshBasicMaterial({color:0xff8a30, transparent:true, opacity:0}));
    s.position.set(GATE.x + (Math.random()-.5)*120, Math.random()*60, GATE.z + (Math.random()-.5)*120);
    scene.add(s); snow.push(s);
  }

  // ============ SHRINE ============
  const shrine = new THREE.Group();
  const stone2 = new THREE.MeshStandardMaterial({color:0x5a565e, roughness:1});
  box(2.4, 0.8, 2.4, stone2, 0, 0.4, 0, shrine);
  const brazierFlame = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.1, 6), new THREE.MeshBasicMaterial({color:0x9a9aa8, transparent:true, opacity:0.7}));
  brazierFlame.position.y = 1.3; shrine.add(brazierFlame);
  shrine.position.set(14, 0, -30); scene.add(shrine);

  // ============ HEROES ============
  const sprite = new THREE.Group();
  const clothMat = new THREE.MeshStandardMaterial({color:0x241c2a, roughness:1});
  box(0.55, 0.7, 0.32, clothMat, 0, 1.05, 0, sprite);
  box(0.34, 0.38, 0.36, clothMat, 0, 1.62, 0, sprite);
  box(0.1, 0.06, 0.04, new THREE.MeshBasicMaterial({color:0xffcf6a}), 0, 1.66, 0.19, sprite);
  const sLegL = box(0.2, 0.7, 0.22, clothMat, -0.14, 0.35, 0, sprite);
  const sLegR = box(0.2, 0.7, 0.22, clothMat, 0.14, 0.35, 0, sprite);
  const sBlade = box(0.07, 1.1, 0.16, new THREE.MeshStandardMaterial({color:0x6a6a7a, roughness:0.4, emissive:0xff8a30, emissiveIntensity:0.25}), 0.48, 1.35, 0.3, sprite);
  sprite.position.set(14, 0, -26); scene.add(sprite);

  const god = new THREE.Group();
  const magmaMat = new THREE.MeshStandardMaterial({color:0xc0a890, roughness:0.85, emissive:0xff5a10, emissiveIntensity:0.8, transparent:true});
  box(3.4, 4.2, 2.2, magmaMat, 0, 6.4, 0, god);
  box(1.7, 1.6, 1.7, magmaMat, 0, 9.6, 0, god);
  box(0.45, 0.2, 0.3, new THREE.MeshBasicMaterial({color:0xffb84a}), -0.4, 9.9, 0.9, god);
  box(0.45, 0.2, 0.3, new THREE.MeshBasicMaterial({color:0xffb84a}), 0.4, 9.9, 0.9, god);
  box(1.5, 3.6, 1.5, magmaMat, -0.95, 1.8, 0, god);
  box(1.5, 3.6, 1.5, magmaMat, 0.95, 1.8, 0, god);
  const swordG = new THREE.Group();
  box(0.5, 4.2, 0.18, new THREE.MeshStandardMaterial({color:0x4a1c08, roughness:0.5, emissive:0xff5a10, emissiveIntensity:1.2}), 0, 2.6, 0, swordG);
  swordG.position.set(3.1, 4.5, 0); giantSword(); function giantSword(){ god.add(swordG); }
  god.visible = false; scene.add(god);

  // ============ ENEMIES ============
  const enemies = [];
  const wispMat = new THREE.MeshStandardMaterial({color:0x14121a, roughness:1, emissive:0x30104a, emissiveIntensity:0.6});
  function makeWisp(pos, corruptor){
    const g = new THREE.Group();
    const s = corruptor ? 1.7 : 1;
    box(0.6*s, 0.5*s, 0.6*s, wispMat, 0, 0.6*s, 0, g);
    box(0.5*s, 0.5*s, 0.5*s, wispMat, 0, 1.05*s, 0, g);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.1*s, 6, 6), new THREE.MeshBasicMaterial({color: corruptor ? 0xc040ff : 0xb040ff}));
    eye.position.set(0, 1.1*s, 0.28*s); g.add(eye);
    if (corruptor){
      const halo = new THREE.Mesh(new THREE.RingGeometry(0.6, 0.85, 16), new THREE.MeshBasicMaterial({color:0xc040ff, transparent:true, opacity:0.5, side:THREE.DoubleSide}));
      halo.rotation.x = -Math.PI/2; halo.position.y = 0.05; g.add(halo);
    }
    g.position.copy(pos); scene.add(g);
    enemies.push({obj:g, yaw:0, hp: corruptor ? 3 : 1, dead:false, corruptor:!!corruptor, walkT:Math.random()*6, latched:false, latchT:0, flashT:0, atkCd:0});
    return enemies[enemies.length-1];
  }
  for (let i=0;i<4;i++) makeWisp(new THREE.Vector3((Math.random()-.5)*40, 0, -10 + Math.random()*24), false);

  // ============ STATE ============
  let phase = 'sprite';        // sprite -> rite -> ascend -> giant -> end
  let gateState = 'dormant';   // dormant -> attuned -> active -> destabilized -> corrupted
  let faith = 0, integrity = 100, link = 100, wave = 0, kills = 0;
  let moveTarget = null, attacking = 0, slashHeld = false, rollT = 0, rollCd = 0, iframes = 0, rollDir = new THREE.Vector3(0,0,-1);
  let gAttacking = 0, gSmashHeld = false, trauma = 0, shakeT = 0, growT = 0;
  let attuned = false, riteT = 0, riting = false;
  const gstateEl = document.getElementById('gstate'), objEl = document.getElementById('obj'),
        faithFill = document.getElementById('faithfill'), intFill = document.getElementById('intfill'),
        linkFill = document.getElementById('linkfill'), linkWrap = document.getElementById('linkwrap'), linkLab = document.getElementById('linklab'),
        btnA = document.getElementById('btnA'), btnB = document.getElementById('btnB'), btnRite = document.getElementById('btnRite');
  function setFaith(){ faithFill.style.width = Math.min(100, faith) + '%'; }
  function setInt(){ intFill.style.width = Math.max(0, integrity) + '%'; }
  function setLink(){ linkFill.style.width = Math.max(0, link) + '%'; }
  setFaith(); setInt();
  function showOverlay(big, stats){ document.getElementById('obig').textContent = big; document.getElementById('ostats').innerHTML = stats; document.getElementById('overlay').style.display = 'block'; }

  // ============ INPUT ============
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let tapTime = 0;
  function onTap(ev){
    const t = ev.touches ? ev.touches[0] : ev;
    if (Date.now() - tapTime < 120) return; tapTime = Date.now();
    ndc.x = (t.clientX/innerWidth)*2-1; ndc.y = -(t.clientY/innerHeight)*2+1;
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObject(ground)[0];
    if (!hit) return;
    const p = hit.point.clone(); p.y = 0;
    const anchor = (phase === 'giant') ? god : sprite;
    const maxD = (phase === 'giant') ? 200 : 40;
    if (p.distanceTo(anchor.position) > maxD) p.copy(anchor.position).add(p.sub(anchor.position).setLength(maxD));
    moveTarget = p;
  }
  renderer.domElement.addEventListener('touchend', e => { e.preventDefault(); onTap(e.changedTouches[0]); }, {passive:false});
  renderer.domElement.addEventListener('click', onTap);
  function bind(btn, fn){ btn.addEventListener('touchstart', e => { e.preventDefault(); fn(); }, {passive:false}); btn.addEventListener('click', fn); }
  btnA.addEventListener('touchstart', e => { e.preventDefault(); if (phase === 'giant'){ gSmashHeld = true; doSmash(); } else { slashHeld = true; doSlash(); } }, {passive:false});
  btnA.addEventListener('touchend', () => { slashHeld = false; gSmashHeld = false; });
  btnA.addEventListener('touchcancel', () => { slashHeld = false; gSmashHeld = false; });
  btnA.addEventListener('click', () => { if (phase === 'giant') doSmash(); else doSlash(); });
  bind(btnB, () => { if (phase === 'giant') doSlam(); else doRoll(); });
  bind(btnRite, () => {
    if (gateState === 'attuned' && !riting && sprite.position.distanceTo(riteRing.position) < 3){
      riting = true; riteT = 0;
      popup('THE RITE BEGINS — THE GATE REMEMBERS', riteRing.position, true);
    }
  });

  function doSlash(){
    if (attacking > 0 || rollT > 0) return;
    attacking = 0.32;
    setTimeout(() => {
      enemies.forEach(e => {
        if (e.dead) return;
        const to = e.obj.position.clone().sub(sprite.position); to.y = 0;
        if (to.length() > 2.8) return;
        const ang = to.angleTo(new THREE.Vector3(Math.sin(sprite.rotation.y), 0, Math.cos(sprite.rotation.y)));
        if (ang > 1.6) return;
        e.hp--; e.flashT = 1;
        burst(e.obj.position, 0x8a2ab0, 5, 4);
        if (e.hp <= 0){
          e.dead = true; kills++;
          burst(e.obj.position, 0xb040ff, 10, 6);
          const gain = e.corruptor ? 25 : 15;
          faith = Math.min(100, faith + gain); setFaith();
          popup('+' + gain + ' FAITH', e.obj.position, false);
        }
      });
    }, 100);
  }
  function doRoll(){
    if (rollCd > 0) return;
    rollCd = 0.9; rollT = 0.24; iframes = 0.45;
    rollDir.copy(moveTarget ? moveTarget.clone().sub(sprite.position).setY(0).normalize() : new THREE.Vector3(Math.sin(sprite.rotation.y), 0, Math.cos(sprite.rotation.y)));
  }
  function doSmash(){
    if (gAttacking > 0.26) return;
    gAttacking = 0.5;
    swordG.rotation.x = -2.4;
    const power = link > 60 ? 2 : 1;      // THE TETHER: weak when far
    setTimeout(() => {
      swordG.rotation.x = 0;
      let hitAny = false;
      enemies.forEach(e => {
        if (e.dead) return;
        const to = e.obj.position.clone().sub(god.position); to.y = 0;
        if (to.length() <= 15){
          e.hp -= power; e.flashT = 1; hitAny = true;
          burst(e.obj.position, 0xff7a20, 8, 7);
          if (e.hp <= 0){ e.dead = true; kills++; burst(e.obj.position, 0xff7a20, 12, 8); if (e.latched){ e.latched = false; } popup('CORRUPTOR FELLED', e.obj.position, true); }
        }
      });
      if (hitAny) trauma = Math.min(1, trauma + 0.25);
      if (power === 1) popup('THE LINK THINS — YOUR BLOWS FALTER', god.position, false);
    }, 180);
  }
  function doSlam(){
    if (gAttacking > 0.55) return;
    gAttacking = 0.7; trauma = 1;
    burst(god.position, 0xff8a30, 20, 10);
    if (link < 40){ popup('TOO FAR — THE SLAM SCATTERS HARMLESSLY', god.position, true); return; }
    enemies.forEach(e => {
      if (e.dead) return;
      const d = e.obj.position.clone().sub(god.position).setY(0).length();
      if (d <= 22){ e.dead = true; kills++; burst(e.obj.position, 0xff7a20, 10, 8); }
    });
  }

  // ============ GATE STATE TRANSITIONS ============
  function attune(){
    gateState = 'attuned'; attuned = true;
    gstateEl.textContent = 'THE CINDER GATE — ATTUNED';
    gateGlow.material.opacity = 0.18;
    heart.material.color.setHex(0xff8a30); heart.material.opacity = 0.85;
    brazierFlame.material.color.setHex(0xff8a30);
    scene.fog.color.setHex(0x3a2a24);
    sun.color.setHex(0xffb070); sun.intensity = 0.9;
    popup('THE GATE WAKES — ITS SIGILS REMEMBER FIRE', GATE, true);
    objEl.textContent = 'OBJECTIVE: PERFORM THE RITE AT THE GATE FOOT';
    btnRite.style.display = 'block';
  }
  function activateGate(){
    gateState = 'active';
    gstateEl.textContent = 'THE CINDER GATE — ACTIVE';
    gateGlow.material.opacity = 0.42;
    beam.material.opacity = 0.5;
    groundMat.color.setHex(0x5a4a38);     // ash warms
    scene.fog.color.setHex(0x4a2a14);     // ember fog
    brazierFlame.material.color.setHex(0xff5a10);
    popup('THE CINDER GATE OPENS — ALL SIX GATES PULSE IN SYMPATHY', GATE, true);
    popup('THE REALM BLOOMS', GATE, true);
    bloomRings.forEach((b, i) => { b.material.opacity = 0.25; b.scale.setScalar(0.1); });
    linkWrap.style.display = 'block'; linkLab.style.display = 'block';
    // ASCENSION
    phase = 'ascend'; growT = 0;
    sprite.visible = false;
    god.visible = true; god.position.copy(riteRing.position); god.rotation.y = 0;
    god.scale.setScalar(0.05);
    btnRite.style.display = 'none';
    btnA.style.display = 'none'; btnB.style.display = 'none';
    trauma = 1;
  }
  function destabilize(){
    gateState = 'destabilized';
    gstateEl.textContent = 'THE CINDER GATE — DESTABILIZING';
    popup('THE GATE CRACKS — YOUR FORM THINS', GATE, true);
  }
  function corrupt(){
    gateState = 'corrupted';
    gstateEl.textContent = 'THE CINDER GATE — CORRUPTED';
    scene.fog.color.setHex(0x1a0a22);
    gateGlow.material.color.setHex(0x8a2ab0);
    beam.material.opacity = 0;
    heart.material.color.setHex(0x8a2ab0);
    god.visible = false;
    popup('THE GATE INVERTS — THE DEITY IS LOCKED OUT', GATE, true);
    setTimeout(() => { showOverlay('THE GATE INVERTS', 'The Hollow wears the stone now. Faith is the only mortar — run it again, Warden.'); }, 1500);
    phase = 'end';
  }

  // ============ CAMERA ============
  function updateCamera(dt){
    let target, look;
    if (phase === 'giant'){
      target = god.position.clone().add(new THREE.Vector3(Math.sin(god.rotation.y), 0, Math.cos(god.rotation.y)).multiplyScalar(-34));
      target.y = 19;
      look = god.position.clone().setY(8);
    } else if (phase === 'ascend'){
      const k = Math.min(1, growT/2.4);
      target = god.position.clone().add(new THREE.Vector3(36*(1+k*0.3), 12 + k*18, 36));
      look = god.position.clone().setY(4 + k*6);
    } else {
      target = sprite.position.clone().add(new THREE.Vector3(6.5, 8.5, 6.5));
      look = sprite.position.clone().setY(1);
    }
    camera.position.lerp(target, 1 - Math.exp(-4.5*dt));
    if (trauma > 0){
      shakeT += dt*30;
      const amp = trauma*0.4;
      look.x += Math.sin(shakeT*1.4)*amp; look.y += Math.cos(shakeT*1.2)*amp*0.6;
      trauma = Math.max(0, trauma - dt*1.9);
    }
    camera.lookAt(look);
  }

  // ============ LOOP ============
  const clock = new THREE.Clock();
  let waveT = 4, waveNeed = [3, 4, 5], waveIdx = 0, spawnedThisWave = 0, corruptorCount = 0;
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const et = clock.elapsedTime;
    if (attacking > 0) attacking -= dt;
    if (gAttacking > 0) gAttacking -= dt;
    if (rollCd > 0){ rollCd -= dt; btnB.childNodes[1].textContent = rollCd > 0 ? rollCd.toFixed(1) + 's' : 'DODGE'; }
    if (iframes > 0) iframes -= dt;

    // ---- RITE CHANNEL ----
    if (riting){
      riteT += dt;
      riteRing.material.opacity = 0.35 + Math.sin(et*8)*0.25;
      if (Math.floor(riteT*2) !== Math.floor((riteT-dt)*2)) popup('KINDLING...', riteRing.position, false);
      if (riteT >= 2.4){ riting = false; activateGate(); }
    } else if (phase === 'sprite') riteRing.material.opacity = 0.3 + Math.sin(et*3)*0.12;

    // ---- ASCENSION GROWTH ----
    if (phase === 'ascend'){
      growT += dt;
      const s = 0.05 + Math.min(1, growT/2.4)*0.95;
      god.scale.setScalar(s);
      if (growT >= 2.6){
        phase = 'giant';
        god.scale.setScalar(1);
        btnA.style.display = 'block'; btnA.childNodes[0].textContent = 'SMASH'; btnA.childNodes[1].textContent = 'HOLD TO CHAIN';
        btnB.style.display = 'block'; btnB.childNodes[0].textContent = 'SLAM'; btnB.childNodes[1].textContent = 'AOE 22M';
        objEl.textContent = 'OBJECTIVE: DEFEND THE GATE — 3 CORRUPTOR WAVES · STAY NEAR YOUR GATE';
        popup('YOUR POWER RUNS THROUGH THE GATE — STRAY AND IT THINS', god.position, true);
        waveT = 3;
      }
    }
    if (phase === 'end'){ updateCamera(dt); renderer.render(scene, camera); updatePopups(dt); return; }

    // ---- MOVEMENT ----
    if (phase === 'sprite'){
      if (rollT > 0){
        rollT -= dt;
        sprite.position.add(rollDir.clone().multiplyScalar(16*dt));
        sprite.rotation.y = Math.atan2(rollDir.x, rollDir.z);
      } else if (moveTarget){
        const to = moveTarget.clone().sub(sprite.position); to.y = 0;
        if (to.length() < 0.4) moveTarget = null;
        else {
          const dir = to.normalize();
          sprite.rotation.y = Math.atan2(dir.x, dir.z);
          sprite.position.add(dir.multiplyScalar(5.6*dt));
          const sw = Math.sin(et*12)*0.5;
          sLegL.rotation.x = sw; sLegR.rotation.x = -sw;
        }
      }
      if (slashHeld && attacking <= 0 && rollT <= 0) doSlash();
      // attunement check
      if (!attuned && faith >= 100) attune();
    } else if (phase === 'giant'){
      if (moveTarget){
        const to = moveTarget.clone().sub(god.position); to.y = 0;
        if (to.length() < 4) moveTarget = null;
        else {
          const dir = to.normalize();
          const ty = Math.atan2(dir.x, dir.z);
          let dy = ty - god.rotation.y;
          while (dy > Math.PI) dy -= Math.PI*2; while (dy < -Math.PI) dy += Math.PI*2;
          god.rotation.y += dy * Math.min(1, 7*dt);
          god.position.add(dir.multiplyScalar(Math.min(12*dt, to.length())));
        }
      }
      if (gSmashHeld && gAttacking <= 0.26) doSmash();
      // THE ESSENCE LINK — distance to gate
      const dGate = god.position.distanceTo(new THREE.Vector3(GATE.x, 0, GATE.z));
      const targetLink = dGate < 55 ? 100 : Math.max(15, 100 - (dGate - 55) * 0.5);
      link += (targetLink - link) * Math.min(1, 1.2*dt);
      setLink();
      // form thins with link
      magmaMat.opacity = 0.45 + (link/100)*0.55;
      // tether visual — gate to god
      const gp = new THREE.Vector3(GATE.x, 22, GATE.z);
      const start = god.position.clone().setY(10);
      tether.position.copy(gp);
      const toG = start.clone().sub(gp);
      tether.scale.y = toG.length();
      tether.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), toG.clone().normalize());
      tether.material.opacity = 0.15 + (link/100)*0.4;
      if (link < 30 && Math.random() < dt*2) popup('THE LINK THINS — RETURN TO YOUR GATE', god.position, false);
      // DESTABILIZED when integrity low
      if (integrity < 50 && gateState === 'active') destabilize();
    }

    // ---- WISPS (sprite phase food) ----
    if (phase === 'sprite'){
      enemies.forEach((e, idx) => {
        if (e.dead){ e.obj.position.y -= dt*2; if (e.obj.position.y < -1.5){ scene.remove(e.obj); enemies.splice(idx,1); } return; }
        e.walkT += dt;
        if (e.flashT > 0){ e.flashT -= dt*4; const s = 1 + 0.2*Math.max(0,e.flashT); e.obj.scale.setScalar(s); } else e.obj.scale.setScalar(1);
        const d = e.obj.position.distanceTo(sprite.position);
        if (d < 18 && d > 1.6){
          const to = sprite.position.clone().sub(e.obj.position).setY(0).normalize();
          const ty = Math.atan2(to.x, to.z);
          let dy = ty - e.yaw; while (dy > Math.PI) dy -= Math.PI*2; while (dy < -Math.PI) dy += Math.PI*2;
          e.yaw += dy * Math.min(1, 6*dt); e.obj.rotation.y = e.yaw;
          e.obj.position.add(to.multiplyScalar(3.4*dt));
          e.obj.position.y = Math.abs(Math.sin(e.walkT*6))*0.3;
        } else if (d <= 1.6){
          if (e.atkCd <= 0){ e.atkCd = 1.6; if (iframes <= 0) popup('THE HOLLOW BITES', sprite.position, false); }
        }
        e.atkCd -= dt;
      });
    }

    // ---- CORRUPTOR WAVES (giant phase — they attack the GATE) ----
    if (phase === 'giant'){
      waveT -= dt;
      const corruptorsAlive = enemies.filter(e => !e.dead && e.corruptor).length;
      const wispsAlive = enemies.filter(e => !e.dead && !e.corruptor).length;
      if (waveIdx < 3 && spawnedThisWave + corruptorsAlive < waveNeed[waveIdx] && waveT <= 0){
        waveT = 2.4;
        const corruptor = Math.random() < 0.5 && corruptorsAlive < 2;
        const a = Math.random()*Math.PI*2;
        makeWisp(new THREE.Vector3(GATE.x + Math.cos(a)*55, 0, GATE.z + 20 + Math.abs(Math.sin(a))*40), corruptor);
        if (corruptor){ spawnedThisWave++; corruptorCount++; }
        else {
          // small wisp harasses the god
          const e = enemies[enemies.length-1];
          e.obj.position.set(god.position.x + (Math.random()-.5)*30, 0, god.position.z + (Math.random()-.5)*30);
        }
      }
      // wave done?
      if (waveIdx < 3 && spawnedThisWave >= waveNeed[waveIdx] && corruptorsAlive === 0){
        waveIdx++; spawnedThisWave = 0;
        if (waveIdx >= 3){
          phase = 'end';
          showOverlay('THE GATE STANDS', 'CORRUPTORS FELLED: ' + (kills) + '<br>INTEGRITY: ' + Math.floor(integrity) + '%<br>ESSENCE LINK HELD — THE TETHER HOLDS.<br><br>The Gate is not a door. It is why you exist.');
          return;
        }
        integrity = Math.min(100, integrity + 12); setInt();
        popup('WAVE ' + (waveIdx+1) + ' — THE HOLLOW RENEWS ITS ASSAULT', GATE, true);
      }
      // corruptor AI: march to nearest pillar, latch, drain integrity
      enemies.forEach((e, idx) => {
        if (e.dead){ e.obj.position.y -= dt*2; if (e.obj.position.y < -1.5){ scene.remove(e.obj); enemies.splice(idx,1); } return; }
        e.walkT += dt;
        if (e.flashT > 0){ e.flashT -= dt*4; const s = 1 + 0.2*Math.max(0,e.flashT); e.obj.scale.setScalar(s); } else e.obj.scale.setScalar(1);
        if (!e.corruptor) return;
        if (!e.latched){
          const target = new THREE.Vector3(GATE.x + (e.obj.position.x > GATE.x ? 10.5 : -10.5), 0, GATE.z);
          const to = target.clone().sub(e.obj.position); to.y = 0;
          if (to.length() < 1.2){
            e.latched = true; e.latchT = 0;
            popup('A CORRUPTOR LATCHES ONTO THE GATE', target, true);
          } else {
            e.obj.position.add(to.normalize().multiplyScalar(2.6*dt));
            e.obj.rotation.y = Math.atan2(to.x, to.z);
            e.obj.position.y = Math.abs(Math.sin(e.walkT*5))*0.2;
          }
        } else {
          e.latchT += dt;
          integrity = Math.max(0, integrity - 3.2*dt); setInt();
          // veins show as integrity drops
          const vIdx = Math.min(veins.length-1, Math.floor((100-integrity)/12));
          for (let vi=0; vi<=vIdx; vi++) veins[vi].material.opacity = 0.7;
          if (Math.random() < dt*3) burst(e.obj.position, 0x8a2ab0, 2, 3);
          if (integrity <= 0){ corrupt(); return; }
        }
      });
    }

    // ---- ENVIRONMENT FX per gate state ----
    if (gateState === 'active' || gateState === 'destabilized'){
      beam.material.opacity = (gateState === 'active' ? 0.5 : 0.5 + Math.sin(et*22)*0.2);
      gateGlow.material.opacity = 0.4 + Math.sin(et*2)*0.08;
      heart.rotation.z += dt*0.4;
      bloomRings.forEach((b, i) => { const s = Math.min(1, b.scale.x + dt*0.05); b.scale.setScalar(s); b.material.opacity = 0.25*(1-i*0.15); });
      snow.forEach(s => { s.material.opacity = 0.6; s.position.y -= (0.8 + s.position.x*0.002)*dt*4; if (s.position.y < 0){ s.position.y = 55 + Math.random()*5; } });
    }
    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vel.y -= 12*dt; p.m.position.addScaledVector(p.vel, dt);
      p.m.rotation.x += 6*dt; p.life -= dt;
      p.m.material.opacity = Math.max(0, p.life);
      if (p.life <= 0){ scene.remove(p.m); particles.splice(i,1); }
    }
    updatePopups(dt);
    updateCamera(dt);
    renderer.render(scene, camera);
  }
  animate();

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
