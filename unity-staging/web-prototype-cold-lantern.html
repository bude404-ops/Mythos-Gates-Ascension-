<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MYTHOS GATES: ASCENSION — THE COLD LANTERN (Map Architecture Slice)</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0a0806;font-family:Georgia,serif;-webkit-user-select:none;user-select:none;touch-action:none}
  #hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#e8c47a;text-align:center;z-index:10;pointer-events:none;text-shadow:0 2px 6px #000}
  #beat{font-size:12px;color:#9a8b6f;letter-spacing:2px}
  #obj{font-size:14px;letter-spacing:1px;margin-top:3px}
  .barwrap{width:170px;height:8px;background:#1c1410;border:1px solid #4a3218;margin:5px auto 0}
  #hpfill{height:100%;width:100%;background:linear-gradient(90deg,#c02020,#ff7a50)}
  .btn{position:fixed;z-index:10;padding:16px 14px;background:rgba(30,22,14,.82);border:1px solid #7a5a2a;color:#e8c47a;font-size:14px;letter-spacing:1px;border-radius:12px;text-align:center;line-height:1.1}
  .btn small{display:block;font-size:9px;color:#a8895a;letter-spacing:1px;margin-top:2px}
  .btn:active{background:#4a3214}
  #btnA{right:20px;bottom:20px}
  #btnB{right:108px;bottom:64px}
  .pop{position:fixed;color:#ffcf6a;font-size:13px;letter-spacing:1px;text-shadow:0 2px 4px #000;pointer-events:none;z-index:12;white-space:nowrap;max-width:90vw}
  .pop.heavy{font-size:16px;color:#ffe8b0}
  #hurt{position:fixed;inset:0;pointer-events:none;z-index:9;box-shadow:inset 0 0 90px 30px rgba(200,20,10,.6);opacity:0;transition:opacity .13s}
  #overlay{display:none;position:fixed;inset:0;background:rgba(4,3,2,.92);z-index:20;color:#e8c47a;text-align:center}
  #overlay .big{margin-top:28vh;font-size:26px;letter-spacing:5px;text-shadow:0 4px 12px #000}
  #overlay .stats{margin-top:14px;font-size:13px;color:#9a8b6f;line-height:1.9}
  #overlay .btn{position:relative;display:inline-block;margin:26px auto 0;left:0;right:0}
</style>
</head>
<body>
<div id="hud">
  <div id="beat">BEAT 1 — EMBERHOLLOW · SPRITE</div>
  <div id="obj">OBJECTIVE: SPEAK WITH THE LANTERN KEEPER</div>
  <div class="barwrap"><div id="hpfill"></div></div>
</div>
<div id="hurt"></div>
<div class="btn" id="btnA">SLASH<small>SPRITE</small></div>
<div class="btn" id="btnB">ROLL<small>DODGE</small></div>
<div id="overlay">
  <div class="big" id="obig"></div>
  <div class="stats" id="ostats"></div>
  <div class="btn" onclick="location.reload()">RUN IT AGAIN</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  // ============ CORE ============
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x140e08, 0.014);
  const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
  scene.add(new THREE.HemisphereLight(0x8a7a5a, 0x1c0f0a, 0.85));
  const sun = new THREE.DirectionalLight(0xffb070, 0.8); sun.position.set(50, 90, 30); scene.add(sun);

  function groundTexture(){
    const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
    x.fillStyle = '#262019'; x.fillRect(0,0,256,256);
    for (let i=0;i<700;i++){ const g = 26+Math.random()*26|0;
      x.fillStyle = 'rgba('+g+','+(g*0.8|0)+','+(g*0.6|0)+',0.6)';
      x.beginPath(); x.arc(Math.random()*256, Math.random()*256, 1+Math.random()*8, 0, 7); x.fill(); }
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30,50); return t;
  }
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 220), new THREE.MeshStandardMaterial({map: groundTexture(), roughness:1}));
  ground.rotation.x = -Math.PI/2; ground.position.set(0, 0, -20); scene.add(ground);

  // ============ POPUPS / PARTICLES / FX ============
  const popups = []; const v3 = new THREE.Vector3();
  function popup(text, worldPos, heavy){
    const el = document.createElement('div');
    el.className = 'pop' + (heavy ? ' heavy' : ''); el.textContent = text;
    document.body.appendChild(el);
    popups.push({el, pos:worldPos.clone(), t:0});
  }
  function updatePopups(dt){
    for (let i=popups.length-1;i>=0;i--){
      const p = popups[i]; p.t += dt;
      if (p.t > 1.4){ p.el.remove(); popups.splice(i,1); continue; }
      v3.copy(p.pos); v3.y += 2 + p.t*2.5; v3.project(camera);
      if (v3.z > 1){ p.el.style.display='none'; continue; }
      p.el.style.display='block';
      p.el.style.left = ((v3.x*0.5+0.5)*innerWidth) + 'px';
      p.el.style.top = ((-v3.y*0.5+0.5)*innerHeight) + 'px';
      p.el.style.opacity = Math.max(0, 1 - p.t/1.4);
    }
  }
  const particles = []; const partGeo = new THREE.BoxGeometry(0.16, 0.16, 0.16);
  function burst(pos, color, n, power, size){
    if (particles.length > 150) return;
    for (let i=0;i<n;i++){
      const m = new THREE.Mesh(size ? new THREE.BoxGeometry(size, size, size) : partGeo, new THREE.MeshBasicMaterial({color, transparent:true, opacity:1}));
      m.position.copy(pos);
      particles.push({m, vel:new THREE.Vector3((Math.random()-.5)*power, Math.random()*power*0.8, (Math.random()-.5)*power), life:0.9+Math.random()*0.5});
      scene.add(m);
    }
  }

  // ============ THE ONE WORLD — LANDMARKS (double-duty geometry) ============
  const woodMat = new THREE.MeshStandardMaterial({color:0x3a2a1a, roughness:1});
  const stoneMat = new THREE.MeshStandardMaterial({color:0x4a4038, roughness:1});
  const roofMat = new THREE.MeshStandardMaterial({color:0x6a2a14, roughness:1});
  function box(w,h,d,mat,x,y,z,parent){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); (parent||scene).add(m); return m; }

  // EMBERHOLLOW — the town (south, sprite-home)
  const townHouses = [];
  [[-8,44],[8,44],[-13,36],[13,36],[-5,50]].forEach(p => {
    const g = new THREE.Group();
    box(3, 2.4, 3, woodMat, 0, 1.2, 0, g);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(2.4, 1.6, 4), roofMat); roof.position.y = 3.2; g.add(roof);
    g.position.set(p[0], 0, p[1]); scene.add(g); townHouses.push(g);
  });
  const townBrazier = box(1.2, 1.0, 1.2, stoneMat, 0, 0.5, 40);
  const townLight = new THREE.PointLight(0xff7a20, 1.0, 14, 2); townLight.position.set(0, 2, 40); scene.add(townLight);
  const keeper = new THREE.Group();
  box(0.5, 0.8, 0.35, new THREE.MeshStandardMaterial({color:0x2a4a3a, roughness:1}), 0, 1.1, 0, keeper);
  box(0.3, 0.3, 0.3, new THREE.MeshStandardMaterial({color:0xc0a080, roughness:1}), 0, 1.65, 0, keeper);
  const keeperLantern = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), new THREE.MeshBasicMaterial({color:0x9ac0ff}));
  keeperLantern.position.set(0.4, 1.3, 0.2); keeper.add(keeperLantern);
  const keeperGlow = new THREE.PointLight(0x9ac0ff, 0.9, 7, 2); keeperGlow.position.set(0.4, 1.5, 0.2); keeper.add(keeperGlow);
  keeper.position.set(0, 0, 39); scene.add(keeper);

  // CHARCOAL FOREST — trees + the fallen-log bridge
  const forestTrees = [];
  for (let i=0;i<26;i++){
    const x = (i%2 ? -1 : 1) * (5 + Math.random()*13) + (Math.random()-.5)*4;
    const z = 16 + Math.random()*22;
    if (Math.abs(x) < 3.4 && z < 30) continue;
    const t = new THREE.Group();
    const trunk = box(0.5, 2.4, 0.5, woodMat, 0, 1.2, 0, t);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(1.8, 4.5, 6), new THREE.MeshStandardMaterial({color:0x1a2a18, roughness:1}));
    cone.position.y = 4.2; t.add(cone);
    t.position.set(x, 0, z); scene.add(t); forestTrees.push(t);
  }
  const logBridge = box(1.2, 0.5, 7, woodMat, 0, 0.5, 26); // the fallen tree (giant: a twig)
  const stream = new THREE.Mesh(new THREE.PlaneGeometry(6, 60), new THREE.MeshBasicMaterial({color:0x1a3a5a, transparent:true, opacity:0.7}));
  stream.rotation.x = -Math.PI/2; stream.position.set(0, 0.05, 26); scene.add(stream);

  // RUINED SHRINE (west) — sprite-dungeon, giant-palm-toy
  const shrine = new THREE.Group();
  box(1.2, 3, 1.2, stoneMat, -2, 1.5, 0, shrine);
  box(1.2, 3, 1.2, stoneMat, 2, 1.5, 0, shrine);
  box(5.4, 1, 1.4, stoneMat, 0, 3.4, 0, shrine);
  const shrineBrazier = box(1, 0.8, 1, stoneMat, 0, 0.4, 1.6, shrine);
  const shrineFlame = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.0, 6), new THREE.MeshBasicMaterial({color:0x9ac0ff, transparent:true, opacity:0}));
  shrineFlame.position.set(0, 1.5, 1.6); shrine.add(shrineFlame);
  shrine.position.set(-15, 0, 10); scene.add(shrine);

  // THE WATCHTOWER (east) — shelter now, weapon later
  const watchtower = new THREE.Group();
  box(3, 9, 3, stoneMat, 0, 4.5, 0, watchtower);
  box(4.4, 0.6, 4.4, woodMat, 0, 9.3, 0, watchtower);
  watchtower.position.set(13, 0, -2); scene.add(watchtower);
  const towerBroken = false;

  // EVACUATION ROAD — dirt ribbon town → gate
  const road = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 78), new THREE.MeshStandardMaterial({color:0x4a3a28, roughness:1}));
  road.rotation.x = -Math.PI/2; road.position.set(0, 0.04, 1); scene.add(road);

  // THE CINDER GATE — the compass landmark, visible from beat 1
  const gate = new THREE.Group();
  box(4, 30, 4, stoneMat, -9, 15, 0, gate);
  box(4, 30, 4, stoneMat, 9, 15, 0, gate);
  box(22, 4.5, 5, stoneMat, 0, 32, 0, gate);
  const gateGlow = new THREE.Mesh(new THREE.PlaneGeometry(13, 28), new THREE.MeshBasicMaterial({color:0xff5a10, transparent:true, opacity:0.16, side:THREE.DoubleSide}));
  gateGlow.position.set(0, 15, 0); gate.add(gateGlow);
  const gateLight = new THREE.PointLight(0xff5a10, 1.4, 60, 2); gateLight.position.set(0, 16, 0); gate.add(gateLight);
  gate.position.set(0, 0, -38); scene.add(gate);
  // rite circle at gate foot
  const riteRing = new THREE.Mesh(new THREE.RingGeometry(2, 2.6, 32), new THREE.MeshBasicMaterial({color:0xff8a30, transparent:true, opacity:0.5, side:THREE.DoubleSide}));
  riteRing.rotation.x = -Math.PI/2; riteRing.position.set(0, 0.07, -31); scene.add(riteRing);

  // GIANT BATTLEFIELD — lava pools + lanes (beyond the gate)
  const lavaPools = [];
  [[-22,-58],[0,-64],[24,-52],[-10,-75],[14,-80]].forEach(p => {
    const r = 4 + Math.random()*4;
    const m = new THREE.Mesh(new THREE.CircleGeometry(r, 12), new THREE.MeshBasicMaterial({color:0xff5a10, transparent:true, opacity:0.4}));
    m.rotation.x = -Math.PI/2; m.position.set(p[0], 0.06, p[1]); scene.add(m);
    lavaPools.push({m, r, base:0.4, ph:Math.random()*7});
  });

  // ============ HEROES ============
  // SPRITE WARDEN
  const sprite = new THREE.Group();
  const clothMat = new THREE.MeshStandardMaterial({color:0x241c2a, roughness:1});
  const emberEye = new THREE.MeshBasicMaterial({color:0xffcf6a});
  box(0.55, 0.7, 0.32, clothMat, 0, 1.05, 0, sprite);
  box(0.34, 0.38, 0.36, clothMat, 0, 1.62, 0, sprite);
  box(0.1, 0.06, 0.04, emberEye, 0, 1.66, 0.19, sprite);
  const sLegL = box(0.2, 0.7, 0.22, clothMat, -0.14, 0.35, 0, sprite);
  const sLegR = box(0.2, 0.7, 0.22, clothMat, 0.14, 0.35, 0, sprite);
  const sBlade = box(0.07, 1.1, 0.16, new THREE.MeshStandardMaterial({color:0x6a6a7a, roughness:0.4, emissive:0xff8a30, emissiveIntensity:0.25}), 0.48, 1.35, 0.3, sprite);
  const lanternLight = new THREE.PointLight(0xffa050, 0, 10, 2); lanternLight.position.set(0, 2, 0); sprite.add(lanternLight);
  const coldLantern = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshBasicMaterial({color:0x9ac0ff, transparent:true, opacity:0}));
  coldLantern.position.set(-0.45, 1.2, 0.25); sprite.add(coldLantern);
  sprite.position.set(0, 0, 42); scene.add(sprite);

  // THE GIANT (hidden until ascension)
  const giant = new THREE.Group();
  const magmaMat = new THREE.MeshStandardMaterial({color:0xc0a890, roughness:0.85, emissive:0xff5a10, emissiveIntensity:0.8});
  box(3.4, 4.2, 2.2, magmaMat, 0, 6.4, 0, giant);
  box(1.7, 1.6, 1.7, magmaMat, 0, 9.6, 0, giant);
  box(0.45, 0.2, 0.3, emberEye, -0.4, 9.9, 0.9, giant);
  box(0.45, 0.2, 0.3, emberEye, 0.4, 9.9, 0.9, giant);
  const gArmL = box(1.1, 4.2, 1.1, magmaMat, -2.5, 6.6, 0, giant);
  const gArmR = box(1.1, 4.2, 1.1, magmaMat, 2.5, 6.6, 0, giant);
  box(1.5, 3.6, 1.5, magmaMat, -0.95, 1.8, 0, giant);
  box(1.5, 3.6, 1.5, magmaMat, 0.95, 1.8, 0, giant);
  const swordG = new THREE.Group();
  box(0.5, 4.2, 0.18, new THREE.MeshStandardMaterial({color:0x4a1c08, roughness:0.5, emissive:0xff5a10, emissiveIntensity:1.2}), 0, 2.6, 0, swordG);
  box(1.4, 0.3, 0.3, stoneMat, 0, 0.4, 0, swordG);
  swordG.position.set(3.1, 4.5, 0); giant.add(swordG);
  giant.visible = false; scene.add(giant);

  // ============ ENEMY / NPC FACTORIES ============
  const skitMat = new THREE.MeshStandardMaterial({color:0x14121a, roughness:1, emissive:0x301040, emissiveIntensity:0.5});
  const enemies = [];
  function makeSkit(pos, scaleUp){
    const s = scaleUp ? 1.6 : 1;
    const g = new THREE.Group();
    box(0.6*s, 0.4*s, 0.9*s, skitMat, 0, 0.3*s, 0, g);
    box(0.3*s, 0.22*s, 0.4*s, skitMat, 0, 0.44*s, 0.55*s, g);
    box(0.08, 0.05, 0.03, new THREE.MeshBasicMaterial({color:0xb040ff}), 0, 0.46*s, 0.76*s, g);
    g.position.copy(pos); scene.add(g);
    enemies.push({type:'skit', obj:g, yaw:0, hp:2, dead:false, aggro:16, walkT:Math.random()*6, flashT:0});
    return enemies[enemies.length-1];
  }
  // ERASED DRAKE — shadow at sprite scale, killable at giant scale
  const drake = new THREE.Group();
  box(2.4, 0.9, 5.5, new THREE.MeshStandardMaterial({color:0x141018, roughness:1}), 0, 0, 0, drake);
  const wingL = box(5, 0.15, 2.2, new THREE.MeshStandardMaterial({color:0x1a1420, roughness:1}), -3.4, 0.3, -0.5, drake);
  const wingR = box(5, 0.15, 2.2, new THREE.MeshStandardMaterial({color:0x1a1420, roughness:1}), 3.4, 0.3, -0.5, drake);
  box(0.5, 0.4, 1.4, skitMat, 0, 0.2, 3.4, drake);
  const drakeShadow = new THREE.Mesh(new THREE.CircleGeometry(6, 20), new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.35}));
  drakeShadow.rotation.x = -Math.PI/2; scene.add(drakeShadow);
  drake.visible = false; scene.add(drake);
  let drakeState = 'off', drakeT = 0, drakeDive = 0, drakeHp = 3, drakeKilled = false;
  // fire-stripe telegraph (sprite phase)
  const stripe = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 14), new THREE.MeshBasicMaterial({color:0xc02010, transparent:true, opacity:0}));
  stripe.rotation.x = -Math.PI/2; scene.add(stripe);
  let stripeT = -1;

  // GRIMLIGHT COLOSSUS — the boss
  const colossus = new THREE.Group();
  const coloMat = new THREE.MeshStandardMaterial({color:0x1c1420, roughness:1, emissive:0x5a1a8a, emissiveIntensity:0.5});
  box(6, 8, 4.4, coloMat, 0, 13, 0, colossus);
  box(3.2, 3, 3.2, coloMat, 0, 23.5, 0, colossus);
  box(0.9, 0.4, 0.5, new THREE.MeshBasicMaterial({color:0xb040ff}), -0.8, 24, 1.7, colossus);
  box(0.9, 0.4, 0.5, new THREE.MeshBasicMaterial({color:0xb040ff}), 0.8, 24, 1.7, colossus);
  box(2.6, 9, 2.6, coloMat, -4.6, 13.5, 0, colossus);
  box(2.6, 9, 2.6, coloMat, 4.6, 13.5, 0, colossus);
  box(3.2, 8.5, 3.2, coloMat, -2.1, 4.2, 0, colossus);
  box(3.2, 8.5, 3.2, coloMat, 2.1, 4.2, 0, colossus);
  for (let i=0;i<8;i++){
    const sp = new THREE.Mesh(new THREE.ConeGeometry(0.5, 2.4, 5), new THREE.MeshBasicMaterial({color:0x8a2ab0, transparent:true, opacity:0.85}));
    sp.position.set((Math.random()-.5)*5, 27+Math.random()*1.6, (Math.random()-.5)*3.5);
    colossus.add(sp);
  }
  colossus.visible = false; scene.add(colossus);
  let coloHp = 26, coloActive = false, coloSlamCd = 3, coloWindup = 0, coloHalf = false;
  const coloTele = new THREE.Mesh(new THREE.RingGeometry(9, 11, 40), new THREE.MeshBasicMaterial({color:0xc02040, transparent:true, opacity:0, side:THREE.DoubleSide}));
  coloTele.rotation.x = -Math.PI/2; scene.add(coloTele);
  let coloTeleT = -1;

  // SURVIVORS / EVACUEES
  const survivors = [];
  function makeSurvivor(pos){
    const g = new THREE.Group();
    box(0.4, 0.7, 0.3, new THREE.MeshStandardMaterial({color:0x5a4a2a, roughness:1}), 0, 0.9, 0, g);
    box(0.26, 0.26, 0.26, new THREE.MeshStandardMaterial({color:0xc0a080, roughness:1}), 0, 1.4, 0, g);
    const glow = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 8), new THREE.MeshBasicMaterial({color:0xffcf6a}));
    glow.position.set(0.3, 1.1, 0.2); g.add(glow);
    g.position.copy(pos); scene.add(g);
    survivors.push({obj:g, hp:3, wp:0, hurtCd:0});
  }
  const WAYPOINTS = [new THREE.Vector3(13,0,-2), new THREE.Vector3(6,0,-8), new THREE.Vector3(0,0,-14), new THREE.Vector3(0,0,-26), new THREE.Vector3(0,0,-31)];

  // CORRUPTION BLOBS (fade in lantern light)
  const corruptions = [];
  for (let i=0;i<8;i++){
    const m = new THREE.Mesh(new THREE.CircleGeometry(1.4+Math.random(), 12), new THREE.MeshBasicMaterial({color:0x30104a, transparent:true, opacity:0.5}));
    m.rotation.x = -Math.PI/2;
    m.position.set((Math.random()-.5)*30, 0.05, 12 + Math.random()*20);
    scene.add(m); corruptions.push(m);
  }

  // ============ STATE ============
  let phase = 'sprite', beat = 1, hp = 100, iframes = 0, rollT = 0, rollCd = 0, rollDir = new THREE.Vector3(0,0,-1);
  let moveTarget = null, attacking = 0, slashHeld = false, hasLantern = false, shrineLit = false;
  let survivorsSpawned = false, ambushT = 10, evacueesSaved = 0, evacueesSpawned = false;
  let gAttacking = 0, gSmashHeld = false, gKills = 0, giantTrauma = 0, shakeT = 0;
  let coloTelePos = new THREE.Vector3();
  const beatEl = document.getElementById('beat'), objEl = document.getElementById('obj'),
        hpFill = document.getElementById('hpfill'), hurtEl = document.getElementById('hurt');
  const btnA = document.getElementById('btnA'), btnB = document.getElementById('btnB');
  function setHP(){ hpFill.style.width = Math.max(0, hp) + '%'; }
  setHP();
  function hurt(n, pos){
    if (iframes > 0 || phase === 'ascend') return;
    hp = Math.max(0, hp - n); setHP();
    hurtEl.style.opacity = 0.85; setTimeout(()=>{ hurtEl.style.opacity = 0; }, 140);
    if (pos) burst(pos, 0xc02020, 5, 4);
    giantTrauma = Math.min(1, giantTrauma + 0.35);
    if (hp <= 0) die();
  }
  function die(){
    showOverlay('THE LANTERN FALLS', 'The Hollow takes the road. Emberhollow waits, cold.');
  }
  function showOverlay(big, stats){
    document.getElementById('obig').textContent = big;
    document.getElementById('ostats').innerHTML = stats;
    document.getElementById('overlay').style.display = 'block';
  }
  function setBeat(n, name, obj){
    beat = n;
    beatEl.textContent = 'BEAT ' + n + ' — ' + name + ' · ' + (phase === 'giant' ? 'GIANT' : 'SPRITE');
    objEl.textContent = 'OBJECTIVE: ' + obj;
  }

  // ============ INPUT ============
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let tapTime = 0;
  function onTap(ev){
    const t = ev.touches ? ev.touches[0] : ev;
    if (Date.now() - tapTime < 120) return; tapTime = Date.now();
    ndc.x = (t.clientX/innerWidth)*2-1; ndc.y = -(t.clientY/innerHeight)*2+1;
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObject(ground)[0];
    if (!hit) return;
    const p = hit.point.clone(); p.y = 0;
    if (phase === 'sprite'){
      if (p.distanceTo(sprite.position) > 30) p.copy(sprite.position).add(p.sub(sprite.position).setLength(30));
    } else {
      if (p.distanceTo(giant.position) > 55) p.copy(giant.position).add(p.sub(giant.position).setLength(55));
    }
    moveTarget = p;
  }
  renderer.domElement.addEventListener('touchend', e => { e.preventDefault(); onTap(e.changedTouches[0]); }, {passive:false});
  renderer.domElement.addEventListener('click', onTap);
  function bind(btn, fn){
    btn.addEventListener('touchstart', e => { e.preventDefault(); fn(); }, {passive:false});
    btn.addEventListener('click', fn);
  }
  // A button: SLASH (sprite) / SMASH (giant, hold)
  btnA.addEventListener('touchstart', e => {
    e.preventDefault();
    if (phase === 'sprite'){ slashHeld = true; doSlash(); }
    else { gSmashHeld = true; doSmash(); }
  }, {passive:false});
  btnA.addEventListener('touchend', () => { slashHeld = false; gSmashHeld = false; });
  btnA.addEventListener('touchcancel', () => { slashHeld = false; gSmashHeld = false; });
  btnA.addEventListener('click', () => { if (phase === 'sprite') doSlash(); else doSmash(); });
  // B button: ROLL (sprite) / SLAM (giant)
  bind(btnB, () => { if (phase === 'sprite') doRoll(); else doSlam(); });

  function doSlash(){
    if (attacking > 0 || rollT > 0) return;
    attacking = 0.32;
    setTimeout(() => {
      enemies.forEach(e => {
        if (e.dead) return;
        const to = e.obj.position.clone().sub(sprite.position); to.y = 0;
        if (to.length() > 2.8) return;
        const ang = to.angleTo(new THREE.Vector3(Math.sin(sprite.rotation.y), 0, Math.cos(sprite.rotation.y)));
        if (ang > 1.6) return;
        e.hp--; e.flashT = 1;
        burst(e.obj.position, 0x8a2ab0, 5, 4);
        if (e.hp <= 0){ e.dead = true; gKills++; burst(e.obj.position, 0xb040ff, 10, 6); }
      });
    }, 100);
  }
  function doRoll(){
    if (rollCd > 0) return;
    rollCd = 0.9; rollT = 0.24; iframes = 0.45;
    rollDir.copy(moveTarget ? moveTarget.clone().sub(sprite.position).setY(0).normalize() : new THREE.Vector3(Math.sin(sprite.rotation.y), 0, Math.cos(sprite.rotation.y)));
  }
  // GIANT: cone smash (kills skits, hurts drake/colossus)
  function doSmash(){
    if (gAttacking > 0.26) return;
    gAttacking = 0.5;
    swordG.rotation.x = -2.4;
    setTimeout(() => {
      swordG.rotation.x = 0;
      const fwd = new THREE.Vector3(Math.sin(giant.rotation.y), 0, Math.cos(giant.rotation.y));
      burst(giant.position.clone().add(fwd.multiplyScalar(6)).setY(1), 0xff8a30, 6, 7);
      let hitAny = false;
      enemies.forEach(e => {
        if (e.dead) return;
        const to = e.obj.position.clone().sub(giant.position); to.y = 0;
        if (to.length() <= 13){ e.dead = true; gKills++; burst(e.obj.position, 0xff7a20, 10, 8); hitAny = true; }
      });
      if (!drakeKilled && drake.visible){
        const to = drake.position.clone().sub(giant.position); to.y = 0;
        if (to.length() <= 16 && drake.position.y < 12){
          drakeHp--; hitAny = true;
          burst(drake.position, 0xff8a30, 14, 9);
          popup('THE DRAKE BLEEDS (' + drakeHp + ')', giant.position, true);
          giantTrauma = 1;
          if (drakeHp <= 0){
            drakeKilled = true; drake.visible = false; drakeShadow.visible = false; drakeState = 'off';
            burst(drake.position, 0xff5a10, 30, 12, 0.4);
            popup('THE HUNT IS OVER — WHAT FLED FROM YOU NOW FALLS', giant.position, true);
            setTimeout(() => { startColossus(); }, 2200);
          }
        }
      }
      if (coloActive){
        const to = colossus.position.clone().sub(giant.position); to.y = 0;
        if (to.length() <= 17){
          coloHp--; hitAny = true;
          burst(colossus.position.clone().setY(16), 0xb040ff, 12, 8);
          giantTrauma = Math.min(1, giantTrauma + 0.3);
          if (!coloHalf && coloHp <= 13){
            coloHalf = true;
            popup('THE COLOSSUS FRACTURES — IT CALLS THE SWARM', colossus.position, true);
            for (let i=0;i<5;i++) makeSkit(new THREE.Vector3(giant.position.x + (Math.random()-.5)*24, 0, giant.position.z + (Math.random()-.5)*24));
          }
          if (coloHp <= 0){
            coloActive = false; gKills++;
            burst(colossus.position.clone().setY(10), 0xb040ff, 40, 14, 0.5);
            colossus.visible = false;
            giantTrauma = 1;
            showOverlay('THE CINDER GATE STANDS',
              'HOLLOW FELLED: ' + gKills + '<br>EVICTION COLUMN SAVED: ' + evacueesSaved + '<br>THE SLEEPING FIRE WAKES — EMBERHOLLOW REMEMBERS ITS GOD.');
          }
        }
      }
      if (hitAny) giantTrauma = Math.min(1, giantTrauma + 0.15);
    }, 180);
  }
  function doSlam(){
    if (gAttacking > 0.55) return;
    gAttacking = 0.7;
    giantTrauma = 1;
    burst(giant.position, 0xff8a30, 26, 10);
    enemies.forEach(e => {
      if (e.dead) return;
      const d = e.obj.position.clone().sub(giant.position).setY(0).length();
      if (d <= 20){ e.dead = true; gKills++; burst(e.obj.position, 0xff7a20, 8, 8); }
    });
  }

  // ============ BEAT SEQUENCING ============
  function startDrake(){
    drakeState = 'hunt'; drake.visible = true; drake.position.set(30, 26, 14); drakeT = 0;
    setBeat(4, 'DRAKE CROSSING', 'SURVIVE THE DRAKE — REACH THE WATCHTOWER SHELTER');
    popup('A SHADOW CROSSES THE SUN — THE ERASED DRAKE HUNTS', sprite.position, true);
  }
  function startColossus(){
    coloActive = true; colossus.visible = true;
    colossus.position.set(0, 0, -100);
    setBeat(8, 'GRIMLIGHT COLOSSUS ARENA', 'DEFEAT THE STOLEN GIANT');
    popup('THE HOLLOW WEARS A GOD — THE GRIMLIGHT COLOSSUS RISES', giant.position, true);
  }
  function ascend(){
    phase = 'ascend';
    setBeat(6, 'RITE OF ASCENSION', 'RISE.');
    popup('THE SLEEPING FIRE OPENS ITS EYE', gate.position, true);
    // the swap
    sprite.visible = false;
    giant.visible = true;
    giant.position.set(0, 0, -31);
    giant.rotation.y = Math.PI; // face the battlefield
    lanternLight.intensity = 0;
    gateGlow.material.opacity = 0.6;
    moveTarget = null;
    setTimeout(() => {
      phase = 'giant';
      btnA.childNodes[0].textContent = 'SMASH';
      btnA.childNodes[1].textContent = 'HOLD TO CHAIN';
      btnB.childNodes[0].textContent = 'SLAM';
      btnB.childNodes[1].textContent = 'AOE 20M';
      setBeat(7, 'GIANT BATTLEFIELD', 'HOLD THE LANES — PROTECT THE EVACUEE COLUMN');
      popup('YOU ARE THE DISASTER NOW', giant.position, true);
      evacueesSpawned = true;
      for (let i=0;i<5;i++) makeSurvivor(new THREE.Vector3((Math.random()-.5)*3, 0, 40 + Math.random()*4));
      survivors.forEach(s => { s.wp = 0; });
    }, 2400);
  }

  // ============ CAMERA ============
  function updateCamera(dt){
    let target, look;
    if (phase === 'sprite' || (phase === 'ascend' && !giant.visible)){
      target = sprite.position.clone().add(new THREE.Vector3(7, 9, 7));
      look = sprite.position.clone().setY(1);
    } else if (phase === 'ascend'){
      // ascension pull-up: camera rises as the god forms
      const k = 1 - Math.min(1, (giant.position.y + 1) / 20);
      target = giant.position.clone().add(new THREE.Vector3(38, 30, 38));
      look = giant.position.clone().setY(12);
    } else {
      const dist = 36;
      target = giant.position.clone().add(new THREE.Vector3(Math.sin(giant.rotation.y), 0, Math.cos(giant.rotation.y)).multiplyScalar(-dist));
      target.y = 20;
      look = giant.position.clone().setY(8);
    }
    camera.position.lerp(target, 1 - Math.exp(-4*dt));
    if (giantTrauma > 0){
      shakeT += dt*30;
      const amp = giantTrauma*0.5;
      look.x += Math.sin(shakeT*1.4)*amp; look.y += Math.cos(shakeT*1.2)*amp*0.6;
      giantTrauma = Math.max(0, giantTrauma - dt*1.9);
    }
    camera.lookAt(look);
  }

  // ============ LOOP ============
  const clock = new THREE.Clock();
  let laneT = 0, ambT = 0;
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const et = clock.elapsedTime;
    // cooldowns
    if (attacking > 0) attacking -= dt;
    if (rollCd > 0){ rollCd -= dt; btnB.childNodes[1].textContent = rollCd > 0 ? rollCd.toFixed(1) + 's' : 'DODGE'; }
    if (iframes > 0) iframes -= dt;
    if (gAttacking > 0) gAttacking -= dt;

    // ---------- SPRITE MOVEMENT ----------
    if (phase === 'sprite'){
      if (rollT > 0){
        rollT -= dt;
        sprite.position.add(rollDir.clone().multiplyScalar(16*dt));
        sprite.rotation.y = Math.atan2(rollDir.x, rollDir.z);
      } else if (moveTarget){
        const to = moveTarget.clone().sub(sprite.position); to.y = 0;
        if (to.length() < 0.4){ moveTarget = null; }
        else {
          const dir = to.normalize();
          sprite.rotation.y = Math.atan2(dir.x, dir.z);
          sprite.position.add(dir.multiplyScalar(5.6*dt));
          const sw = Math.sin(et*12)*0.5;
          sLegL.rotation.x = sw; sLegR.rotation.x = -sw;
        }
      }
      if (slashHeld && attacking <= 0 && rollT <= 0) doSlash();

      // BEAT 1: keeper
      if (beat === 1 && sprite.position.distanceTo(keeper.position) < 2.4){
        hasLantern = true;
        coldLantern.material.opacity = 1;
        lanternLight.intensity = 1.4;
        popup('KEEPER: "The flame is cold and the Hollow is patient. Take the Lantern. Walk the road. Wake what sleeps."', keeper.position, true);
        setBeat(2, 'CHARCOAL FOREST', 'CROSS THE FOREST — LIGHT THE SHRINE BRAZIER');
        for (let i=0;i<3;i++) makeSkit(new THREE.Vector3((Math.random()-.5)*12, 0, 20 + i*4));
      }
      // corruption fades in lantern light
      if (hasLantern){
        corruptions.forEach(c => {
          const d = c.position.distanceTo(sprite.position);
          if (d < 6) c.material.opacity = Math.max(0, c.material.opacity - dt*0.5);
        });
      }
      // BEAT 3: shrine
      if (beat === 2 && hasLantern && sprite.position.distanceTo(new THREE.Vector3(-15, 0, 11.6)) < 2.6){
        shrineLit = true; shrineFlame.material.opacity = 0.95;
        const sl = new THREE.PointLight(0x9ac0ff, 1.2, 10, 2); sl.position.set(-15, 2, 12); scene.add(sl);
        popup('TABLET: "Below this hill the Sleeping Fire dreams. When the Gate is cold, only its Warden may kindle it."', shrine.position, true);
        gateGlow.material.opacity = 0.4;
        popup('THE DISTANT GATE PULSES — HEAD NORTH ALONG THE ROAD', sprite.position, true);
        setTimeout(startDrake, 1600);
      }
      // BEAT 5: survivors → escort
      if (beat === 4 && survivorsSpawned === false && sprite.position.distanceTo(watchtower.position) < 5){
        survivorsSpawned = true;
        for (let i=0;i<6;i++) makeSurvivor(new THREE.Vector3(13 + (Math.random()-.5)*3, 0, -2 + (Math.random()-.5)*3));
        popup('SURVIVORS: "The town burns behind us. Guard us to the Gate, Warden."', watchtower.position, true);
        setBeat(5, 'EVACUATION ROAD', 'ESCORT THE SURVIVORS TO THE CINDER GATE');
      }
      // BEAT 6: rite
      if (beat === 5 && survivorsSpawned){
        const arrived = survivors.filter(s => s.obj.position.distanceTo(new THREE.Vector3(0,0,-31)) < 3).length;
        if (arrived >= 3){ ascend(); }
      }
    }

    // ---------- DRAKE (sprite phase = strafe; giant phase = killable) ----------
    if (drakeState === 'hunt' && phase === 'sprite'){
      drakeT += dt;
      // circle high above
      const a = et*0.55;
      drake.position.set(Math.cos(a)*34, 24, 8 + Math.sin(a)*20);
      drake.rotation.y = -a + Math.PI/2;
      drakeShadow.position.set(drake.position.x, 0.1, drake.position.z);
      drakeShadow.visible = true;
      // strafe telegraph every 5.5s
      stripeT -= dt;
      if (stripeT <= 0){
        stripeT = 5.5;
        // aim stripe at hero's predicted pos
        const dir = sprite.position.clone().sub(drake.position).setY(0).normalize();
        stripe.position.copy(sprite.position.clone().add(dir.multiplyScalar(7))).setY(0.09);
        stripe.rotation.z = Math.atan2(dir.x, dir.z);
        stripe.material.opacity = 0.55;
        const stripePos = stripe.position.clone(), stripeRot = stripe.rotation.z;
        setTimeout(() => {
          if (phase !== 'sprite') return;
          stripe.material.opacity = 0;
          const rel = sprite.position.clone().sub(stripePos); rel.y = 0;
          // rotate rel by -stripeRot to check stripe-local box
          const c2 = Math.cos(-stripeRot), s2 = Math.sin(-stripeRot);
          const lx = rel.x*c2 - rel.z*s2, lz = rel.x*s2 + rel.z*c2;
          if (Math.abs(lx) < 1.8 && Math.abs(lz) < 7){ hurt(20, sprite.position); popup('SCORCHED', sprite.position, true); }
          burst(stripePos, 0xff5a10, 12, 7);
        }, 1100);
      }
    } else if (drakeState === 'hunt' && phase === 'giant'){
      // dives at the giant — in reach when low
      drakeT += dt;
      const a = et*0.7;
      const low = (drakeDive > 0);
      drakeDive = Math.max(0, drakeDive - dt);
      if (Math.sin(et*0.9) > 0.93) drakeDive = 1.2;
      const targetY = low ? 8 : 20;
      drake.position.set(giant.position.x + Math.cos(a)*28, targetY, giant.position.z + Math.sin(a)*28);
      drake.rotation.y = -a + Math.PI/2;
      drakeShadow.position.set(drake.position.x, 0.1, drake.position.z);
    }

    // ---------- SURVIVORS / EVACUEES ----------
    if (survivorsSpawned){
      survivors.forEach((s, idx) => {
        if (s.hp <= 0) return;
        const wp = WAYPOINTS[s.wp];
        if (!wp) return;
        const to = wp.clone().sub(s.obj.position); to.y = 0;
        if (to.length() < 0.5){ s.wp++; if (s.wp >= WAYPOINTS.length){ evacueesSaved++; s.hp = 0; burst(s.obj.position, 0xffcf6a, 6, 4); s.obj.visible = false; } return; }
        s.obj.position.add(to.normalize().multiplyScalar(1.6*dt));
        s.obj.rotation.y = Math.atan2(to.x, to.z);
      });
    }
    // evacuee second wave (giant phase) walks from town to gate
    if (evacueesSpawned){
      survivors.forEach(s => {
        if (s.hp <= 0) return;
        if (s.wp >= WAYPOINTS.length) return;
        const wp = WAYPOINTS[s.wp];
        const to = wp.clone().sub(s.obj.position); to.y = 0;
        if (to.length() < 0.5){ s.wp++; if (s.wp >= WAYPOINTS.length){ evacueesSaved++; popup('EVACUEE SAFE', s.obj.position, true); s.obj.visible = false; s.hp = 0; } return; }
        s.obj.position.add(to.normalize().multiplyScalar(1.8*dt));
      });
    }

    // ---------- AMBUSHES (sprite escort beat) ----------
    if (beat === 5 && phase === 'sprite'){
      ambushT -= dt;
      if (ambushT <= 0){
        ambushT = 9 + Math.random()*4;
        const lead = survivors.filter(s => s.hp > 0)[0];
        if (lead){
          makeSkit(lead.obj.position.clone().add(new THREE.Vector3((Math.random()-.5)*8, 0, 3 + Math.random()*3)));
          makeSkit(lead.obj.position.clone().add(new THREE.Vector3((Math.random()-.5)*-8, 0, 3 + Math.random()*3)));
          popup('AMBUSH ON THE COLUMN', lead.obj.position, true);
        }
      }
    }

    // ---------- GIANT BATTLEFIELD waves ----------
    if (phase === 'giant' && !coloActive){
      laneT -= dt;
      if (laneT <= 0){
        laneT = 2.6;
        const lanes = [[-22,-52],[0,-58],[22,-48]];
        const L = lanes[Math.floor(Math.random()*3)];
        for (let i=0;i<4;i++) makeSkit(new THREE.Vector3(L[0] + (Math.random()-.5)*10, 0, L[1] + (Math.random()-.5)*10));
      }
    }

    // ---------- ENEMY AI ----------
    enemies.forEach((e, idx) => {
      if (e.dead){
        e.obj.position.y -= dt*2; e.obj.rotation.x += dt*3;
        if (e.obj.position.y < -1.5){ scene.remove(e.obj); enemies.splice(idx,1); }
        return;
      }
      if (e.flashT > 0){ e.flashT -= dt*4; const s = 1 + 0.2*Math.max(0,e.flashT); e.obj.scale.setScalar(s); } else e.obj.scale.setScalar(1);
      e.walkT += dt;
      const anchor = phase === 'sprite' ? sprite : giant;
      const aggroR = phase === 'sprite' ? 16 : 60;
      let goal = null;
      // priority: nearest living survivor, else the hero
      let bestS = null, bestD = 99;
      survivors.forEach(s => { if (s.hp > 0){ const d = s.obj.position.distanceTo(e.obj.position); if (d < bestD){ bestD = d; bestS = s; } } });
      const dHero = e.obj.position.distanceTo(anchor.position);
      if (bestS && bestD < 24) goal = bestS.obj.position;
      else if (dHero < aggroR) goal = anchor.position;
      if (goal){
        const to = goal.clone().sub(e.obj.position); to.y = 0;
        const ty = Math.atan2(to.x, to.z);
        let dy = ty - e.yaw; while (dy > Math.PI) dy -= Math.PI*2; while (dy < -Math.PI) dy += Math.PI*2;
        e.yaw += dy * Math.min(1, 6*dt);
        e.obj.rotation.y = e.yaw;
        if (to.length() > 1.6) e.obj.position.add(new THREE.Vector3(Math.sin(e.yaw),0,Math.cos(e.yaw)).multiplyScalar(4.4*dt));
        else {
          // attack
          if (bestS && bestS.hp > 0 && bestD < 1.8){
            if (e.atkCd === undefined) e.atkCd = 1.2;
            e.atkCd -= dt;
            if (e.atkCd <= 0){ e.atkCd = 1.8; bestS.hp--; burst(bestS.obj.position, 0xc02020, 4, 3); popup('SURVIVOR HURT', bestS.obj.position, true);
              if (bestS.hp <= 0){ bestS.obj.visible = false; popup('A SURVIVOR IS LOST', bestS.obj.position, true); } }
          } else if (dHero < 2.2){
            if (e.atkCd === undefined) e.atkCd = 1.0;
            e.atkCd -= dt;
            if (e.atkCd <= 0){ e.atkCd = 1.6; if (phase === 'sprite') hurt(10, sprite.position); }
          }
        }
      }
    });

    // ---------- COLOSSUS ----------
    if (coloActive){
      const to = giant.position.clone().sub(colossus.position); to.y = 0;
      const dL = to.length();
      coloSlamCd -= dt;
      if (dL > 18){
        colossus.position.add(to.normalize().multiplyScalar(3.4*dt));
        colossus.rotation.y = Math.atan2(to.x, to.z);
      } else if (coloSlamCd <= 0){
        coloSlamCd = coloHalf ? 3.2 : 4.5;
        coloTelePos.copy(giant.position);
        coloTele.position.copy(coloTelePos).setY(0.1);
        coloTeleT = 1.4;
        setTimeout(() => {
          if (!coloActive) return;
          burst(coloTelePos, 0xc040ff, 20, 10, 0.3);
          giantTrauma = 1;
          const dNow = giant.position.clone().sub(coloTelePos).setY(0).length();
          if (dNow < 11) hurt(20, giant.position);
        }, 1400);
      }
    }
    if (coloTeleT > 0){ coloTeleT -= dt; coloTele.material.opacity = Math.max(0, coloTeleT/1.4)*0.65; }
    else coloTele.material.opacity = 0;

    // ---------- FX misc ----------
    lavaPools.forEach(L => { L.m.material.opacity = L.base * (0.75 + 0.35*Math.sin(et*1.5 + L.ph)); });
    gateGlow.material.opacity = Math.max(gateGlow.material.opacity, 0.14) * (0.9 + 0.25*Math.sin(et*2));
    if (phase === 'giant' || (phase === 'ascend' && giant.visible)) swordG.rotation.z = -0.35 + Math.sin(et*1.5)*0.06;
    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vel.y -= 12*dt; p.m.position.addScaledVector(p.vel, dt);
      p.m.rotation.x += 6*dt; p.life -= dt;
      p.m.material.opacity = Math.max(0, p.life);
      if (p.life <= 0){ scene.remove(p.m); particles.splice(i,1); }
    }
    updatePopups(dt);
    updateCamera(dt);
    renderer.render(scene, camera);
  }
  animate();

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
