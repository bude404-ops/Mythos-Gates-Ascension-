<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVALON: THE WAKING GATES — Cinematic Teaser</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#000; overflow:hidden; font-family: Georgia,'Times New Roman',serif; }
  #stage { position:fixed; inset:0; background:#000; }
  .shot { position:absolute; inset:0; background-size:cover; background-position:center; opacity:0; will-change:transform,opacity; }
  .shot.active { opacity:1; }
  /* letterbox + grade */
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:5;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  .bar { position:fixed; left:0; width:100%; background:#000; z-index:6; }
  #bar-t { top:0; } #bar-b { bottom:0; }
  #grade { position:fixed; inset:0; pointer-events:none; z-index:4;
    background: linear-gradient(180deg, rgba(20,26,38,.10), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(10,8,4,.16));
    mix-blend-mode:multiply; }
  #grade2 { position:fixed; inset:0; pointer-events:none; z-index:4;
    background: rgba(255,170,80,.045); mix-blend-mode:screen; }
  #grain { position:fixed; inset:0; pointer-events:none; z-index:7; opacity:.07; }
  #embers { position:fixed; inset:0; pointer-events:none; z-index:6; }
  /* cards */
  #card { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:8; opacity:0; transition:opacity 1.1s ease; pointer-events:none; text-align:center; padding:0 6vw; }
  #card .line { color:#d8b26a; text-transform:uppercase; letter-spacing:.42em; font-size:clamp(15px,2.6vw,30px);
    text-shadow:0 0 22px rgba(216,178,106,.35), 0 2px 6px #000; font-weight:normal; }
  #card .sub { margin-top:1.4em; color:#9a8a68; letter-spacing:.24em; text-transform:uppercase; font-size:clamp(10px,1.2vw,14px); }
  /* title lockup */
  #title-lock { display:none; flex-direction:column; align-items:center; }
  #title-lock img { width:clamp(110px,17vw,220px); filter:drop-shadow(0 0 30px rgba(255,140,50,.25)); }
  #title-lock .t1 { margin-top:1.1em; color:#e8d9b8; font-size:clamp(30px,6.4vw,84px); letter-spacing:.34em;
    text-transform:uppercase; text-shadow:0 0 34px rgba(232,180,90,.35), 0 3px 14px #000; padding-left:.34em; }
  #title-lock .t2 { margin-top:.5em; color:#b39863; font-size:clamp(13px,2.2vw,26px); letter-spacing:.5em;
    text-transform:uppercase; padding-left:.5em; }
  #title-lock .t3 { margin-top:2.2em; color:#7d6f52; font-size:clamp(10px,1.2vw,14px); letter-spacing:.6em; text-transform:uppercase; padding-left:.6em; }
  /* start overlay */
  #start { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #0a0805 0%, #000 75%); cursor:pointer; }
  #start img { width:clamp(90px,14vw,180px); opacity:.92; filter:drop-shadow(0 0 26px rgba(255,140,50,.22)); }
  #start .s1 { margin-top:1.4em; color:#e8d9b8; font-size:clamp(18px,3.4vw,42px); letter-spacing:.34em; text-transform:uppercase; padding-left:.34em; }
  #start .s2 { margin-top:.4em; color:#b39863; font-size:clamp(11px,1.6vw,20px); letter-spacing:.5em; text-transform:uppercase; padding-left:.5em; }
  #start .play { margin-top:3em; color:#d8b26a; border:1px solid rgba(216,178,106,.45); padding:.9em 2.6em;
    letter-spacing:.34em; text-transform:uppercase; font-size:clamp(10px,1.3vw,14px); transition:all .3s; }
  #start .play:hover { background:rgba(216,178,106,.12); box-shadow:0 0 30px rgba(216,178,106,.25); }
  #start .hint { margin-top:1.6em; color:#5c5138; font-size:11px; letter-spacing:.2em; text-transform:uppercase; }
  #end-ui { position:fixed; inset:0; z-index:15; display:none; align-items:center; justify-content:center; gap:2.4em; }
  #end-ui button { background:none; border:1px solid rgba(216,178,106,.4); color:#d8b26a; padding:.8em 2.2em;
    letter-spacing:.3em; text-transform:uppercase; font-family:inherit; font-size:12px; cursor:pointer; }
  #end-ui button:hover { background:rgba(216,178,106,.1); }
</style>
</head>
<body>
  <div id="stage">
    <div class="shot" id="shotA"></div>
    <div class="shot" id="shotB"></div>
  </div>
  <div id="grade"></div><div id="grade2"></div>
  <div id="vignette"></div>
  <canvas id="embers"></canvas>
  <canvas id="grain"></canvas>
  <div class="bar" id="bar-t"></div><div class="bar" id="bar-b"></div>

  <div id="card"><div class="line" id="cardline"></div><div class="sub" id="cardsub"></div>
    <div id="title-lock">
      <img src="cinematic/GATE-RUNE-SIGIL-v3-RUGGED.png" alt="">
      <div class="t1">Avalon</div>
      <div class="t2">The Waking Gates</div>
      <div class="t3">Rise With Your God</div>
    </div>
  </div>

  <div id="end-ui"><button onclick="startSeq()">Replay</button><button onclick="location.href='index.html'">Enter the Gates</button></div>

  <div id="start" onclick="begin()">
    <img src="cinematic/GATE-RUNE-SIGIL-v3-RUGGED.png" alt="">
    <div class="s1">Avalon</div>
    <div class="s2">The Waking Gates</div>
    <div class="play">&#9654;&ensp;Play Teaser</div>
    <div class="hint">Sound on. Best fullscreen.</div>
  </div>

<script>
/* ============ LETTERBOX (2.39:1) ============ */
const bars = document.getElementById('bar-t'), barsB = document.getElementById('bar-b');
function layout(){ const h=Math.max(0,(innerHeight-innerWidth/2.39)/2); bars.style.height=barsB.style.height=h+'px';
  const c=document.getElementById('embers'); c.width=innerWidth; c.height=innerHeight; }
addEventListener('resize', layout); layout();

/* ============ SHOT LIST ============ */
const P='cinematic/';
const SHOTS=[
 {src:P+'SHOT-01-LONG-ROAD.jpg',      dur:7.0, from:[1.00,-.02,.00], to:[1.14,.00,.00]},
 {src:P+'SHOT-02-PILGRIM-WALK.jpg',   dur:7.0, from:[1.12,-.05,.00], to:[1.02,.04,.01]},
 {src:P+'SHOT-03-NIGHT-VIGIL.jpg',    dur:6.0, from:[1.06,.00,.02],  to:[1.16,-.02,-.03], ember:1},
 {card:'THE ROADS REMEMBER',          dur:3.4},
 {src:P+'SHOT-04-PROCESSION-GATE.jpg',dur:7.0, from:[1.16,.03,.00],  to:[1.02,-.03,.00], ember:1},
 {src:P+'SHOT-05-GOD-REVEAL.jpg',     dur:8.0, from:[1.02,.00,-.02], to:[1.22,.00,.02], riser:1},
 {src:P+'SHOT-09-IMPACT-SLAM.jpg',    dur:2.6, from:[1.20,.02,.00],  to:[1.06,-.02,.00], slam:1},
 {src:P+'SHOT-06-STORM-GOD.jpg',      dur:5.0, from:[1.10,-.04,.00], to:[1.02,.04,.00]},
 {src:P+'SHOT-07-THE-HOLLOW.jpg',     dur:5.0, from:[1.04,.00,.00],  to:[1.18,.00,.02]},
 {src:P+'SHOT-08-FINAL-STAND.jpg',    dur:7.5, from:[1.18,.00,.00],  to:[1.02,.00,.00], ember:1},
 {card:'RISE.',                       dur:2.8},
 {title:1,                           dur:8.5},
];

/* ============ AUDIO ============ */
let AC=null, master=null, droneNodes=[];
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
}
function noiseBuf(){ const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; return b; }
function startDrone(){
  const g=AC.createGain(); g.gain.value=0; g.connect(master);
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=170; f.connect(g);
  [55,55.4,110.2].forEach(fr=>{ const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=fr;
    const og=AC.createGain(); og.gain.value=.33; o.connect(og); og.connect(f); o.start(); droneNodes.push(o); });
  const sub=AC.createOscillator(); sub.type='sine'; sub.frequency.value=27.5;
  const sg=AC.createGain(); sg.gain.value=.5; sub.connect(sg); sg.connect(g); sub.start(); droneNodes.push(sub);
  g.gain.linearRampToValueAtTime(.12, AC.currentTime+3);
  droneNodes.g=g;
}
function stopDrone(){ if(!droneNodes.g)return; droneNodes.g.gain.linearRampToValueAtTime(0,AC.currentTime+1.5);
  const dn=droneNodes; setTimeout(()=>dn.forEach(o=>{try{o.stop()}catch(e){}}),1700); droneNodes=[]; }
function boom(vol=1){ if(!AC)return; const t=AC.currentTime;
  const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(72,t); o.frequency.exponentialRampToValueAtTime(30,t+.5);
  const g=AC.createGain(); g.gain.setValueAtTime(.85*vol,t); g.gain.exponentialRampToValueAtTime(.001,t+2.2);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+2.4);
  const n=AC.createBufferSource(); n.buffer=noiseBuf(); const nf=AC.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=140;
  const ng=AC.createGain(); ng.gain.setValueAtTime(.5*vol,t); ng.gain.exponentialRampToValueAtTime(.001,t+.45);
  n.connect(nf); nf.connect(ng); ng.connect(master); n.start(t); n.stop(t+.5);
}
function riser(dur){ if(!AC)return; const t=AC.currentTime;
  const n=AC.createBufferSource(); n.buffer=noiseBuf(); n.loop=true;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.1;
  f.frequency.setValueAtTime(180,t); f.frequency.exponentialRampToValueAtTime(2400,t+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(.001,t); g.gain.exponentialRampToValueAtTime(.30,t+dur);
  g.gain.setValueAtTime(.30,t+dur); g.gain.exponentialRampToValueAtTime(.001,t+dur+.28);
  n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t+dur+.4);
}
function swell(){ if(!AC)return; const t=AC.currentTime;
  const o=AC.createOscillator(); o.type='sine'; o.frequency.value=55; const o5=AC.createOscillator(); o5.type='sine'; o5.frequency.value=82.5;
  const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.16,t+2.4); g.gain.linearRampToValueAtTime(.06,t+6);
  o.connect(g); o5.connect(g); g.connect(master); o.start(t); o5.start(t); o.stop(t+7); o5.stop(t+7);
}

/* ============ EMBERS ============ */
const ec=document.getElementById('embers'), ex=ec.getContext('2d');
let embers=[], emberOn=0;
function spawnEmbers(n){ embers=[]; for(let i=0;i<n;i++) embers.push({x:Math.random()*ec.width,y:Math.random()*ec.height,
  r:Math.random()*2.2+.6, s:Math.random()*.45+.18, sw:Math.random()*1.2, p:Math.random()*6.28, a:Math.random()*.5+.2}); }
function drawEmbers(dt,t){ ex.clearRect(0,0,ec.width,ec.height); if(!emberOn)return;
  for(const e of embers){ e.y-=e.s*dt*60; e.p+=.016; const x=e.x+Math.sin(e.p)*e.sw*8;
    const fl=.55+.45*Math.sin(t*2+e.p*3); const al=e.a*fl*(1-Math.max(0,(e.y/(ec.height*.9))));
    if(e.y<-10){ e.y=ec.height+10; e.x=Math.random()*ec.width; }
    ex.beginPath(); ex.arc(x,e.y,e.r,0,6.29);
    ex.fillStyle=`rgba(255,${150+Math.floor(fl*60)},60,${al*.8})`;
    ex.shadowColor='rgba(255,140,50,.8)'; ex.shadowBlur=6; ex.fill(); ex.shadowBlur=0; }
}

/* ============ GRAIN ============ */
const gc=document.getElementById('grain'), gx=gc.getContext('2d');
const gframes=[]; function makeGrain(){ gc.width=256; gc.height=256;
  for(let k=0;k<4;k++){ const c=document.createElement('canvas'); c.width=256; c.height=256; const x=c.getContext('2d');
    const id=x.createImageData(256,256); for(let i=0;i<id.data.length;i+=4){ const v=Math.random()*255;
      id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255; } x.putImageData(id,0,0); gframes.push(c); } }
makeGrain();
let gk=0, gT=0;
function drawGrain(dt){ gT+=dt; if(gT>.08){ gT=0; gk=(gk+1)%4; gx.clearRect(0,0,gc.width,gc.height); gx.drawImage(gframes[gk],0,0,gc.width,gc.height); } }

/* ============ CARD ============ */
const card=document.getElementById('card'), cardline=document.getElementById('cardline'),
      cardsub=document.getElementById('cardsub'), lock=document.getElementById('title-lock');
function showCard(line,sub){ cardline.textContent=line||''; cardsub.textContent=sub||'';
  cardline.style.display=line?'block':'none'; cardsub.style.display=sub?'block':'none';
  lock.style.display='none'; card.style.opacity=1; }
function showTitle(){ cardline.style.display='none'; cardsub.style.display='none'; lock.style.display='flex'; card.style.opacity=1; }
function hideCard(){ card.style.opacity=0; }

/* ============ SEQUENCE ENGINE ============ */
const A=document.getElementById('shotA'), B=document.getElementById('shotB');
let cur=A, nxt=B, running=false, t0=0, idx=-1, raf=null, last=0;
function ease(u){ return .5-.5*Math.cos(Math.PI*Math.min(1,Math.max(0,u))); }
function apply(el,scale,dx,dy){ el.style.transform=`scale(${scale}) translate(${dx*100}%, ${dy*100}%)`; }
function startSeq(){
  document.getElementById('start').style.display='none';
  document.getElementById('end-ui').style.display='none';
  running=true; idx=-1; t0=performance.now()/1000; last=t0; nextShot(true);
  if(AC){ try{AC.close()}catch(e){} } initAudio(); startDrone();
}
function begin(){ document.getElementById('start').style.display='none'; startSeq(); }
window.begin=begin;
function nextShot(first){
  idx++; if(idx>=SHOTS.length){ finish(); return; }
  const s=SHOTS[idx];
  if(s.card){ boom(.8); showCard(s.card); setTimeout(()=>{hideCard();},(s.dur-1.1)*1000);
    setTimeout(()=>{nextShot();}, s.dur*1000); return; }
  if(s.title){ boom(1); swell(); showTitle(); setTimeout(()=>{hideCard();},(s.dur-1.4)*1000);
    setTimeout(()=>{finish();}, s.dur*1000); return; }
  if(s.slam) boom(1);
  if(s.riser) riser(s.dur-1.2);
  emberOn=s.ember?1:0; if(emberOn) spawnEmbers(46);
  const old=cur; cur=nxt; nxt=old;
  cur.style.backgroundImage=`url("${s.src}")`;
  apply(cur, s.from[0], s.from[1], s.from[2]);
  cur.style.opacity=0; cur.classList.add('active');
  // crossfade in
  cur.style.transition='opacity 1.2s ease'; requestAnimationFrame(()=>{cur.style.opacity=1;});
  if(!first){ nxt.style.transition='opacity 1.2s ease'; nxt.style.opacity=0; }
  const startT=performance.now()/1000; const dur=s.dur*1000;
  const anim=()=>{ if(!running)return;
    const now=performance.now()/1000; let u=(now-startT)*1000/dur;
    if(u>=1){ return; }
    const e=ease(u); const sc=s.from[0]+(s.to[0]-s.from[0])*e;
    const dx=s.from[1]+(s.to[1]-s.from[1])*e, dy=s.from[2]+(s.to[2]-s.from[2])*e;
    apply(cur, sc, dx, dy); raf=requestAnimationFrame(anim); };
  anim();
  setTimeout(()=>{nextShot();}, dur);
}
function finish(){ running=false; stopDrone(); emberOn=0; hideCard();
  document.getElementById('end-ui').style.display='flex'; }

/* main loop: embers + grain */
function loop(ts){ const t=ts/1000; const dt=Math.min(.05,t-(loop.last||t)); loop.last=t;
  drawEmbers(dt,t); drawGrain(dt); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

/* preload */
SHOTS.forEach(s=>{ if(s.src){ const i=new Image(); i.src=s.src; } });
</script>
</body>
</html>
