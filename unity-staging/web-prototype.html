<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MYTHOS GATES — Playable Prototype v4 (Feel Pass 3)</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0a0a12;font-family:Georgia,serif;-webkit-user-select:none;user-select:none;touch-action:none}
  #hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#e8c47a;text-align:center;z-index:10;pointer-events:none;text-shadow:0 2px 6px #000}
  #faith{font-size:20px;letter-spacing:2px}
  #combo{font-size:13px;color:#ff8a30;letter-spacing:2px;margin-top:2px;opacity:0;transition:opacity .15s}
  #sub{font-size:11px;color:#9a8b6f;margin-top:2px}
  #moveHint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:#7a705d;font-size:11px;z-index:10;pointer-events:none;text-align:center}
  .btn{position:fixed;z-index:11;border:2px solid #6f5a33;background:rgba(20,16,10,.82);color:#e8c47a;border-radius:50%;width:74px;height:74px;font-size:11px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:Georgia,serif}
  .btn small{font-size:8px;color:#9a8b6f;margin-top:1px}
  .btn:active{background:#3a2c14}
  .btn.dim{opacity:.4}
  #btnL1{right:20px;bottom:96px}
  #btnSlam{right:108px;bottom:104px}
  #btnWave{right:108px;bottom:20px}
  #btnCharge{left:20px;bottom:20px}
  #btnCharge.on{background:#4a2c10;border-color:#c47a2a}
  .pop{position:fixed;z-index:12;color:#ffd08a;font-size:16px;font-weight:bold;pointer-events:none;text-shadow:0 0 8px #ff5a10,0 2px 4px #000;letter-spacing:1px}
  .pop.heavy{color:#ff6a20;font-size:20px}
  #verdict{position:fixed;top:84px;left:50%;transform:translateX(-50%);color:#6f5a33;font-size:10px;z-index:10;pointer-events:none;text-align:center;width:90%}
</style>
</head>
<body>
<div id="hud"><div id="faith">FAITH 20</div><div id="combo">COMBO ×1</div><div id="wave" style="font-size:13px;color:#ff8a30;letter-spacing:2px;margin-top:3px">WAVE 1 INCOMING</div><div id="sub">RELEASE THE UNMADE · <span id="kills">0</span> RELEASED</div></div>
<div id="obj" style="position:fixed;top:52px;left:50%;transform:translateX(-50%);color:#ffb84a;font-size:12px;letter-spacing:1px;z-index:10;pointer-events:none;text-align:center;text-shadow:0 2px 6px #000">OBJECTIVE: SURVIVE 5 WAVES</div>
<div id="victory" style="display:none;position:fixed;inset:0;background:rgba(10,6,2,.88);z-index:20;color:#e8c47a;text-align:center">
  <div style="margin-top:32vh;font-size:26px;letter-spacing:4px">THE CINDER GATE OPENS</div>
  <div id="vstats" style="margin-top:14px;font-size:14px;color:#9a8b6f;line-height:1.8"></div>
  <div class="btn" style="position:relative;margin:26px auto 0;left:0;right:0" onclick="document.getElementById('victory').style.display='none'; window.__endless && window.__endless()">CONTINUE — ENDLESS</div>
</div>
<div id="moveHint">TAP GROUND TO MOVE</div>
<div class="btn" id="btnL1">L1<small>7m ARC</small></div>
<div class="btn" id="btnSlam">SLAM<small>15 FAITH</small></div>
<div class="btn" id="btnWave">WAVE<small>20 FAITH</small></div>
<div class="btn" id="btnCharge">WALK<small>TAP: CHARGE 8</small></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ---------- SCENE ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x16161f);
  scene.fog = new THREE.Fog(0x16161f, 140, 420);
  const camera = new THREE.PerspectiveCamera(73, innerWidth/innerHeight, 0.1, 900);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0x8a7a5a, 0x101018, 0.95));
  const sun = new THREE.DirectionalLight(0xffd9a0, 0.85); sun.position.set(40,90,20); scene.add(sun);

  // ground — Cinderlands placeholder + ember crack-glow dots
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(900,900), new THREE.MeshStandardMaterial({color:0x2b2019, roughness:1}));
  ground.rotation.x = -Math.PI/2; scene.add(ground);
  const grid = new THREE.GridHelper(900, 90, 0x3a2a1c, 0x241a12); grid.position.y = 0.01; scene.add(grid);
  for (let i=0;i<60;i++){
    const dot = new THREE.Mesh(new THREE.CircleGeometry(0.5+Math.random()*2.2, 8),
      new THREE.MeshBasicMaterial({color:0xd84a10, transparent:true, opacity:0.16+Math.random()*0.2}));
    dot.rotation.x = -Math.PI/2; dot.position.set((Math.random()-.5)*300, 0.02, (Math.random()-.5)*300);
    scene.add(dot);
  }

  // ---------- LANDMARKS ----------
  // THE CINDER GATE — objective monument (far north), 26m glowing arch
  const GATE = {pos:new THREE.Vector3(0,0,-95)};
  const gateStone = new THREE.MeshStandardMaterial({color:0x1c1310, roughness:1, emissive:0x6a1c04, emissiveIntensity:0.5});
  const gatePillarL = box(5, 26, 5, gateStone); gatePillarL.position.set(GATE.pos.x-9, 13, GATE.pos.z); scene.add(gatePillarL);
  const gatePillarR = box(5, 26, 5, gateStone); gatePillarR.position.set(GATE.pos.x+9, 13, GATE.pos.z); scene.add(gatePillarR);
  const gateLintel = box(26, 5, 6, gateStone); gateLintel.position.set(GATE.pos.x, 28, GATE.pos.z); scene.add(gateLintel);
  const gateGlow = new THREE.Mesh(new THREE.PlaneGeometry(13, 23), new THREE.MeshBasicMaterial({color:0xff5a10, transparent:true, opacity:0.28, side:THREE.DoubleSide}));
  gateGlow.position.set(GATE.pos.x, 11.5, GATE.pos.z); scene.add(gateGlow);
  // beacon column over the gate
  const gateBeacon = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 2.2, 90, 8, 1, true), new THREE.MeshBasicMaterial({color:0xff7a20, transparent:true, opacity:0.14, side:THREE.DoubleSide}));
  gateBeacon.position.set(GATE.pos.x, 45, GATE.pos.z); scene.add(gateBeacon);
  // rock spires — depth landmarks
  for (let i=0;i<26;i++){
    const h = 6 + Math.random()*22;
    const spire = new THREE.Mesh(new THREE.ConeGeometry(2.4+Math.random()*2.6, h, 5), new THREE.MeshStandardMaterial({color:0x1a120c, roughness:1, emissive:0x3a0e02, emissiveIntensity:0.5}));
    spire.position.set((Math.random()-.5)*240, h/2, (Math.random()-.5)*240);
    if (spire.position.distanceTo(GATE.pos) < 30) spire.position.x += 40;
    scene.add(spire);
  }

  // worship zone — THE SHRINE (upgraded: stone dais + 4 braziers + beacon)
  const WORSHIP = {pos:new THREE.Vector3(0,0,-30), r:12};
  const wz = new THREE.Mesh(new THREE.CircleGeometry(WORSHIP.r, 40), new THREE.MeshBasicMaterial({color:0xe8842a, transparent:true, opacity:0.22}));
  wz.rotation.x = -Math.PI/2; wz.position.copy(WORSHIP.pos).setY(0.05); scene.add(wz);
  const wzRing = new THREE.Mesh(new THREE.RingGeometry(WORSHIP.r-0.5, WORSHIP.r, 40), new THREE.MeshBasicMaterial({color:0xffb84a, transparent:true, opacity:0.8}));
  wzRing.rotation.x = -Math.PI/2; wzRing.position.copy(WORSHIP.pos).setY(0.07); scene.add(wzRing);
  const brazFlames = [];
  const dais = new THREE.Mesh(new THREE.CylinderGeometry(6, 7.5, 1.6, 8), new THREE.MeshStandardMaterial({color:0x241a14, roughness:1, emissive:0x6a1c04, emissiveIntensity:0.4}));
  dais.position.set(WORSHIP.pos.x, 0.8, WORSHIP.pos.z); scene.add(dais);
  for (let i=0;i<4;i++){
    const a = i * Math.PI/2 + Math.PI/4;
    const braz = box(1.2, 2.6, 1.2, new THREE.MeshStandardMaterial({color:0x1c1310, roughness:1}));
    braz.position.set(WORSHIP.pos.x + Math.cos(a)*9, 1.3, WORSHIP.pos.z + Math.sin(a)*9); scene.add(braz);
    const flame = new THREE.Mesh(new THREE.ConeGeometry(1.1, 4.5, 7), new THREE.MeshBasicMaterial({color:0xff7a20, transparent:true, opacity:0.85}));
    flame.position.set(braz.position.x, 4.6, braz.position.z); scene.add(flame);
    const fl = {mesh:flame}; brazFlames.push(fl);
  }
  const shrineBeacon = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.8, 70, 8, 1, true), new THREE.MeshBasicMaterial({color:0xffb84a, transparent:true, opacity:0.16, side:THREE.DoubleSide}));
  shrineBeacon.position.set(WORSHIP.pos.x, 35, WORSHIP.pos.z); scene.add(shrineBeacon);

  // ---------- GIANT ----------
  const giant = new THREE.Group();
  const emberMat = new THREE.MeshStandardMaterial({color:0x3a2318, roughness:0.9, emissive:0xd84a10, emissiveIntensity:0.55});
  const crustMat = new THREE.MeshStandardMaterial({color:0x241a14, roughness:1, emissive:0x8a2a08, emissiveIntensity:0.2});
  function box(w,h,d,mat){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); }
  const torso = box(2.6, 3.0, 1.6, emberMat); torso.position.y = 5.4; giant.add(torso);
  const hips  = box(2.2, 1.2, 1.4, crustMat); hips.position.y = 3.6; giant.add(hips);
  const head  = box(1.1, 1.2, 1.1, emberMat); head.position.y = 7.5; giant.add(head);
  const eyeMat = new THREE.MeshBasicMaterial({color:0xffc26a});
  const eyeL = box(0.18,0.12,0.05, eyeMat); eyeL.position.set(-0.26,7.6,0.56); giant.add(eyeL);
  const eyeR = box(0.18,0.12,0.05, eyeMat); eyeR.position.set(0.26,7.6,0.56); giant.add(eyeR);
  const armL = box(0.7,2.8,0.7, crustMat); armL.position.set(-1.9,5.2,0); giant.add(armL);
  const armR = box(0.7,2.8,0.7, crustMat); armR.position.set(1.9,5.2,0); giant.add(armR);
  const legL = box(0.9,3.2,0.9, crustMat); legL.position.set(-0.7,1.6,0); giant.add(legL);
  const legR = box(0.9,3.2,0.9, crustMat); legR.position.set(0.7,1.6,0); giant.add(legR);
  const swordGroup = new THREE.Group();
  const blade = box(0.5, 4.2, 0.18, new THREE.MeshStandardMaterial({color:0x4a1c08, roughness:0.5, emissive:0xff5a10, emissiveIntensity:0.8}));
  blade.position.y = 2.4; swordGroup.add(blade);
  const hilt = box(0.9, 0.25, 0.25, crustMat); hilt.position.y = 0.15; swordGroup.add(hilt);
  swordGroup.position.set(2.4, 3.2, 0.4); swordGroup.rotation.z = -0.35;
  giant.add(swordGroup);
  giant.position.set(0,0,20);
  scene.add(giant);

  // move marker
  const marker = new THREE.Mesh(new THREE.RingGeometry(0.6,0.85,24), new THREE.MeshBasicMaterial({color:0xffb84a, transparent:true, opacity:0.9}));
  marker.rotation.x = -Math.PI/2; marker.position.y = 0.08; marker.visible = false; scene.add(marker);

  // ---------- FX: slash arc / wave cone / slam ring ----------
  const slashArc = new THREE.Mesh(new THREE.RingGeometry(1.2, 7.2, 24, 1, -0.9, 1.8),
    new THREE.MeshBasicMaterial({color:0xffd08a, transparent:true, opacity:0, side:THREE.DoubleSide}));
  slashArc.rotation.x = -Math.PI/2; slashArc.position.y = 0.9; scene.add(slashArc);
  let slashFlash = 0;

  const waveCone = new THREE.Mesh(new THREE.RingGeometry(2.0, 16.0, 24, 1, -0.62, 1.24),
    new THREE.MeshBasicMaterial({color:0xff7a20, transparent:true, opacity:0, side:THREE.DoubleSide}));
  waveCone.rotation.x = -Math.PI/2; waveCone.position.y = 1.2; scene.add(waveCone);
  let waveFlash = 0, waveProgress = 0;

  const slamRing = new THREE.Mesh(new THREE.RingGeometry(0.80, 1.08, 64), new THREE.MeshBasicMaterial({color:0xff8a30, transparent:true, opacity:0.95, side:THREE.DoubleSide}));
  slamRing.rotation.x = -Math.PI/2; slamRing.visible = false; scene.add(slamRing);

  // ---------- EMBER PARTICLES ----------
  const particles = [];
  const partGeo = new THREE.BoxGeometry(0.28, 0.28, 0.28);
  function burst(pos, color, n, power){
    for (let i=0;i<n;i++){
      const m = new THREE.Mesh(partGeo, new THREE.MeshBasicMaterial({color, transparent:true, opacity:1}));
      m.position.copy(pos); m.position.y += 0.5 + Math.random();
      scene.add(m);
      const a = Math.random()*Math.PI*2;
      particles.push({m, vel:new THREE.Vector3(Math.cos(a)*(1+Math.random()*power), 3+Math.random()*power*0.8, Math.sin(a)*(1+Math.random()*power)), life:0.7+Math.random()*0.5});
    }
  }
  // ambient falling embers
  const ambient = [];
  for (let i=0;i<50;i++){
    const m = new THREE.Mesh(partGeo, new THREE.MeshBasicMaterial({color:0xff7a20, transparent:true, opacity:0.7}));
    m.position.set((Math.random()-.5)*160, Math.random()*40, (Math.random()-.5)*160);
    scene.add(m); ambient.push(m);
  }

  // ---------- POPUPS ----------
  const popups = [];
  const v3 = new THREE.Vector3();
  function popup(text, worldPos, heavy){
    const el = document.createElement('div');
    el.className = 'pop' + (heavy ? ' heavy' : '');
    el.textContent = text;
    document.body.appendChild(el);
    popups.push({el, pos:worldPos.clone(), t:0, heavy});
  }
  function updatePopups(dt){
    for (let i=popups.length-1;i>=0;i--){
      const p = popups[i]; p.t += dt;
      if (p.t > 1.1){ p.el.remove(); popups.splice(i,1); continue; }
      v3.copy(p.pos); v3.y += 2 + p.t*3.5; v3.project(camera);
      if (v3.z > 1){ p.el.style.display='none'; continue; }
      p.el.style.display='block';
      p.el.style.left = ((v3.x*0.5+0.5)*innerWidth) + 'px';
      p.el.style.top = ((-v3.y*0.5+0.5)*innerHeight) + 'px';
      p.el.style.opacity = Math.max(0, 1 - p.t/1.1);
      p.el.style.transform = 'translate(-50%,0) scale(' + (1 + (p.heavy?0.3:0.1)*p.t) + ')';
    }
  }

  // ---------- ENEMIES ----------
  const enemies = [];
  const antMat  = new THREE.MeshStandardMaterial({color:0x1a1a22, roughness:1, emissive:0x111118, emissiveIntensity:0.3});
  const bruteMat= new THREE.MeshStandardMaterial({color:0x241626, roughness:1, emissive:0x2a0a2a, emissiveIntensity:0.4});
  function makeAnt(pos){
    const g = new THREE.Group();
    const b = box(0.5,0.6,0.7, antMat); b.position.y = 0.3; g.add(b);
    const hd = box(0.3,0.3,0.3, antMat); hd.position.set(0,0.55,0.35); g.add(hd);
    g.position.copy(pos); scene.add(g);
    enemies.push({type:'ant', obj:g, yaw:0, dead:false, aggro:26, home:pos.clone(), target:pos.clone(), retarget:2+Math.random()*3, walkT:Math.random()*6});
  }
  function makeBrute(pos){
    const g = new THREE.Group();
    const b = box(1.6,2.2,1.2, bruteMat); b.position.y = 1.1; g.add(b);
    const hd = box(0.7,0.6,0.7, bruteMat); hd.position.y = 2.6; g.add(hd);
    g.position.copy(pos); scene.add(g);
    const e = {type:'brute', obj:g, yaw:0, hp:5, dead:false, stagger:0, flashT:0, walkT:Math.random()*6, home:pos.clone()}; enemies.push(e); return e;
  }
  const objEl = document.getElementById('obj');
  const WIN_WAVE = 5;
  let phase = 'waves'; // waves -> gate -> endless
  // WAVES — constant pressure, BIG
  function spawnWave(n){
    waveNum = n; waveActive = true;
    waveEl.textContent = 'WAVE ' + n;
    popup('WAVE ' + n, giant.position, true);
    const count = Math.min(70, 24 + 8*n);      // WAY more mobs per phase
    for (let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2;
      const r = 22 + Math.random()*14;
      const pos = new THREE.Vector3(giant.position.x + Math.cos(a)*r, 0, giant.position.z + Math.sin(a)*r);
      const e = makeAnt(pos);
      e.aggro = 999; e.speedMul = 1 + Math.random()*0.25;
      e.home = pos.clone();
    }
    const brutes = Math.floor(n/2);            // brute every 2nd wave, stacking
    for (let i=0;i<Math.min(brutes,3);i++) makeBrute(new THREE.Vector3(giant.position.x + (Math.random()>.5?45:-45), 0, giant.position.z - 30));
  }

  // ---------- STATE ----------
  let faith = 20, charging = false;
  let moveTarget = null, attacking = 0, slamActive = 0, slamT = 0;
  let stepPhase = 0, trauma = 0, inWorship = false;
  let swingT = 0, hitstopT = 0, slowmoT = 0, fovKick = 0;
  let comboIdx = 0, comboTimer = 0, comboKills = 0;
  let waveNum = 0, waveActive = false, intermission = 1.5, totalKills = 0, curSpeed = 0;
  const waveEl = document.getElementById('wave'), killsEl = document.getElementById('kills');
  // lock-on marker under the currently locked enemy
  const lockMarker = new THREE.Mesh(new THREE.RingGeometry(0.55, 0.8, 24), new THREE.MeshBasicMaterial({color:0xff5a10, transparent:true, opacity:0.85, side:THREE.DoubleSide}));
  lockMarker.rotation.x = -Math.PI/2; lockMarker.visible = false; scene.add(lockMarker);
  const comboEl = document.getElementById('combo');
  const faithEl = document.getElementById('faith');
  function setFaith(v){ faith = v; faithEl.textContent = 'FAITH ' + Math.floor(faith); }
  setFaith(20);
  function showCombo(){
    if (comboIdx >= 2){ comboEl.textContent = 'COMBO ×' + comboIdx; comboEl.style.opacity = 1; }
    else comboEl.style.opacity = 0;
  }

  // ---------- INPUT ----------
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let tapTime = 0;
  function onTap(ev){
    const t = ev.touches ? ev.touches[0] : ev;
    if (Date.now() - tapTime < 120) return;
    tapTime = Date.now();
    ndc.x = (t.clientX/innerWidth)*2-1; ndc.y = -(t.clientY/innerHeight)*2+1;
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObject(ground)[0];
    if (!hit) return;
    let p = hit.point.clone(); p.y = 0;
    const off = p.clone().sub(giant.position); off.y = 0;
    if (off.length() > 30) p = giant.position.clone().add(off.setLength(30));
    moveTarget = p;
    marker.position.copy(p).setY(0.08); marker.visible = true;
  }
  renderer.domElement.addEventListener('touchend', e => { e.preventDefault(); onTap(e.changedTouches[0]); }, {passive:false});
  renderer.domElement.addEventListener('click', onTap);

  const btnL1 = document.getElementById('btnL1'), btnSlam = document.getElementById('btnSlam'),
        btnWave = document.getElementById('btnWave'), btnCharge = document.getElementById('btnCharge');
  function bind(btn, fn){
    btn.addEventListener('touchstart', e => { e.preventDefault(); fn(); }, {passive:false});
    btn.addEventListener('click', fn);
  }
  bind(btnL1, doAttack);
  bind(btnSlam, doSlam);
  bind(btnWave, doWave);
  bind(btnCharge, () => { charging = !charging; btnCharge.classList.toggle('on', charging); btnCharge.childNodes[1].textContent = charging ? 'CHARGE' : 'WALK'; });

  function killOrHit(e, fromPos, amount, isHeavy){
    if (e.type === 'ant'){
      e.dead = true;
      const push = e.obj.position.clone().sub(fromPos).setY(0).normalize();
      e.vel = push.multiplyScalar(isHeavy ? 20 : 10); e.vel.y = isHeavy ? 11 : 6 + Math.random()*4;
      e.spin = 8 + Math.random()*10;
      burst(e.obj.position, 0xff7a20, isHeavy ? 14 : 8, isHeavy ? 9 : 6);
      popup(isHeavy ? '+2' : '+1', e.obj.position, isHeavy);
      setFaith(faith + (isHeavy ? 2 : 1));
      comboKills++; totalKills++; killsEl.textContent = totalKills;
    } else {
      e.hp -= amount; e.stagger = isHeavy ? 1.6 : 1.1; e.flashT = 1;
      burst(e.obj.position, 0xd050a0, 10, 5);
      if (e.hp <= 0){
        e.dead = true;
        const push = e.obj.position.clone().sub(fromPos).setY(0).normalize();
        e.vel = push.multiplyScalar(8); e.vel.y = 5; e.spin = 4;
        popup('+5', e.obj.position, true);
        setFaith(faith + 5);
        comboKills++; totalKills++; killsEl.textContent = totalKills;
      }
    }
  }

  function doAttack(){
    if (attacking > 0.22) return;
    comboTimer = 1.2; comboIdx = (comboIdx % 3) + 1; if (comboTimer <= 0) comboIdx = 1;
    showCombo();
    const heavy = comboIdx === 3;
    attacking = heavy ? 0.7 : 0.5;
    let best = null, bestD = 11.5;
    enemies.forEach(e => { if (e.dead) return;
      const d = e.obj.position.clone().sub(giant.position).setY(0).length();
      if (d < bestD){ bestD = d; best = e; } });
    if (best){ const to = best.obj.position.clone().sub(giant.position); giant.rotation.y = Math.atan2(to.x, to.z); }
    swingT = 0.0001; swingHeavy = heavy;
    setTimeout(() => {
      let hitAny = false;
      giant.position.add(new THREE.Vector3(Math.sin(giant.rotation.y), 0, Math.cos(giant.rotation.y)).multiplyScalar(heavy ? 2.4 : 1.6));
      slashFlash = 1;
      slashArc.position.set(giant.position.x, 0.9, giant.position.z);
      slashArc.rotation.z = -giant.rotation.y + Math.PI;
      slashArc.material.color.setHex(heavy ? 0xff8a40 : 0xffd08a);
      enemies.forEach(e => {
        if (e.dead) return;
        const to = e.obj.position.clone().sub(giant.position); to.y = 0;
        if (to.length() <= 7.2){ killOrHit(e, giant.position, heavy ? 2 : 1, heavy); hitAny = true; }
      });
      trauma = Math.min(1, trauma + (heavy ? 0.42 : 0.15));
      if (hitAny){ hitstopT = heavy ? 0.09 : 0.055; if (heavy) fovKick = 5; }
    }, heavy ? 210 : 160);
  }
  let swingHeavy = false;

  function doSlam(){
    if (slamActive > 0 || faith < 15) return;
    setFaith(faith - 15);
    slamActive = 1; slamT = 0;
    trauma = 1.0; slowmoT = 0.45; fovKick = 9;
    torso.position.y = 6.1;
    slamRing.visible = true;
    slamRing.position.copy(giant.position).setY(0.1);
    burst(giant.position, 0xff8a30, 26, 10);
    setTimeout(() => {
      torso.position.y = 5.4;
      enemies.forEach(e => {
        if (e.dead) return;
        const d = e.obj.position.clone().sub(giant.position).setY(0).length();
        if (d <= 18) killOrHit(e, giant.position, 2, true);
      });
    }, 430);
  }

  function doWave(){
    if (waveFlash > 0 || faith < 20) return;
    setFaith(faith - 20);
    // face nearest cluster
    let best = null, bestD = 30;
    enemies.forEach(e => { if (e.dead) return;
      const d = e.obj.position.clone().sub(giant.position).setY(0).length();
      if (d < bestD){ bestD = d; best = e; } });
    if (best){ const to = best.obj.position.clone().sub(giant.position); giant.rotation.y = Math.atan2(to.x, to.z); }
    waveFlash = 1; waveProgress = 0;
    fovKick = 7; trauma = Math.min(1, trauma + 0.5); slowmoT = 0.3;
    swordGroup.rotation.x = -1.2; // plunged pose
    setTimeout(() => { swordGroup.rotation.x = 0; }, 500);
    enemies.forEach(e => {
      if (e.dead) return;
      const to = e.obj.position.clone().sub(giant.position); to.y = 0;
      const dist = to.length();
      if (dist > 17) return;
      const ang = to.angleTo(new THREE.Vector3(Math.sin(giant.rotation.y), 0, Math.cos(giant.rotation.y)));
      if (ang < 0.62){ killOrHit(e, giant.position, 2, true); }
    });
  }

  // ---------- CAMERA ----------
  let shakeT = 0;
  function updateCamera(dt){
    const g = giant.position;
    const behind = new THREE.Vector3(Math.sin(giant.rotation.y), 0, Math.cos(giant.rotation.y)).multiplyScalar(-40);
    const target = new THREE.Vector3(g.x, 20, g.z).add(behind); // HIGH COMMAND VIEW: 20m up, 40m back
    camera.position.lerp(target, 3.0 * dt);
    const look = new THREE.Vector3(g.x, 7, g.z);
    if (trauma > 0){
      shakeT += dt * 30;
      const amp = trauma * 0.4;
      look.x += Math.sin(shakeT*1.3) * amp; look.y += Math.cos(shakeT*1.1) * amp * 0.6;
      trauma = Math.max(0, trauma - dt * 1.8);
    }
    camera.lookAt(look);
    // FOV punch decay
    if (fovKick > 0.01){
      fovKick *= Math.pow(0.02, dt); // fast decay
      camera.fov = 73 + fovKick; camera.updateProjectionMatrix();
    }
  }

  // ---------- LOOP ----------
  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const realDt = Math.min(clock.getDelta(), 0.05);
    let dt = realDt;
    if (slowmoT > 0){ slowmoT -= realDt; dt *= 0.35; }        // slam/wave slow-motion
    if (hitstopT > 0){ hitstopT -= realDt; dt *= 0.18; }       // kill hitstop
    // combo decay
    if (comboTimer > 0){ comboTimer -= realDt; if (comboTimer <= 0){ comboIdx = 0; comboEl.style.opacity = 0; } }
    // sword swing anim
    if (swingT > 0){
      swingT += dt / (swingHeavy ? 0.7 : 0.5);
      if (swingT >= 1){ swingT = 0; swordGroup.rotation.x = 0; swordGroup.rotation.z = -0.35; }
      else {
        const s = Math.sin(swingT * Math.PI);
        if (swingHeavy){ swordGroup.rotation.x = -2.9 * s; swordGroup.rotation.z = -0.35 - 0.4 * s; }
        else { swordGroup.rotation.x = -2.4 * s; swordGroup.rotation.z = -0.35 + 0.6 * s; } // horizontal sweep feel
      }
    }
    if (slashFlash > 0){ slashFlash -= dt * 6; slashArc.material.opacity = Math.max(0, slashFlash) * 0.8; }
    if (waveFlash > 0){
      waveFlash -= dt * 1.6; waveProgress = Math.min(1, waveProgress + dt*2.2);
      waveCone.position.set(giant.position.x, 1.2, giant.position.z);
      waveCone.rotation.z = -giant.rotation.y + Math.PI;
      const s = 0.3 + waveProgress * 0.9; waveCone.scale.set(s,s,1);
      waveCone.material.opacity = Math.max(0, waveFlash) * 0.85;
    }
    // slam ring
    if (slamActive > 0){
      slamT += dt / 0.7;
      if (slamT >= 1){ slamActive = 0; slamRing.visible = false; }
      else { const s = 1 + slamT * 17; slamRing.scale.set(s, s, 1); slamRing.material.opacity = 0.95 * (1 - slamT); }
    }
    // particles
    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vel.y -= 16 * dt; p.m.position.addScaledVector(p.vel, dt);
      p.m.rotation.x += 6*dt; p.m.rotation.y += 8*dt;
      p.life -= dt;
      if (p.m.position.y < 0.05){ p.vel.y = Math.abs(p.vel.y)*0.35; p.m.position.y = 0.05; }
      p.m.material.opacity = Math.max(0, p.life);
      if (p.life <= 0){ scene.remove(p.m); particles.splice(i,1); }
    }
    // ambient embers drift
    ambient.forEach(m => {
      m.position.y -= (0.6 + m.position.x*0.001) * dt * 3;
      m.position.x += Math.sin(clock.elapsedTime + m.position.z) * dt * 0.5;
      if (m.position.y < 0) m.position.y = 35 + Math.random()*10;
    });
    // giant move — ACCELERATION/DECELERATION (weighty, no teleport-speed)
    const speed = charging ? 8 : 4;
    if (attacking > 0) attacking -= dt;
    // --- AUTO-LOCK-ON: face nearest enemy in range, always ---
    let locked = null, lockD = 13;
    enemies.forEach(e => { if (e.dead) return;
      const d = e.obj.position.clone().sub(giant.position).setY(0).length();
      if (d < lockD){ lockD = d; locked = e; } });
    if (locked){
      lockMarker.visible = true;
      lockMarker.position.copy(locked.obj.position).setY(0.06);
      lockMarker.material.opacity = 0.5 + 0.35*Math.sin(clock.elapsedTime*8);
      const s = 1 + 0.06*Math.sin(clock.elapsedTime*8); lockMarker.scale.set(s,s,1);
    } else lockMarker.visible = false;
    if (moveTarget){
      const to = moveTarget.clone().sub(giant.position); to.y = 0;
      if (to.length() < 0.6){ moveTarget = null; marker.visible = false; }
      else if (attacking <= 0){
        const targetYaw = Math.atan2(to.x, to.z);
        let d = targetYaw - giant.rotation.y;
        while (d > Math.PI) d -= Math.PI*2; while (d < -Math.PI) d += Math.PI*2;
        giant.rotation.y += d * Math.min(1, 10*dt);
        // accelerate toward move; ease to full speed (decel on arrival handled by distance clamp)
        curSpeed = Math.min(speed, curSpeed + 10*dt);
        giant.position.add(to.setLength(Math.min(curSpeed*dt, to.length())));
        stepPhase += (speed/4) * dt * 1.6;
        if (stepPhase > 1){ stepPhase = 0; trauma = Math.min(1, trauma + (charging ? 0.34 : 0.22)); }
        const bob = Math.sin(stepPhase*Math.PI)*0.35;
        legL.position.y = 1.6 + bob; legR.position.y = 1.6 - bob;
        // leg stride + arm counter-swing + charge lean
        const sw = Math.sin(stepPhase*Math.PI) * 0.55;
        legL.rotation.x = sw; legR.rotation.x = -sw;
        armL.rotation.x = -sw * 0.6; armR.rotation.x = sw * 0.6;
        torso.rotation.x = charging ? 0.14 : 0.04;
        torso.position.y = 5.4 + Math.sin(stepPhase*Math.PI*2)*0.08;
      }
    } else {
      // standing / no target: decelerate + ease, and AUTO-FACE the locked enemy
      curSpeed = Math.max(0, curSpeed - 12*dt);
      legL.rotation.x *= 0.85; legR.rotation.x *= 0.85; armL.rotation.x *= 0.85; armR.rotation.x *= 0.85;
      torso.rotation.x *= 0.9;
      if (locked && attacking <= 0){
        const to = locked.obj.position.clone().sub(giant.position);
        const ty = Math.atan2(to.x, to.z);
        let d = ty - giant.rotation.y;
        while (d > Math.PI) d -= Math.PI*2; while (d < -Math.PI) d += Math.PI*2;
        giant.rotation.y += d * Math.min(1, 3.5*dt); // gentle tracking, not snapping
      }
    }
    // worship
    inWorship = giant.position.distanceTo(new THREE.Vector3(WORSHIP.pos.x,0,WORSHIP.pos.z)) < WORSHIP.r;
    if (inWorship){ setFaith(faith + (waveActive ? 0.5 : 1.5)*dt); wz.material.opacity = 0.45; } else wz.material.opacity = 0.22;
    // enemies
    for (let i=0;i<enemies.length;i++){
      const e = enemies[i];
      if (e.dead){
        e.vel.y -= 22 * dt; e.obj.position.addScaledVector(e.vel, dt);
        e.obj.rotation.x += e.spin * dt;
        if (e.obj.position.y < -0.6){ scene.remove(e.obj); enemies.splice(i,1); i--; }
        continue;
      }
      e.walkT += dt;
      if (e.type === 'ant'){
        const toP = giant.position.clone().sub(e.obj.position); toP.y = 0;
        let dir;
        if (toP.length() < e.aggro && toP.length() > 2.6) dir = toP.clone().normalize();   // approach but stop at 2.6m — no body-jitter
        else if (toP.length() <= 2.6) dir = null;
        else {
          e.retarget -= dt;
          if (e.retarget <= 0){ e.retarget = 2+Math.random()*3; e.target = e.home.clone().add(new THREE.Vector3((Math.random()-.5)*12,0,(Math.random()-.5)*12)); }
          const t2 = e.target.clone().sub(e.obj.position); t2.y = 0;
          dir = t2.length() > 0.4 ? t2.normalize() : null;
        }
        // separation from other ants — no clumping
        const sep = new THREE.Vector3();
        for (let j=0;j<enemies.length;j++){
          if (j===i) continue; const o = enemies[j];
          if (o.type !== 'ant' || o.dead) continue;
          const d2 = e.obj.position.clone().sub(o.obj.position); d2.y=0;
          const L = d2.length(); if (L > 0.01 && L < 1.4) sep.add(d2.setLength((1.4-L)/1.4));
        }
        if (sep.lengthSq() > 0) dir = (dir || new THREE.Vector3()).add(sep.multiplyScalar(1.2));
        if (dir && dir.lengthSq() > 0.001){
          dir.normalize();
          const ty = Math.atan2(dir.x, dir.z);
          let dy = ty - e.yaw; while (dy > Math.PI) dy -= Math.PI*2; while (dy < -Math.PI) dy += Math.PI*2;
          e.yaw += dy * Math.min(1, 6*dt);                                  // smooth enemy turning
          e.obj.rotation.y = e.yaw;
          e.obj.position.add(new THREE.Vector3(Math.sin(e.yaw), 0, Math.cos(e.yaw)).multiplyScalar(3.3*(e.speedMul||1)*dt));
          e.obj.rotation.z = Math.sin(e.walkT*10) * 0.09;                   // scuttle waddle
        } else e.obj.rotation.z *= 0.9;
      } else {
        if (e.flashT > 0){ e.flashT -= dt*4; const s = 1 + 0.14*Math.max(0,e.flashT); e.obj.scale.set(s,s,s); }
        if (e.stagger > 0){ e.stagger -= dt; continue; }
        const toP = giant.position.clone().sub(e.obj.position); toP.y = 0;
        if (toP.length() < 32 && toP.length() > 3.8){
          const ty = Math.atan2(toP.x, toP.z);
          let dy = ty - e.yaw; while (dy > Math.PI) dy -= Math.PI*2; while (dy < -Math.PI) dy += Math.PI*2;
          e.yaw += dy * Math.min(1, 3*dt);
          e.obj.rotation.y = e.yaw;
          e.obj.position.add(new THREE.Vector3(Math.sin(e.yaw), 0, Math.cos(e.yaw)).multiplyScalar(1.9*dt));
          e.obj.position.y = Math.abs(Math.sin(e.walkT*4)) * 0.18;           // heavy stomp bob
        }
      }
    }
    // wave driver — objectives give the walking a purpose
    if (phase === 'waves'){
      if (waveActive){
        const alive = enemies.filter(e => !e.dead).length;
        if (alive === 0){
          waveActive = false; intermission = 9;
          setFaith(faith + 10);
          popup('WAVE CLEARED +10', giant.position, true);
          waveEl.textContent = 'WAVE ' + waveNum + ' CLEARED';
          if (waveNum >= WIN_WAVE){
            phase = 'gate';
            gateGlow.material.opacity = 0.55; gateBeacon.material.opacity = 0.3;
            objEl.textContent = 'OBJECTIVE: REACH THE CINDER GATE — GO NORTH 🔥';
            popup('THE GATE AWAKENS', giant.position, true);
          } else {
            objEl.textContent = 'NEXT WAVE INCOMING — RETURN TO THE SHRINE 🏛 BANK FAITH';
          }
        }
      } else {
        intermission -= realDt;
        if (intermission <= 0) { spawnWave(waveNum + 1); objEl.textContent = 'OBJECTIVE: SURVIVE — ' + (WIN_WAVE - waveNum) + ' WAVES TO THE GATE'; }
        else waveEl.textContent = 'WAVE ' + (waveNum+1) + ' IN ' + Math.ceil(intermission);
      }
    } else if (phase === 'gate'){
      const d = giant.position.clone().sub(GATE.pos).setY(0).length();
      if (d < 14){
        phase = 'victory';
        const stats = document.getElementById('vstats');
        stats.innerHTML = 'WAVES SURVIVED: ' + waveNum + '<br>UNMADE RELEASED: ' + totalKills + '<br>FAITH BANKED: ' + Math.floor(faith);
        document.getElementById('victory').style.display = 'block';
        window.__endless = () => { phase = 'endless'; objEl.textContent = 'ENDLESS — SURVIVE THE HOLLOW TIDE'; intermission = 6; };
      }
    } else if (phase === 'endless'){
      if (!waveActive){
        intermission -= realDt;
        if (intermission <= 0){ spawnWave(waveNum + 1); waveActive = true; }
        else waveEl.textContent = 'WAVE ' + (waveNum+1) + ' IN ' + Math.ceil(intermission);
      } else if (enemies.filter(e => !e.dead).length === 0){
        waveActive = false; intermission = 6;
        setFaith(faith + 10); popup('WAVE CLEARED +10', giant.position, true);
      }
    }
    updatePopups(realDt);
    updateCamera(dt);
    renderer.render(scene, camera);
  }
  animate();

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
