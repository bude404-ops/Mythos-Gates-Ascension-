<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MYTHOS GATES — THE CORE LOOP (Three-Tier Prototype)</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0a0a10;font-family:Georgia,serif;-webkit-user-select:none;user-select:none;touch-action:none}
  #hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#e8c47a;text-align:center;z-index:10;pointer-events:none;text-shadow:0 2px 6px #000}
  #tier{font-size:12px;letter-spacing:3px;color:#9a8b6f}
  #obj{font-size:14px;margin-top:3px;letter-spacing:1px}
  .barwrap{width:180px;height:9px;background:#1c1410;border:1px solid #4a3218;margin:5px auto 0}
  #faithfill{height:100%;width:20%;background:linear-gradient(90deg,#c07010,#ffcf6a)}
  #essfill{height:100%;width:0%;background:linear-gradient(90deg,#8a2a10,#ff5a10)}
  .blab{font-size:9px;color:#9a8b6f;letter-spacing:2px;margin-top:4px}
  .btn{position:fixed;z-index:10;padding:16px 14px;background:rgba(30,22,14,.85);border:1px solid #7a5a2a;color:#e8c47a;font-size:14px;letter-spacing:1px;border-radius:12px;text-align:center;line-height:1.1}
  .btn small{display:block;font-size:9px;color:#a8895a;letter-spacing:1px;margin-top:2px}
  .btn:active{background:#4a3214}
  #btnA{right:20px;bottom:20px}
  #btnB{right:108px;bottom:64px}
  #btnG{left:20px;bottom:20px;display:none;border-color:#ffcf6a}
  .pop{position:fixed;color:#ffcf6a;font-size:13px;letter-spacing:1px;text-shadow:0 2px 4px #000;pointer-events:none;z-index:12;white-space:nowrap;max-width:90vw}
  .pop.heavy{font-size:16px;color:#ffe8b0}
  #hurt{position:fixed;inset:0;pointer-events:none;z-index:9;box-shadow:inset 0 0 90px 30px rgba(200,20,10,.6);opacity:0;transition:opacity .13s}
  #overlay{display:none;position:fixed;inset:0;background:rgba(4,3,2,.92);z-index:20;color:#e8c47a;text-align:center}
  #overlay .big{margin-top:28vh;font-size:26px;letter-spacing:5px;text-shadow:0 4px 12px #000}
  #overlay .stats{margin-top:14px;font-size:13px;color:#9a8b6f;line-height:1.9}
  #overlay .btn{position:relative;display:inline-block;margin:26px auto 0;left:0;right:0}
</style>
</head>
<body>
<div id="hud">
  <div id="tier">TIER 0 — SPRITE</div>
  <div id="obj">OBJECTIVE: SPEAK WITH THE VILLAGE KEEPER</div>
  <div class="blab">FAITH</div>
  <div class="barwrap"><div id="faithfill"></div></div>
  <div class="blab" id="esslab" style="display:none">ESSENCE — MANIFESTATION BURNING</div>
  <div class="barwrap" id="esswrap" style="display:none"><div id="essfill"></div></div>
</div>
<div id="hurt"></div>
<div class="btn" id="btnA">SLASH<small>SPRITE</small></div>
<div class="btn" id="btnB">ROLL<small>DODGE</small></div>
<div class="btn" id="btnG">GLIMPSE<small>20 FAITH</small></div>
<div id="overlay">
  <div class="big" id="obig"></div>
  <div class="stats" id="ostats"></div>
  <div class="btn" onclick="location.reload()">RUN IT AGAIN</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x2a2028, 80, 340);
  const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 700);
  scene.add(new THREE.HemisphereLight(0x8a7a6a, 0x141018, 0.9));
  const sun = new THREE.DirectionalLight(0xd8b090, 0.8); sun.position.set(50, 90, 30); scene.add(sun);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({color:0x4a4044, roughness:1}));
  ground.rotation.x = -Math.PI/2; scene.add(ground);
  function box(w,h,d,mat,x,y,z,parent){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); (parent||scene).add(m); return m; }

  const popups = []; const v3 = new THREE.Vector3();
  function popup(text, worldPos, heavy){
    const el = document.createElement('div');
    el.className = 'pop' + (heavy ? ' heavy' : ''); el.textContent = text;
    document.body.appendChild(el);
    popups.push({el, pos:worldPos.clone(), t:0});
  }
  function updatePopups(dt){
    for (let i=popups.length-1;i>=0;i--){
      const p = popups[i]; p.t += dt;
      if (p.t > 1.4){ p.el.remove(); popups.splice(i,1); continue; }
      v3.copy(p.pos); v3.y += 2 + p.t*2.5; v3.project(camera);
      if (v3.z > 1){ p.el.style.display='none'; continue; }
      p.el.style.display='block';
      p.el.style.left = Math.min(innerWidth-100, (v3.x*0.5+0.5)*innerWidth) + 'px';
      p.el.style.top = ((-v3.y*0.5+0.5)*innerHeight) + 'px';
      p.el.style.opacity = Math.max(0, 1 - p.t/1.4);
    }
  }
  const particles = []; const partGeo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
  function burst(pos, color, n, power, size){
    if (particles.length > 170) return;
    for (let i=0;i<n;i++){
      const m = new THREE.Mesh(size ? new THREE.BoxGeometry(size,size,size) : partGeo, new THREE.MeshBasicMaterial({color, transparent:true, opacity:1}));
      m.position.copy(pos);
      particles.push({m, vel:new THREE.Vector3((Math.random()-.5)*power, Math.random()*power*0.8, (Math.random()-.5)*power), life:0.9+Math.random()*0.5});
      scene.add(m);
    }
  }

  // ============ WORLD ============
  const woodMat = new THREE.MeshStandardMaterial({color:0x3a2a1a, roughness:1});
  const stoneMat = new THREE.MeshStandardMaterial({color:0x4a4440, roughness:1});
  // village
  [[-8,44],[8,44],[-12,38]].forEach(p => {
    const g = new THREE.Group();
    box(4, 2.6, 3.4, woodMat, 0, 1.3, 0, g);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(3, 1.6, 4), new THREE.MeshStandardMaterial({color:0x6a2a14, roughness:1}));
    roof.position.y = 3.4; g.add(roof);
    g.position.set(p[0], 0, p[1]); scene.add(g);
  });
  const keeper = new THREE.Group();
  box(0.5, 0.8, 0.35, new THREE.MeshStandardMaterial({color:0x2a4a3a, roughness:1}), 0, 1.1, 0, keeper);
  box(0.3, 0.3, 0.3, new THREE.MeshStandardMaterial({color:0xc0a080, roughness:1}), 0, 1.65, 0, keeper);
  keeper.position.set(0, 0, 40); scene.add(keeper);
  // stream + bridge + THE CRUSHING BOULDER (glimpse target)
  const stream = new THREE.Mesh(new THREE.PlaneGeometry(400, 9), new THREE.MeshBasicMaterial({color:0x1a3a5a, transparent:true, opacity:0.7}));
  stream.rotation.x = -Math.PI/2; stream.position.set(0, 0.05, 25); scene.add(stream);
  box(2.4, 0.5, 10, woodMat, 0, 0.5, 25);
  const boulder = new THREE.Mesh(new THREE.DodecahedronGeometry(4), stoneMat);
  boulder.position.set(0, 2.5, 25); scene.add(boulder);
  const boulderGlow = new THREE.Mesh(new THREE.RingGeometry(4.5, 5.4, 24), new THREE.MeshBasicMaterial({color:0xffcf6a, transparent:true, opacity:0.5, side:THREE.DoubleSide}));
  boulderGlow.rotation.x = -Math.PI/2; boulderGlow.position.set(0, 0.1, 25); scene.add(boulderGlow);
  // corrupted ridge + HOLLOW NEST (manifestation target) + elite
  const nest = new THREE.Group();
  const nestMat = new THREE.MeshStandardMaterial({color:0x1c1226, roughness:1, emissive:0x5a1a8a, emissiveIntensity:0.7});
  box(5, 6, 5, nestMat, 0, 3, 0, nest);
  box(3.4, 4.4, 3.4, nestMat, 1.6, 6.4, 1.2, nest);
  box(2.6, 3.4, 2.6, nestMat, -1.8, 7, -1, nest);
  nest.position.set(0, 0, 2); scene.add(nest);
  let nestHp = 3;
  const corruptGround = new THREE.Mesh(new THREE.CircleGeometry(14, 24), new THREE.MeshBasicMaterial({color:0x30104a, transparent:true, opacity:0.45}));
  corruptGround.rotation.x = -Math.PI/2; corruptGround.position.set(0, 0.06, 2); scene.add(corruptGround);
  // lore stone hidden in the nest (revealed after destruction — the RETURN beat)
  const loreStone = new THREE.Mesh(new THREE.OctahedronGeometry(0.5), new THREE.MeshBasicMaterial({color:0xffcf6a, transparent:true, opacity:0}));
  loreStone.position.set(0, 0.6, 2); scene.add(loreStone);
  let loreFound = false;
  // rite stone (manifestation conduit)
  const riteStone = new THREE.Group();
  box(1.2, 2.4, 1.2, stoneMat, 0, 1.2, 0, riteStone);
  const riteGlow = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), new THREE.MeshBasicMaterial({color:0xff8a30}));
  riteGlow.position.y = 2.9; riteStone.add(riteGlow);
  riteStone.position.set(9, 0, 7); scene.add(riteStone);
  // THE GATE
  const gateGrp = new THREE.Group();
  box(5, 34, 5, stoneMat, -9, 17, 0, gateGrp);
  box(5, 34, 5, stoneMat, 9, 17, 0, gateGrp);
  box(23, 5, 6, stoneMat, 0, 36, 0, gateGrp);
  const gateGlow = new THREE.Mesh(new THREE.PlaneGeometry(12, 30), new THREE.MeshBasicMaterial({color:0xff5a10, transparent:true, opacity:0.12, side:THREE.DoubleSide}));
  gateGlow.position.set(0, 16, 0); gateGrp.add(gateGlow);
  gateGrp.position.set(0, 0, -50); scene.add(gateGrp);
  const ascendRing = new THREE.Mesh(new THREE.RingGeometry(2.2, 2.8, 32), new THREE.MeshBasicMaterial({color:0xff8a30, transparent:true, opacity:0.5, side:THREE.DoubleSide}));
  ascendRing.rotation.x = -Math.PI/2; ascendRing.position.set(0, 0.08, -42); scene.add(ascendRing);

  // ============ SPRITE ============
  const sprite = new THREE.Group();
  const clothMat = new THREE.MeshStandardMaterial({color:0x241c2a, roughness:1});
  box(0.55, 0.7, 0.32, clothMat, 0, 1.05, 0, sprite);
  box(0.34, 0.38, 0.36, clothMat, 0, 1.62, 0, sprite);
  box(0.1, 0.06, 0.04, new THREE.MeshBasicMaterial({color:0xffcf6a}), 0, 1.66, 0.19, sprite);
  const sLegL = box(0.2, 0.7, 0.22, clothMat, -0.14, 0.35, 0, sprite);
  const sLegR = box(0.2, 0.7, 0.22, clothMat, 0.14, 0.35, 0, sprite);
  sprite.position.set(0, 0, 43); scene.add(sprite);

  // ============ THE GLIMPSE HAND (colossal, hidden above) ============
  const hand = new THREE.Group();
  const hMat = new THREE.MeshStandardMaterial({color:0xc0a890, roughness:0.85, emissive:0xff5a10, emissiveIntensity:0.9});
  box(6, 2, 6, hMat, 0, 0, 0, hand);                    // palm
  for (let i=0;i<4;i++) box(1.2, 3.4, 1.2, hMat, -2.1 + i*1.4, -2.5, 2.2, hand);  // fingers
  box(1.6, 2.4, 1.4, hMat, 3.2, -1.2, 0, hand);          // thumb
  box(5, 14, 5, hMat, 0, 8, 0, hand);                    // forearm
  hand.visible = false; scene.add(hand);

  // ============ THE GOD (manifestation + ascension body) ============
  const god = new THREE.Group();
  const magmaMat = new THREE.MeshStandardMaterial({color:0xc0a890, roughness:0.85, emissive:0xff5a10, emissiveIntensity:0.8, transparent:true});
  box(3.4, 4.2, 2.2, magmaMat, 0, 6.4, 0, god);
  box(1.7, 1.6, 1.7, magmaMat, 0, 9.6, 0, god);
  box(0.45, 0.2, 0.3, new THREE.MeshBasicMaterial({color:0xffb84a}), -0.4, 9.9, 0.9, god);
  box(0.45, 0.2, 0.3, new THREE.MeshBasicMaterial({color:0xffb84a}), 0.4, 9.9, 0.9, god);
  box(1.5, 3.6, 1.5, magmaMat, -0.95, 1.8, 0, god);
  box(1.5, 3.6, 1.5, magmaMat, 0.95, 1.8, 0, god);
  const swordG = new THREE.Group();
  box(0.5, 4.2, 0.18, new THREE.MeshStandardMaterial({color:0x4a1c08, roughness:0.5, emissive:0xff5a10, emissiveIntensity:1.2}), 0, 2.6, 0, swordG);
  swordG.position.set(3.1, 4.5, 0); god.add(swordG);
  god.visible = false; scene.add(god);

  // ============ MINI-COLOSSUS (ascension boss) ============
  const colo = new THREE.Group();
  const coloMat = new THREE.MeshStandardMaterial({color:0x1c1420, roughness:1, emissive:0x5a1a8a, emissiveIntensity:0.5});
  box(4.4, 6, 3.4, coloMat, 0, 9, 0, colo);
  box(2.4, 2.4, 2.4, coloMat, 0, 14, 0, colo);
  box(0.8, 0.4, 0.4, new THREE.MeshBasicMaterial({color:0xb040ff}), -0.6, 14.4, 1.3, colo);
  box(0.8, 0.4, 0.4, new THREE.MeshBasicMaterial({color:0xb040ff}), 0.6, 14.4, 1.3, colo);
  box(2.2, 6.4, 2.2, coloMat, -3.4, 9.5, 0, colo);
  box(2.2, 6.4, 2.2, coloMat, 3.4, 9.5, 0, colo);
  box(2.4, 6, 2.4, coloMat, -1.4, 3, 0, colo);
  box(2.4, 6, 2.4, coloMat, 1.4, 3, 0, colo);
  colo.visible = false; scene.add(colo);
  let coloHp = 10, coloActive = false, coloCd = 3;

  // ============ ENEMIES ============
  const enemies = [];
  const skitMat = new THREE.MeshStandardMaterial({color:0x14121a, roughness:1, emissive:0x30104a, emissiveIntensity:0.6});
  function makeHollow(pos, elite){
    const g = new THREE.Group();
    const s = elite ? 2.2 : 1;
    box(0.6*s, 0.4*s, 0.9*s, skitMat, 0, 0.3*s, 0, g);
    box(0.3*s, 0.3*s, 0.4*s, skitMat, 0, 0.55*s, 0.35*s, g);
    box(0.1*s, 0.06*s, 0.03*s, new THREE.MeshBasicMaterial({color: elite ? 0xff40ff : 0xb040ff}), 0, 0.57*s, 0.56*s, g);
    g.position.copy(pos); scene.add(g);
    enemies.push({obj:g, yaw:0, hp: elite ? 6 : 2, dead:false, elite:!!elite, walkT:Math.random()*6, atkCd:0, flashT:0});
    return enemies[enemies.length-1];
  }
  // bridge-side wisps (faith fuel)
  makeHollow(new THREE.Vector3(6, 0, 30));
  makeHollow(new THREE.Vector3(-5, 0, 18));
  makeHollow(new THREE.Vector3(3, 0, 12));
  // THE ELITE — beyond sprite scale
  makeHollow(new THREE.Vector3(0, 0, 7), true);

  // ============ STATE ============
  let phase = 'sprite';   // sprite | glimpse | manifest | ascendGiant | end
  let faith = 20, essence = 0, hp = 100, iframes = 0, rollT = 0, rollCd = 0, rollDir = new THREE.Vector3(0,0,-1);
  let moveTarget = null, attacking = 0, gAttacking = 0, slashHeld = false, gSmashHeld = false;
  let trauma = 0, shakeT = 0, growT = 0, talked = false, boulderCleared = false, nestDestroyed = false;
  let wave = 0, kills = 0, gateActive = false;
  const tierEl = document.getElementById('tier'), objEl = document.getElementById('obj'),
        faithFill = document.getElementById('faithfill'), essFill = document.getElementById('essfill'),
        essWrap = document.getElementById('esswrap'), essLab = document.getElementById('esslab'),
        hurtEl = document.getElementById('hurt'), btnA = document.getElementById('btnA'),
        btnB = document.getElementById('btnB'), btnG = document.getElementById('btnG');
  function setFaith(){ faithFill.style.width = Math.min(100, faith) + '%'; }
  function setEss(){ essFill.style.width = Math.max(0, essence/60*100) + '%'; }
  function setHP(){ }
  let hpT = 100;
  function hurt(n, pos){
    if (iframes > 0) return;
    hpT = Math.max(0, hpT - n);
    faithFill.style.background = 'linear-gradient(90deg,#c02020,#ffcf6a)';
    hurtEl.style.opacity = 0.85; setTimeout(()=>{ hurtEl.style.opacity = 0; }, 140);
    trauma = Math.min(1, trauma + 0.35);
    if (hpT <= 0) fail();
  }
  function fail(){
    phase = 'end';
    document.getElementById('obig').textContent = 'THE LANTERN FALLS';
    document.getElementById('ostats').innerHTML = 'The loop breaks here — but the Gate remembers. Run it again.';
    document.getElementById('overlay').style.display = 'block';
  }
  function setObj(tier, obj){ tierEl.textContent = tier; objEl.textContent = 'OBJECTIVE: ' + obj; }
  setFaith();

  // ============ INPUT ============
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let tapTime = 0;
  function onTap(ev){
    const t = ev.touches ? ev.touches[0] : ev;
    if (Date.now() - tapTime < 120) return; tapTime = Date.now();
    ndc.x = (t.clientX/innerWidth)*2-1; ndc.y = -(t.clientY/innerHeight)*2+1;
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObject(ground)[0];
    if (!hit) return;
    const p = hit.point.clone(); p.y = 0;
    const anchor = (phase === 'manifest' || phase === 'ascendGiant') ? god : sprite;
    if (p.distanceTo(anchor.position) > (phase === 'sprite' ? 40 : 80)) p.copy(anchor.position).add(p.sub(anchor.position).setLength(40));
    moveTarget = p;
  }
  renderer.domElement.addEventListener('touchend', e => { e.preventDefault(); onTap(e.changedTouches[0]); }, {passive:false});
  renderer.domElement.addEventListener('click', onTap);
  function bind(btn, fn){ btn.addEventListener('touchstart', e => { e.preventDefault(); fn(); }, {passive:false}); btn.addEventListener('click', fn); }
  btnA.addEventListener('touchstart', e => {
    e.preventDefault();
    if (phase === 'manifest' || phase === 'ascendGiant'){ gSmashHeld = true; doSmash(); }
    else { slashHeld = true; doSlash(); }
  }, {passive:false});
  btnA.addEventListener('touchend', () => { slashHeld = false; gSmashHeld = false; });
  btnA.addEventListener('touchcancel', () => { slashHeld = false; gSmashHeld = false; });
  btnA.addEventListener('click', () => { if (phase === 'manifest' || phase === 'ascendGiant') doSmash(); else doSlash(); });
  bind(btnB, () => { if (phase === 'sprite') doRoll(); });
  bind(btnG, () => {
    if (btnG.dataset.manifest === '1') doManifest();
    else if (btnG.dataset.manifest === 'ascend') doAscend();
    else doGlimpse();
  });

  function doSlash(){
    if (attacking > 0 || rollT > 0) return;
    attacking = 0.32;
    setTimeout(() => {
      enemies.forEach(e => {
        if (e.dead) return;
        const to = e.obj.position.clone().sub(sprite.position); to.y = 0;
        if (to.length() > 2.8) return;
        const ang = to.angleTo(new THREE.Vector3(Math.sin(sprite.rotation.y), 0, Math.cos(sprite.rotation.y)));
        if (ang > 1.6) return;
        if (e.elite){
          popup('YOUR BLADE GLANCES OFF — THIS IS BEYOND YOUR SCALE', e.obj.position, true);
          burst(e.obj.position, 0x6a6a7a, 3, 3);
          return;
        }
        e.hp--; e.flashT = 1;
        burst(e.obj.position, 0x8a2ab0, 5, 4);
        if (e.hp <= 0){
          e.dead = true; kills++;
          burst(e.obj.position, 0xb040ff, 10, 6);
          faith = Math.min(200, faith + 10); setFaith();
          popup('+10 FAITH', e.obj.position, false);
        }
      });
    }, 100);
  }
  function doRoll(){
    if (rollCd > 0) return;
    rollCd = 0.9; rollT = 0.24; iframes = 0.45;
    rollDir.copy(moveTarget ? moveTarget.clone().sub(sprite.position).setY(0).normalize() : new THREE.Vector3(Math.sin(sprite.rotation.y), 0, Math.cos(sprite.rotation.y)));
  }
  // ---- TIER 1: GLIMPSE ----
  let handT = -1;
  function doGlimpse(){
    if (handT >= 0 || faith < 20 || boulderCleared) return;
    if (sprite.position.distanceTo(boulder.position) > 10) return;
    faith -= 20; setFaith();
    handT = 0;
    btnG.style.display = 'none';
    hand.visible = true;
    hand.position.set(boulder.position.x, 60, boulder.position.z);
    hand.rotation.y = Math.random()*Math.PI*2;
    phase = 'glimpse';
    tierEl.textContent = 'TIER 1 — GLIMPSE';
    popup('THE GATE CRACKS OPEN — A HAND OF THE GOD', boulder.position, true);
    trauma = 0.6;
  }
  // ---- TIER 2: MANIFESTATION ----
  let manifesting = false;
  function doManifest(){
    if (manifesting || nestDestroyed || faith < 40) return;
    if (sprite.position.distanceTo(riteStone.position) > 4) return;
    faith -= 40; setFaith();
    manifesting = true;
    btnG.style.display = 'none';
    phase = 'manifest';
    growT = 0;
    sprite.visible = false;
    god.visible = true; god.position.copy(sprite.position); god.rotation.y = Math.PI;
    god.scale.setScalar(0.05);
    essence = 60; setEss(); essWrap.style.display = 'block'; essLab.style.display = 'block';
    tierEl.textContent = 'TIER 2 — MANIFESTATION';
    setObj('TIER 2 — MANIFESTATION', 'DESTROY THE HOLLOW NEST — 60 SECONDS OF DIVINITY');
    btnA.childNodes[0].textContent = 'SMASH'; btnA.childNodes[1].textContent = 'HOLD TO CHAIN';
    btnB.style.display = 'none';
    popup('THE RITE STONE OPENS THE GATE A CRACK — THE GOD STEPS THROUGH, THINLY', riteStone.position, true);
    trauma = 1;
  }
  // ---- TIER 3: ASCENSION ----
  function doAscend(){
    if (gateActive || faith < 100) return;
    if (sprite.position.distanceTo(ascendRing.position) > 3.5) return;
    gateActive = true;
    btnG.style.display = 'none';
    faith -= 100; setFaith();
    phase = 'ascendGiant';
    growT = 0;
    sprite.visible = false;
    god.visible = true; god.position.copy(ascendRing.position); god.rotation.y = 0;
    god.scale.setScalar(0.05);
    tierEl.textContent = 'TIER 3 — ASCENSION';
    setObj('TIER 3 — ASCENSION', 'THE GATE IS OPEN — HOLD THE FIELD, FELL THE COLOSSUS');
    btnA.childNodes[0].textContent = 'SMASH'; btnA.childNodes[1].textContent = 'HOLD TO CHAIN';
    btnB.style.display = 'none'; btnG.style.display = 'none';
    gateGlow.material.opacity = 0.5;
    scene.fog.color.setHex(0x4a2a14);
    popup('FULL ASCENSION — THE TRUE FORM, BATTLEFIELD-STRENGTH', god.position, true);
    trauma = 1;
  }
  function doSmash(){
    if (gAttacking > 0.26) return;
    gAttacking = 0.5;
    swordG.rotation.x = -2.4;
    setTimeout(() => {
      swordG.rotation.x = 0;
      const fwd = new THREE.Vector3(Math.sin(god.rotation.y), 0, Math.cos(god.rotation.y));
      burst(god.position.clone().add(fwd.multiplyScalar(7)).setY(1), 0xff8a30, 6, 7);
      enemies.forEach(e => {
        if (e.dead) return;
        const to = e.obj.position.clone().sub(god.position); to.y = 0;
        if (to.length() <= 15){ e.dead = true; kills++; burst(e.obj.position, 0xff7a20, 10, 8); }
      });
      // nest damage (manifestation)
      if (phase === 'manifest' && !nestDestroyed){
        const d = nest.position.clone().sub(god.position).setY(0).length();
        if (d <= 16){
          nestHp--;
          burst(nest.position.clone().setY(4), 0x8a2ab0, 20, 10, 0.5);
          trauma = 1;
          popup('THE NEST CRACKS (' + nestHp + ')', nest.position, true);
          const s = 0.75 + nestHp*0.08;
          nest.scale.set(s, s, s);
          if (nestHp <= 0) destroyNest();
        }
      }
      // colossus damage (ascension)
      if (coloActive){
        const d = colo.position.clone().sub(god.position).setY(0).length();
        if (d <= 17){
          coloHp--;
          burst(colo.position.clone().setY(12), 0xb040ff, 14, 8);
          trauma = Math.min(1, trauma + 0.4);
          popup('THE COLOSSUS STAGGERS (' + coloHp + ')', colo.position, false);
          if (coloHp <= 0){
            coloActive = false; colo.visible = false; kills++;
            burst(colo.position.clone().setY(8), 0xb040ff, 40, 14, 0.5);
            document.getElementById('obig').textContent = 'THE LOOP IS COMPLETE';
            document.getElementById('ostats').innerHTML = 'EXPLORE → GLIMPSE → MANIFEST → RETURN → DISCOVER → ASCEND<br>HOLLOW FELLED: ' + kills +
              '<br>FAITH REMAINING: ' + Math.floor(faith) + '<br><br>Both forms. One loop. Recurring pillar, spectacular climax.';
            document.getElementById('overlay').style.display = 'block';
            phase = 'end';
          }
        }
      }
    }, 180);
  }
  function destroyNest(){
    nestDestroyed = true;
    nest.visible = false;
    corruptGround.material.opacity = 0.08;
    scene.fog.color.setHex(0x3a2a20);
    loreStone.material.opacity = 0.95;
    popup('THE NEST IS BROKEN — THE RIDGE BREATHES', nest.position, true);
    // elite dies with the nest
    enemies.forEach(e => { if (e.elite && !e.dead){ e.dead = true; burst(e.obj.position, 0xb040ff, 16, 8); } });
    // EARLY-COMPLETION REFUND — speed is economy
    const refund = Math.floor(essence);
    faith = Math.min(200, faith + refund); setFaith();
    popup('UNSPENT ESSENCE RETURNS: +' + refund + ' FAITH', god.position, true);
    setTimeout(returnToSprite, 1400);
  }
  function returnToSprite(){
    manifesting = false;
    god.visible = false;
    sprite.visible = true;
    sprite.position.copy(god.position).setY(0);
    sprite.position.z -= 3;
    phase = 'sprite';
    essWrap.style.display = 'none'; essLab.style.display = 'none';
    tierEl.textContent = 'RETURN — SPRITE';
    setObj('RETURN — SPRITE', 'EXPLORE THE WRECKAGE — THEN REACH THE CINDER GATE');
    btnA.childNodes[0].textContent = 'SLASH'; btnA.childNodes[1].textContent = 'SPRITE';
    btnB.style.display = 'block';
    moveTarget = null;
    // THE CONSEQUENCE BEAT: the wreckage is now a discovery site
    popup('THE WRECKAGE SMOKES — SOMETHING IS REVEALED IN THE RUBBLE', sprite.position, true);
  }

  // ============ CAMERA ============
  let camMode = 'sprite';
  function updateCamera(dt){
    let target, look;
    if (phase === 'glimpse'){
      target = boulder.position.clone().add(new THREE.Vector3(18, 14, 18));
      look = boulder.position.clone().setY(8);
    } else if (phase === 'manifest' || phase === 'ascendGiant'){
      const k = Math.min(1, growT/2);
      const dist = 30 + (1-k)*10;
      target = god.position.clone().add(new THREE.Vector3(Math.sin(god.rotation.y), 0, Math.cos(god.rotation.y)).multiplyScalar(-dist));
      target.y = 16;
      look = god.position.clone().setY(7);
    } else {
      target = sprite.position.clone().add(new THREE.Vector3(6.5, 8.5, 6.5));
      look = sprite.position.clone().setY(1);
    }
    camera.position.lerp(target, 1 - Math.exp(-4.5*dt));
    if (trauma > 0){
      shakeT += dt*30;
      const amp = trauma*0.4;
      look.x += Math.sin(shakeT*1.4)*amp; look.y += Math.cos(shakeT*1.2)*amp*0.6;
      trauma = Math.max(0, trauma - dt*1.9);
    }
    camera.lookAt(look);
  }

  // ============ LOOP ============
  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const et = clock.elapsedTime;
    if (attacking > 0) attacking -= dt;
    if (gAttacking > 0) gAttacking -= dt;
    if (rollCd > 0){ rollCd -= dt; btnB.childNodes[1].textContent = rollCd > 0 ? rollCd.toFixed(1) + 's' : 'DODGE'; }
    if (iframes > 0) iframes -= dt;
    if (phase === 'end'){ updateCamera(dt); renderer.render(scene, camera); updatePopups(dt); return; }

    // ---- GLIMPSE HAND ANIM ----
    if (handT >= 0){
      handT += dt;
      if (handT < 1.1){
        hand.position.y = 60 - (handT/1.1)*52;   // descends onto the boulder
      } else if (handT < 1.5){
        hand.position.y = 8;
        if (!boulderCleared && handT - dt < 1.1){
          boulderCleared = true;
          burst(boulder.position, 0x6a6a5a, 40, 14, 0.8);
          boulder.visible = false; boulderGlow.visible = false;
          trauma = 1;
          popup('THE HAND OF THE GOD CLEARS THE WAY', boulder.position, true);
        }
      } else if (handT < 2.6){
        hand.position.y = 8 + (handT-1.5)/1.1*52;
      } else {
        hand.visible = false; handT = -1;
        phase = 'sprite';
        tierEl.textContent = 'TIER 0 — SPRITE';
        setObj('TIER 0 — SPRITE', 'CROSS — THE PATH IS CLEARED. INVESTIGATE THE RIDGE');
      }
    }

    // ---- GROWTH (manifest/ascend) ----
    if (phase === 'manifest' || phase === 'ascendGiant'){
      if (god.scale.x < 1){
        growT += dt;
        const s = 0.05 + Math.min(1, growT/2)*0.95;
        god.scale.setScalar(s);
      }
    }
    // ---- MANIFESTATION TIMER ----
    if (phase === 'manifest'){
      essence -= dt; setEss();
      magmaMat.opacity = 0.45 + (essence/60)*0.55;   // form thins
      if (essence <= 0){
        popup('THE FORM SPENDS ITSELF — THE GATE CLOSES TO A CRACK', god.position, true);
        returnToSprite();
        essence = 0; setEss();
      }
      if (gSmashHeld && gAttacking <= 0.26) doSmash();
    }
    if (phase === 'ascendGiant'){
      if (gSmashHeld && gAttacking <= 0.26) doSmash();
      magmaMat.opacity = 1;
      // battlefield driver
      if (!coloActive){
        const alive = enemies.filter(e => !e.dead).length;
        if (alive < 6 && Math.random() < dt*1.2){
          const a = Math.random()*Math.PI*2;
          makeHollow(new THREE.Vector3(god.position.x + Math.cos(a)*40, 0, god.position.z - 10 + Math.abs(Math.sin(a))*40), false);
        }
        kills = kills;  // waves flow continuously; colossus rises after 12 kills
        if (kills >= 12 && !coloActive){
          coloActive = true; colo.visible = true;
          colo.position.set(0, 0, -70);
          popup('THE HOLLOW RAISES ITS OWN GIANT — THE MINI-COLOSSUS', colo.position, true);
        }
      } else {
        // colossus walks at the god, heavy telegraph slam
        coloCd -= dt;
        const to = god.position.clone().sub(colo.position).setY(0);
        if (to.length() > 14){
          colo.position.add(to.normalize().multiplyScalar(3.2*dt));
          colo.rotation.y = Math.atan2(to.x, to.z);
        } else if (coloCd <= 0){
          coloCd = 4;
          trauma = 1;
          burst(colo.position, 0xc040ff, 18, 9, 0.3);
          const d = god.position.clone().sub(colo.position).setY(0).length();
          if (d < 16){ hurt(25, god.position); popup('THE COLOSSUS SLAMS YOU', god.position, true); }
        }
      }
    }

    // ---- MOVEMENT ----
    if (phase === 'sprite'){
      if (rollT > 0){
        rollT -= dt;
        sprite.position.add(rollDir.clone().multiplyScalar(16*dt));
        sprite.rotation.y = Math.atan2(rollDir.x, rollDir.z);
      } else if (moveTarget){
        const to = moveTarget.clone().sub(sprite.position); to.y = 0;
        if (to.length() < 0.4) moveTarget = null;
        else {
          const dir = to.normalize();
          sprite.rotation.y = Math.atan2(dir.x, dir.z);
          sprite.position.add(dir.multiplyScalar(5.6*dt));
          const sw = Math.sin(et*12)*0.5;
          sLegL.rotation.x = sw; sLegR.rotation.x = -sw;
        }
      }
      if (slashHeld && attacking <= 0 && rollT <= 0) doSlash();
      // triggers
      if (!talked && sprite.position.distanceTo(keeper.position) < 2.6){
        talked = true;
        faith = Math.min(200, faith + 30); setFaith();
        popup('KEEPER: "The north bridge is crushed. Even the wind asks the Gate for help. Go — be its Warden."', keeper.position, true);
        setObj('TIER 0 — SPRITE', 'INVESTIGATE THE CRUSHED BRIDGE (NORTH)');
      }
      if (!boulderCleared){
        const d = sprite.position.distanceTo(boulder.position);
        btnG.style.display = (d < 10 && faith >= 20) ? 'block' : 'none';
      } else btnG.style.display = 'none';
      if (!nestDestroyed && talked && boulderCleared){
        if (faith >= 40 && sprite.position.distanceTo(riteStone.position) < 4){
          if (!btnG.dataset.manifest){
            btnG.dataset.manifest = '1';
            btnG.childNodes[0].textContent = 'MANIFEST';
            btnG.childNodes[1].textContent = '40 FAITH · 60s';
          }
          btnG.style.display = 'block';
        }
      }
      if (nestDestroyed && !loreFound && sprite.position.distanceTo(loreStone.position) < 2.2){
        loreFound = true;
        faith = Math.min(200, faith + 30); setFaith();
        popup('LORE, FROM THE RUBBLE: "The Hollow hums a dirge for a name no one remembers. The nest was built over a grave."', loreStone.position, true);
        popup('+30 FAITH — SOMETHING DEEPER', loreStone.position, false);
        setObj('TIER 0 — SPRITE', 'REACH THE CINDER GATE — PREPARE 100 FAITH FOR ASCENSION');
      }
      if (loreFound && !gateActive && faith >= 100 && sprite.position.distanceTo(ascendRing.position) < 3.5){
        if (btnG.dataset.manifest !== 'ascend'){
          btnG.dataset.manifest = 'ascend';
          btnG.childNodes[0].textContent = 'ASCEND';
          btnG.childNodes[1].textContent = '100 FAITH · FULL RITE';
        }
        btnG.style.display = 'block';
      } else if (btnG.dataset.manifest === 'ascend' && !gateActive){
        btnG.style.display = 'none';
        btnG.dataset.manifest = '0';
      }
    } else if (phase === 'manifest' || phase === 'ascendGiant'){
      if (moveTarget && god.scale.x >= 1){
        const to = moveTarget.clone().sub(god.position); to.y = 0;
        if (to.length() < 4) moveTarget = null;
        else {
          const dir = to.normalize();
          const ty = Math.atan2(dir.x, dir.z);
          let dy = ty - god.rotation.y;
          while (dy > Math.PI) dy -= Math.PI*2; while (dy < -Math.PI) dy += Math.PI*2;
          god.rotation.y += dy * Math.min(1, 7*dt);
          god.position.add(dir.multiplyScalar(Math.min(11*dt, to.length())));
        }
      }
    }

    // The MANIFEST/ASCEND button routing (btnG is shared)
    if (btnG.dataset.manifest === '1' && phase === 'sprite' && sprite.position.distanceTo(riteStone.position) > 4){ btnG.dataset.manifest = '0'; btnG.style.display = 'none'; }

    // ---- ENEMY AI ----
    enemies.forEach((e, idx) => {
      if (e.dead){
        e.obj.position.y -= dt*2; e.obj.rotation.x += dt*3;
        if (e.obj.position.y < -1.5){ scene.remove(e.obj); enemies.splice(idx,1); }
        return;
      }
      if (e.flashT > 0){ e.flashT -= dt*4; const s = 1 + 0.2*Math.max(0,e.flashT); e.obj.scale.setScalar(s); } else e.obj.scale.setScalar(1);
      e.walkT += dt;
      const anchor = (phase === 'manifest' || phase === 'ascendGiant') ? god : sprite;
      const d = e.obj.position.distanceTo(anchor.position);
      const aggro = (phase === 'sprite') ? 16 : 50;
      if (d < aggro && d > (e.elite ? 3 : 1.6)){
        const to = anchor.position.clone().sub(e.obj.position).setY(0).normalize();
        const ty = Math.atan2(to.x, to.z);
        let dy = ty - e.yaw; while (dy > Math.PI) dy -= Math.PI*2; while (dy < -Math.PI) dy += Math.PI*2;
        e.yaw += dy * Math.min(1, 6*dt); e.obj.rotation.y = e.yaw;
        e.obj.position.add(to.multiplyScalar((e.elite ? 2.2 : 3.6)*dt));
        e.obj.position.y = Math.abs(Math.sin(e.walkT*6))*0.25;
      } else if (d <= (e.elite ? 3 : 1.6)){
        if (e.atkCd <= 0){
          e.atkCd = e.elite ? 2.2 : 1.7;
          if (phase === 'sprite') hurt(e.elite ? 25 : 10, anchor.position);
          else if (phase === 'manifest') { essence = Math.max(0, essence - 5); setEss(); popup('THE HOLLOW GNAWS AT YOUR ESSENCE', e.obj.position, false); }
        }
      }
      e.atkCd -= dt;
    });

    // ---- FX ----
    riteGlow.position.y = 2.9 + Math.sin(et*4)*0.15;
    gateGlow.material.opacity = gateActive ? 0.5 + Math.sin(et*2)*0.1 : 0.12 + Math.sin(et*1.5)*0.05;
    if (loreStone.material.opacity > 0) loreStone.rotation.y += dt*2;
    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vel.y -= 12*dt; p.m.position.addScaledVector(p.vel, dt);
      p.m.rotation.x += 6*dt; p.life -= dt;
      p.m.material.opacity = Math.max(0, p.life);
      if (p.life <= 0){ scene.remove(p.m); particles.splice(i,1); }
    }
    updatePopups(dt);
    updateCamera(dt);
    renderer.render(scene, camera);
  }
  animate();

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
