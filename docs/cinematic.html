  @media (max-width:700px){ .bar{height:8vh;} #narr span{letter-spacing:.3em; text-indent:.3em;} }

<script>
// ═══════════════════════════════════════════════════════════════
//  2.5D PROJECTION CINEMATIC ENGINE v2 ("The Astartes Method")
//  Flat canon art projected onto procedural depth planes, filmed by
//  a real virtual camera: dolly / crane / orbit / crash-zoom / dutch
//  tilt / shake / speed-ramps, volumetric god rays, drifting fog
//  bands, heat shimmer and animated light — one fragment shader.
// ═══════════════════════════════════════════════════════════════

// ---------- SHOT GRAMMAR (director's shot list) ----------
// cam: x pan, y crane, z dolly zoom, r dutch roll (deg)
// ease: 0 smooth | 1 speed-ramp | 2 crash
const SEQ = [
  { img:'cinematic/SHOT-01-LONG-ROAD.jpg',   dur:8.0, ease:0,
    from:{x:0.00,y:-0.03,z:1.02,r:-0.5}, to:{x:0.00,y:0.05,z:1.16,r:0.6},
    narr:'The roads remember.', light:[.5,.18,.10], fog:.55, heat:.0 },
  { img:'cinematic/SHOT-02-PILGRIM-WALK.jpg', dur:7.5, ease:0,
    from:{x:-0.07,y:0.0,z:1.10,r:0.8}, to:{x:0.07,y:-0.01,z:1.04,r:-0.4},
    light:[.62,.30,.12], fog:.35, heat:.0 },
  { img:'cinematic/SHOT-03-NIGHT-VIGIL.jpg', dur:7.5, ease:0,
    from:{x:0.00,y:0.05,z:1.18,r:0}, to:{x:0.00,y:-0.03,z:1.05,r:0},
    narr:'Every step a prayer.', light:[.42,.62,.30], fog:.5, heat:.25 },
  { img:'cinematic/SHOT-04-PROCESSION-GATE.jpg', dur:7.0, ease:1,
    from:{x:0.00,y:0.09,z:1.12,r:0.5}, to:{x:0.00,y:-0.07,z:1.03,r:-0.6},
    light:[.5,.30,.18], fog:.6, heat:.1 },
  { img:'cinematic/SHOT-05-GOD-REVEAL.jpg', dur:8.5, ease:1,
    from:{x:0.00,y:0.00,z:1.00,r:-1.2}, to:{x:0.00,y:-0.02,z:1.22,r:0.8},
    narr:'The gates are waking.', boom:1, light:[.5,.42,.35], fog:.45, heat:.3 },
  { img:'cinematic/SHOT-09-IMPACT-SLAM.jpg', dur:3.6, ease:2,
    from:{x:0.00,y:0.00,z:1.02,r:0}, to:{x:0.00,y:0.00,z:1.30,r:0},
    shake:1, light:[.5,.5,.5], fog:.3, heat:.4 },
  { img:'cinematic/SHOT-06-STORM-GOD.jpg', dur:7.5, ease:0,
    from:{x:0.08,y:0.0,z:1.04,r:1.0}, to:{x:-0.08,y:-0.01,z:1.15,r:-0.8},
    light:[.35,.25,.28], fog:.7, heat:.05 },
  { img:'cinematic/SHOT-07-THE-HOLLOW.jpg', dur:8.0, ease:0,
    from:{x:0.00,y:0.01,z:1.04,r:0}, to:{x:0.00,y:-0.03,z:1.22,r:3.2},
    narr:'But something else woke first.', light:[.5,.35,.06], fog:.85, heat:0, grade:[.72,.78,.9] },
  { img:'cinematic/SHOT-08-FINAL-STAND.jpg', dur:8.5, ease:0,
    from:{x:0.00,y:0.06,z:1.22,r:1.0}, to:{x:0.00,y:-0.04,z:1.02,r:0},
    narr:'Stand at the gate.', light:[.5,.55,.16], fog:.5, heat:.15 },
];
const XFADE = 1.1, NARR_IN = 1.4, NARR_OUT = 1.2;

// ---------- WEBGL SETUP ----------
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl', { antialias:false });
let W=0, H=0;
function resize(){ W=cv.width=Math.floor(innerWidth*Math.min(devicePixelRatio,1.6));
  H=cv.height=Math.floor(innerHeight*Math.min(devicePixelRatio,1.6)); }
addEventListener('resize', resize); resize();

const VS = `attribute vec2 p; varying vec2 uv;
void main(){ uv = vec2(p.x*.5+.5, .5-p.y*.5); gl_Position = vec4(p,0.,1.); }`;

const FS = `
precision highp float;
varying vec2 uv;
uniform sampler2D texA, texB;
uniform float mixF;
uniform vec2  camA, camB;
uniform float zA, zB;
uniform float rA, rB;
uniform float t;
uniform vec3  lightA, lightB;
uniform float fogA, fogB;
uniform float heatA, heatB;
uniform vec3  gradeA, gradeB;
uniform vec2  shake;
uniform float aspect;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<4;i++){ v+=a*noise(p); p*=2.03; a*=.5; } return v; }

float depthOf(vec3 c, float vy){
  float lum = dot(c, vec3(.299,.587,.114));
  float vert = smoothstep(1.05, -0.05, vy);
  float dark = smoothstep(.55, .06, lum);
  return clamp(vert*.72 + dark*.38, 0., 1.);
}

vec2 heatWobble(vec3 c, vec2 u, float amt){
  float lum = dot(c, vec3(.299,.587,.114));
  float hot = smoothstep(.62, .95, lum) * amt;
  return vec2( fbm(u*7. + vec2(t*.9, t*1.3)) -.5,
               fbm(u*7. + vec2(5.2-t*.8, t*1.1))-.5 ) * hot * .012;
}

vec3 shoot(sampler2D tex, vec2 cam, float zoom, float roll, vec3 lightP,
           float fogAmt, float heat, vec3 grade){
  vec2 suv = uv - .5;
  float ca = cos(roll), sa = sin(roll);
  suv = mat2(ca,-sa,sa,ca) * suv;
  suv.x *= aspect;
  vec4 s4 = texture2D(tex, clamp(suv+.5, 0.001, 0.999));
  float d = depthOf(s4.rgb, suv.y+.5);
  float inv = 1. + (zoom-1.)*(.65 + d*.85);
  vec2 par = cam * (1.-d)*1.35;
  par += shake * (d*1.4);
  vec2 u2 = suv * inv - par;
  u2.x /= aspect;
  u2 += .5;
  vec3 pre = texture2D(tex, clamp(u2,0.,1.)).rgb;
  u2 += heatWobble(pre, u2, heat);
  vec2 cu2 = clamp(u2, vec2(0.001), vec2(.999));
  vec3 col = texture2D(tex, cu2).rgb;
  vec2 lp = vec2(lightP.x*aspect, lightP.y);
  vec2 dir = lp - vec2(uv.x*aspect, uv.y);
  float dist = length(dir);
  float rays = fbm(normalize(dir).yx*3. + vec2(0., -t*.22));
  rays = pow(max(rays,0.),2.2) * lightP.z;
  float flick = .78 + .22*sin(t*7.3) * sin(t*3.1+1.7);
  col += vec3(1.,.72,.42) * rays * .38 * flick * smoothstep(1.2,.05,dist*.8);
  float fog1 = fbm(vec2(uv.x*2.2 + t*.045, uv.y*2.6 - t*.018));
  float fog2 = fbm(vec2(uv.x*3.1 - t*.07,  uv.y*3.4 + t*.02));
  float band1 = smoothstep(.42,.78, fog1) * smoothstep(1.,.15,uv.y*.7+.15);
  float band2 = smoothstep(.48,.85, fog2) * smoothstep(.9,.3,uv.y);
  vec3 fogCol = vec3(.62,.58,.52);
  col = mix(col, fogCol, (band1*.35 + band2*.28) * fogAmt * flick);
  col *= grade;
  return col;
}

void main(){
  vec3 a = shoot(texA, camA, zA, rA, lightA, fogA, heatA, gradeA);
  if(mixF > 0.001){
    vec3 b = shoot(texB, camB, zB, rB, lightB, fogB, heatB, gradeB);
    gl_FragColor = vec4(mix(a,b,mixF), 1.);
  } else gl_FragColor = vec4(a,1.);
}`;

function mkShader(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, mkShader(gl.VERTEX_SHADER,VS));
gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U = {}; ['texA','texB','mixF','camA','camB','zA','zB','rA','rB','t','lightA','lightB',
  'fogA','fogB','heatA','heatB','gradeA','gradeB','shake','aspect'].forEach(n=> U[n]=gl.getUniformLocation(prog,n));

function loadTex(url){ return new Promise(res=>{
  const tx = gl.createTexture(); const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = ()=>{ gl.bindTexture(gl.TEXTURE_2D,tx);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,img);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR); res(tx); };
  img.src = url; }); }
let TEX=null;
const allLoaded = Promise.all(SEQ.map(s=>loadTex(s.img))).then(t=>TEX=t);

// ---------- AUDIO (WebAudio synth score) ----------
let AC=null, master=null, droneGain=null;
function initAudio(){
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
  droneGain = AC.createGain(); droneGain.gain.value=0;
  const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=110; lp.Q.value=.6;
  [55,55.6,110].forEach(f=>{ const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.connect(lp); o.start(); });
  lp.connect(droneGain); droneGain.connect(master);
}
function boom(power=1){
  if(!AC) return;
  const t=AC.currentTime;
  const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(88,t); o.frequency.exponentialRampToValueAtTime(26,t+.9);
  const g=AC.createGain(); g.gain.setValueAtTime(.001,t); g.gain.exponentialRampToValueAtTime(.9*power,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+1.6);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+1.7);
  const nb=AC.createBuffer(1,AC.sampleRate*.4,AC.sampleRate); const ch=nb.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/ch.length,2.4);
  const src=AC.createBufferSource(); src.buffer=nb;
  const nf=AC.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=420;
  const ng=AC.createGain(); ng.gain.setValueAtTime(.5*power,t); ng.gain.exponentialRampToValueAtTime(.0001,t+.5);
  src.connect(nf); nf.connect(ng); ng.connect(master); src.start(t);
}
function riser(){
  if(!AC) return;
  const t=AC.currentTime, dur=3.2;
  const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(60,t); o.frequency.exponentialRampToValueAtTime(220,t+dur);
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=2.2; f.frequency.setValueAtTime(200,t); f.frequency.exponentialRampToValueAtTime(2400,t+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(.001,t); g.gain.exponentialRampToValueAtTime(.34,t+dur); g.gain.exponentialRampToValueAtTime(.0001,t+dur+.15);
  o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.2);
}
function hitAndCutDrone(){
  if(!AC) return; boom(1.15);
  const t=AC.currentTime;
  droneGain.gain.setTargetAtTime(.05,t,.6); droneGain.gain.setTargetAtTime(0,t+3,1.4);
}

// ---------- EMBERS + GRAIN (2D overlays) ----------
const ec=document.getElementById('embers'), ex=ec.getContext('2d');
let embers=[];
function sizeCanvas(c){ c.width=innerWidth; c.height=innerHeight; }
function resizeCv(){ sizeCanvas(ec); } addEventListener('resize',resizeCv); resizeCv();
function spawnEm(n){ for(let i=0;i<n;i++) embers.push({ x:Math.random()*innerWidth, y:innerHeight+10+Math.random()*40,
  r:.6+Math.random()*1.8, v:.35+Math.random()*1.1, sway:Math.random()*Math.PI*2, sw:.004+Math.random()*.012, a:.15+Math.random()*.5 }); }
function drawEmbers(dt){
  ex.clearRect(0,0,ec.width,ec.height);
  if(embers.length<70 && Math.random()<.25) spawnEm(1);
  embers.forEach(p=>{ p.y-=p.v*dt; p.sway+=p.sw*dt*60; const x=p.x+Math.sin(p.sway)*14;
    const g=ex.createRadialGradient(x,p.y,0,x,p.y,p.r*3);
    g.addColorStop(0,`rgba(255,170,80,${p.a})`); g.addColorStop(1,'rgba(255,120,40,0)');
    ex.fillStyle=g; ex.beginPath(); ex.arc(x,p.y,p.r*3,0,7); ex.fill(); });
  embers=embers.filter(p=>p.y>-30);
}
const gc=document.getElementById('grain'), gx=gc.getContext('2d'); gc.width=240; gc.height=135;
function drawGrain(){
  const w=gc.width,h=gc.height;
  gx.drawImage(gc,-(Math.random()*8),(Math.random()*8));
  const img=gx.getImageData(0,0,w,h), d=img.data;
  for(let i=3;i<d.length;i+=4){ d[i]=Math.min(255, d[i]+(Math.random()*54-24)); }
  gx.putImageData(img,0,0);
}

// ---------- DIRECTOR / SEQUENCER ----------
const narr=document.getElementById('narrText'), flash=document.getElementById('flash'), hud=document.getElementById('hud');
SEQ.forEach(()=>{ const dot=document.createElement('i'); hud.appendChild(dot); });
const dots=[...hud.children];
let idx=-1, t0=0, playing=false, shakeUntil=0, done=false;
const lerp=(a,b,k)=>a+(b-a)*k;
function hashN(x){ const s=Math.sin(x*127.1)*43758.5453; return s-Math.floor(s); }
function easeK(k, mode){
  if(mode===1){ const e=k*k*(3-2*k); return e*e*(k<.5? 1.2:1); }
  if(mode===2){ return k<.6 ? (k*k)*(0.28/0.36) : 0.28 + ((k-0.6)*(k-0.6))*5.3; }
  return k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
}
function showNarr(text, holdDur){
  narr.style.transition='none'; narr.style.opacity=0; narr.style.transform='scale(1.05)';
  narr.textContent=text;
  requestAnimationFrame(()=>{ narr.style.transition=`opacity ${NARR_IN}s ease, transform ${NARR_IN}s ease`;
    narr.style.opacity=1; narr.style.transform='scale(1)';
    setTimeout(()=>{ narr.style.opacity=0; }, (holdDur-NARR_OUT)*1000); });
}
function cutFlash(strong){
  flash.style.transition='none'; flash.style.opacity=strong? .85 : .38;
  requestAnimationFrame(()=>{ flash.style.transition='opacity .7s ease'; flash.style.opacity=0; });
}
function startShot(i){
  idx=i;
  if(i>=SEQ.length){ enterTitle(); return; }
  dots.forEach((d,j)=>{ d.className = j<i?'past':(j===i?'now':''); });
  t0=performance.now();
  const s=SEQ[i];
  if(s.boom) boom(.8);
  if(s.narr) setTimeout(()=>showNarr(s.narr, s.dur*0.8), 350);
  if(s.shake){ shakeUntil=t0+800; boom(1.25); cutFlash(1); }
  else cutFlash(i>0 ? .45 : 1);
}
function enterTitle(){
  dots.forEach(d=>d.className='past');
  riser();
  setTimeout(()=>{
    hitAndCutDrone();
    document.getElementById('title').classList.add('on');
    cutFlash(1);
    const cr=document.getElementById('credits');
    const rollCredits=(role,name,delay,hold)=>{
      setTimeout(()=>{
        cr.querySelector('.role').textContent=role;
        cr.querySelector('.name').textContent=name;
        cr.classList.add('on'); cr.style.opacity=0;
        cr.style.transition='opacity 1.1s ease'; boom(.5);
        requestAnimationFrame(()=>{ cr.style.opacity=1; });
        setTimeout(()=>{ cr.style.opacity=0; }, hold||2400);
        setTimeout(()=>{ cr.classList.remove('on'); }, (hold||2400)+1200);
      }, delay);
    };
    rollCredits('Directed by','BudE404', 3400, 3000);
    rollCredits('A Bude404 Game','In Association With BIG Entertainment', 8000, 3000);
    setTimeout(()=>{ document.getElementById('end').classList.add('on'); done=true; }, 12600);
  }, 3000);
}

// ---------- MAIN LOOP ----------
let last=performance.now(), T=0;
function loop(now){
  const dt=Math.min(50,now-last)/1000; last=now; T+=dt;
  if(playing){ drawEmbers(dt*60); drawGrain(); }
  gl.viewport(0,0,W,H);
  gl.uniform1f(U.t, T);
  gl.uniform2f(U.shake, 0,0);
  gl.uniform1f(U.aspect, W/H);
  if(TEX && playing && idx>=0 && idx<SEQ.length){
    const s=SEQ[idx], k=Math.min(1,(now-t0)/(s.dur*1000)), e=easeK(k, s.ease||0);
    let camX=lerp(s.from.x,s.to.x,e), camY=lerp(s.from.y,s.to.y,e),
        zoom=lerp(s.from.z,s.to.z,e), roll=lerp(s.from.r,s.to.r,e)*Math.PI/180;
    if(now<shakeUntil){ const p=(shakeUntil-now)/800;
      camX+=(hashN(T*13.1)-.5)*.012*p; camY+=(hashN(T*17.7)-.5)*.012*p;
      gl.uniform2f(U.shake,(hashN(T*31.3)-.5)*.05*p,(hashN(T*37.9)-.5)*.05*p); }
    const timeIn=(now-t0)/1000, remain=s.dur+XFADE-timeIn;
    let mixF=0, s2=null;
    if(remain<XFADE && idx+1<SEQ.length){ s2=SEQ[idx+1]; mixF=1-(remain/XFADE); }
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, TEX[idx]);
    gl.uniform1i(U.texA,0);
    gl.uniform2f(U.camA,camX,camY); gl.uniform1f(U.zA,zoom); gl.uniform1f(U.rA,roll);
    const gA=s.grade||[1,1,1];
    const lA=s.light||[.5,.3,.1];
    gl.uniform3f(U.lightA, lA[0],lA[1],lA[2]);
    gl.uniform1f(U.fogA, s.fog||.3); gl.uniform1f(U.heatA, s.heat||0);
    gl.uniform3f(U.gradeA, gA[0],gA[1],gA[2]);
    if(s2){
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, TEX[idx+1]);
      gl.uniform1i(U.texB,1);
      gl.uniform2f(U.camB,s2.from.x,s2.from.y); gl.uniform1f(U.zB,s2.from.z);
      gl.uniform1f(U.rB,s2.from.r*Math.PI/180);
      const gB=s2.grade||[1,1,1];
      const lB=s2.light||[.5,.3,.1];
      gl.uniform3f(U.lightB, lB[0],lB[1],lB[2]);
      gl.uniform1f(U.fogB, s2.fog||.3); gl.uniform1f(U.heatB, s2.heat||0);
      gl.uniform3f(U.gradeB, gB[0],gB[1],gB[2]);
    } else gl.uniform1f(U.mixF,0);
    gl.uniform1f(U.mixF, mixF);
    gl.drawArrays(gl.TRIANGLES,0,3);
    if(timeIn>=s.dur+XFADE) startShot(idx+1);
  } else { gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- START ----------
document.getElementById('start').addEventListener('click', async ()=>{
  await allLoaded;
  initAudio();
  const st=document.getElementById('studio');
  st.classList.add('on');
  document.getElementById('hud').classList.add('on');
  document.getElementById('start').style.transition='opacity .8s ease';
  document.getElementById('start').style.opacity=0;
  setTimeout(()=>document.getElementById('start').style.display='none', 850);
  setTimeout(()=>{ st.style.opacity=1; }, 250);
  droneGain.gain.setTargetAtTime(.34, AC.currentTime, 2.2);
  setTimeout(()=>{ st.style.opacity=0; setTimeout(()=>st.classList.remove('on'),1150); startShot(0); playing=true; }, 4200);
});
</script>
