<script>

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => Number(n || 0).toLocaleString();
let activeTab = 'command';

function badge(label, tone='primary') {
  const map = {
    primary:'bg-primary/15 text-primary border-primary/30',
    good:'bg-bull-950 text-bull-400 border-bull-700/50',
    warn:'bg-yellow-950/40 text-yellow-300 border-yellow-500/40',
    bad:'bg-bear-950 text-bear-400 border-bear-700/50',
    mute:'bg-neutral-800 text-neutral-300 border-neutral-700'
  };
  return `<span class="inline-flex items-center rounded-full border ${map[tone]||map.primary} px-3 py-1 text-xs font-bold uppercase tracking-wide">${esc(label)}</span>`;
}
function card(title, body, extra='') {
  return `<section class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-4 shadow-dark-outline ${extra}"><h3 class="mb-3 text-lg font-bold text-neutral-50">${esc(title)}</h3>${body}</section>`;
}
function metric(label, value, hint='', tone='primary') {
  const color = tone==='good'?'text-bull-400':tone==='warn'?'text-yellow-300':tone==='bad'?'text-bear-400':'text-primary';
  return `<div class="rounded-2xl border border-neutral-800 bg-neutral-950/70 p-4"><div class="text-xs font-bold uppercase tracking-wider text-neutral-500">${esc(label)}</div><div class="mt-1 text-3xl font-black ${color}">${esc(value)}</div><div class="mt-1 text-sm text-neutral-400">${esc(hint)}</div></div>`;
}
function navButton(id, label) {
  const on = activeTab===id;
  return `<button onclick="setTab('${id}')" class="rounded-2xl border px-4 py-2 text-sm font-bold uppercase tracking-wide transition ${on?'border-primary bg-primary text-white':'border-neutral-800 bg-neutral-900 text-neutral-300 hover:bg-neutral-800'}">${esc(label)}</button>`;
}
function setTab(id) { activeTab=id; render(); }

function renderHeader() {
  const h = PLATFORM.health;
  return `<header class="relative overflow-hidden rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5 shadow-dark-outline">
    <div class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_top_right,oklch(0.75_0.18_250),transparent_36%),radial-gradient(circle_at_bottom_left,oklch(0.72_0.16_145),transparent_30%)]"></div>
    <div class="relative flex flex-col gap-4">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div>
          <div class="mb-2 flex flex-wrap gap-2">${badge('Platform Command Center','primary')}${badge(h.sourceLoreAudit,'good')}${badge(h.githubMain==='MATCHED'?'GitHub Matched':'GitHub Check',h.githubMain==='MATCHED'?'good':'warn')}</div>
          <h1 class="text-4xl font-black leading-none text-neutral-50 md:text-6xl">Titan Gates: Ascension</h1>
          <p class="mt-2 max-w-3xl text-base text-neutral-300">A Reaper-operated, GitHub-backed mythic tactics platform: canon vault, production pipeline, lore audit gate, and creator handoff command layer.</p>
        </div>
        <div class="rounded-2xl border border-neutral-700 bg-neutral-950/80 p-3 text-right">
          <div class="text-xs font-bold uppercase tracking-wider text-neutral-500">GitHub Head</div>

          <div class="text-xs text-neutral-400">${esc(PLATFORM.branch)} · ${PLATFORM.workingTreeClean?'clean':'dirty'}</div>
        </div>
      </div>
      <div class="flex flex-wrap gap-2">${navButton('command','Command')}${navButton('canon','Canon')}${navButton('production','Production')}${navButton('operations','Operations')}</div>
    </div>
  </header>`;
}
function renderCommand() {
  const c=PLATFORM.counts, p=PLATFORM.production;
  const metrics = [
    metric('Factions', c.factions, 'Playable Realm cultures', 'primary'),
    metric('Titans', c.titans, 'Solo combat roster', 'good'),
    metric('Missions', c.missions, 'Campaign mission registry', 'primary'),
    metric('Art Needs', p.assetsTotal, 'GitHub asset registry entries', 'warn'),
    metric('Battlefields', c.maps, 'Map prompts and 3D handoffs', 'primary'),
    metric('Handoff Packets', p.handoffPackets, 'Creator-ready packets', 'good')
  ].join('');
  const health = Object.entries(PLATFORM.health).map(([k,v])=>`<div class="flex items-center justify-between gap-3 rounded-xl border border-neutral-800 bg-neutral-950/60 px-3 py-2"><span class="text-neutral-400">${esc(k.replace(/[A-Z]/g,m=>' '+m).replace(/^./,m=>m.toUpperCase()))}</span>${badge(v, String(v).match(/PASS|MATCHED|CLEAN/)?'good':'warn')}</div>`).join('');

  return `<div class="grid gap-4 lg:grid-cols-[1.45fr_.85fr]">
    <section class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-4 shadow-dark-outline">
      <div class="mb-3 flex items-center justify-between gap-3"><h2 class="text-2xl font-black">Platform Pulse</h2>${badge('GitHub source of truth','primary')}</div>
      <div class="grid grid-cols-2 gap-3 md:grid-cols-3">${metrics}</div>
    </section>
    ${card('Gate Health', `<div class="space-y-2">${health}</div>`)}
    ${card('Recent GitHub Trail', `<ul class="space-y-2">${commits}</ul>`, 'lg:col-span-2')}
  </div>`;
}

  const factions = PLATFORM.factions.map(f=>`<article class="rounded-2xl border border-neutral-800 bg-neutral-950/70 p-4">
    <div class="mb-2 flex items-center justify-between gap-3"><div class="flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-2xl border border-primary/30 bg-primary/10 text-xl text-primary">${esc(f.symbol)}</span><div><h3 class="text-xl font-black text-neutral-50">${esc(f.name)}</h3><p class="text-xs uppercase tracking-wider text-neutral-500">${esc(f.realm || 'Realm canon locked')}</p></div></div>${badge(`${f.titans} Titans`,'good')}</div>

function renderProduction() {

  const sc = Object.entries(PLATFORM.production.statusCounts || {}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="flex items-center justify-between rounded-xl border border-neutral-800 bg-neutral-950/60 px-3 py-2"><span class="font-bold text-neutral-300">${esc(k)}</span><span class="text-xl font-black text-yellow-300">${fmt(v)}</span></div>`).join('');

}

function renderOperations() {
  const loop = PLATFORM.operatingLoop.map((x,i)=>`<div class="flex gap-3 rounded-2xl border border-neutral-800 bg-neutral-950/70 p-3"><div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-primary text-sm font-black text-white">${i+1}</div><div><div class="font-black text-neutral-50">${esc(x)}</div><p class="text-sm text-neutral-400">${i===0?'Holder intent becomes the target.':i===1?'Canon/data changes are made in the vault.':i===2?'The source-culture gate catches drift.':i===3?'Build, assets, and gameplay checks run.':i===4?'The Reaper panel updates for the holder.':i===5?'GitHub records the new state.':'Remote head is checked against local.'}</p></div></div>`).join('');
  return `<div class="grid gap-4 lg:grid-cols-[.9fr_1.1fr]">

    ${card('What This Platform Is Now', `<div class="space-y-4 text-neutral-300"><p><b class="text-neutral-50">GitHub is the vault.</b> Lore, data, prompts, validation scripts, and production manifests live there with a commit trail.</p><p><b class="text-neutral-50">Reaper is the operator.</b> I can audit, patch, validate, publish, commit, and push the platform forward when you call the next move.</p><p><b class="text-neutral-50">The Mini App is the command surface.</b> This panel turns the game project into something you can monitor, direct, and expand.</p><div class="rounded-2xl border border-primary/30 bg-primary/10 p-4"><div class="text-lg font-black text-primary">Next profitable build target</div><p class="text-sm text-neutral-300">Add an interactive Mission Control view: filter by faction, inspect each mission’s battlefield/art package, and mark creator assets as ready as they land in GitHub.</p></div></div>`)}
  </div>`;
}
function render() {
  const body = activeTab==='canon' ? renderCanon() : activeTab==='production' ? renderProduction() : activeTab==='operations' ? renderOperations() : renderCommand();
  document.getElementById('app').innerHTML = renderHeader() + body + `<footer class="py-3 text-center text-xs text-neutral-500">Generated ${esc(PLATFORM.generatedAt)} · commit ${esc(PLATFORM.commit)} · source-lore audit clean</footer>`;
}
