function simulateOps(t,m){const powerGap=(t.power||0)-(m.recommendedPower||0);const tactic=tacticBias==='AGGRESSIVE'?18:tacticBias==='DEFENSIVE'?8:12;const survival=(t.hp||0)*0.45+(t.armor||0)*1.6+(t.speed||0)*1.8;const pressure=(m.recommendedPower||0)*0.38+(m.objectives||2)*7;const score=Math.round(52+powerGap*0.18+tactic+(survival-pressure)*0.22);const clamped=Math.max(8,Math.min(96,score));const rounds=Math.max(2,Math.min(9,Math.round(6-(powerGap/95)+(m.objectives||2)*0.25+(tacticBias==='DEFENSIVE'?1:0))));const momentum=Math.max(0,Math.round((t.attack||0)*2+(t.accuracy||70)/4+powerGap/18+(tacticBias==='AGGRESSIVE'?12:tacticBias==='DEFENSIVE'?4:8)));const risk=clamped>=72?'LOW':clamped>=50?'MEDIUM':'HIGH';const result=clamped>=65?'CLEAN WIN':clamped>=45?'NARROW HOLD':'FAILED LINE';return{chance:clamped,rounds,momentum,risk,result};}

function titanLabScore(t){const s=t.stats||{};return Math.round((t.power||0)+(s.hp||0)*.8+(s.attack||0)*3+(s.armor||0)*2+(s.speed||0)*4+(s.accuracy||0)*.4);}
function renderTitanLab(){const lab=PLATFORM.titanLab||{titans:[],roles:[],factions:[]};const q=titanLabQuery.toLowerCase();const filtered=(lab.titans||[]).filter(t=>(titanLabFaction==='ALL'||t.faction===titanLabFaction)&&(titanLabRole==='ALL'||t.role===titanLabRole)&&(!q||`${t.id} ${t.name} ${t.faction} ${t.role} ${t.rarity} ${(t.archetypes||[]).join(' ')} ${(t.strengths||[]).join(' ')}`.toLowerCase().includes(q)));if(!filtered.find(t=>t.id===titanLabId)&&filtered[0]) titanLabId=filtered[0].id;const t=(lab.titans||[]).find(x=>x.id===titanLabId)||filtered[0]||(lab.titans||[])[0]||{};const s=t.stats||{};const factionButtons=['ALL',...(lab.factions||[])].map(f=>`<button onclick="titanLabFaction='${esc(f)}';render()" class="rounded-2xl border ${titanLabFaction===f?'border-primary bg-primary/15 text-primary':'border-neutral-800 bg-neutral-950/70 text-neutral-300'} px-3 py-2 text-left font-bold">${esc(f)}${f==='ALL'?'':` <span class="text-neutral-500">${(lab.titans||[]).filter(x=>x.faction===f).length}</span>`}</button>`).join('');const roleOptions=['ALL',...(lab.roles||[])].map(r=>`<option value="${esc(r)}" ${titanLabRole===r?'selected':''}>${esc(r)}</option>`).join('');const titanRows=filtered.slice(0,80).map(x=>`<button onclick="titanLabId='${esc(x.id)}';render()" class="w-full rounded-2xl border ${titanLabId===x.id?'border-primary bg-primary/15':'border-neutral-800 bg-neutral-950/70'} p-3 text-left"><div class="flex items-start justify-between gap-2"><div><div class="font-black text-neutral-50">${esc(x.name)}</div><div class="text-xs text-neutral-500">${esc(x.id)} · ${esc(x.faction)} · ${esc(x.role)}</div></div>${badge(x.power||0,x.power>=230?'good':'primary')}</div><div class="mt-2 flex flex-wrap gap-1">${(x.archetypes||[]).slice(0,2).map(a=>badge(a,'mute')).join('')}${badge(x.rarity||'Titan','primary')}</div></button>`).join('');const missionCards=(t.bestMissions||[]).map(m=>`<div class="rounded-2xl border border-neutral-800 bg-neutral-950/70 p-3"><div class="font-black text-neutral-50">${esc(m.title)}</div><div class="font-mono text-xs text-neutral-500">${esc(m.id)} · PWR ${fmt(m.power)}</div><div class="mt-2 flex flex-wrap gap-1">${badge(`${m.objectives||0} objectives`,'good')}${(m.roles||[]).slice(0,3).map(r=>badge(r,'mute')).join('')}</div><p class="mt-2 line-clamp-2 text-xs text-neutral-400">${esc(m.terrain||'Faction terrain match')}</p></div>`).join('');const abilityList=(t.abilities||[]).map(a=>`<li class="rounded-xl border border-neutral-800 bg-neutral-950/70 px-3 py-2 text-sm text-neutral-300">${esc(a)}</li>`).join('');const gearList=(t.gear||[]).map(g=>badge(g,'mute')).join('');const strengths=(t.strengths||[]).map(x=>badge(x,'good')).join('');const weaknesses=(t.weaknesses||[]).map(x=>badge(x,'warn')).join('');const counters=(t.counterplay||[]).map(x=>`<li class="text-sm text-neutral-300">• ${esc(x)}</li>`).join('');return `<div class="grid gap-4"><section class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-4 shadow-dark-outline"><div class="mb-3 flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-2xl font-black">Titan Lab</h2><p class="text-sm text-neutral-400">Inspect the full roster: stats, kit, passives, matchup risk, best missions, and upgrade direction.</p></div>${badge(`${filtered.length} shown of ${lab.count||0}`,'primary')}</div><div class="grid grid-cols-2 gap-3 md:grid-cols-4">${metric('Roster',lab.count||0,'Playable Titan designs','good')}${metric('Selected Power',t.power||0,'Combat power','primary')}${metric('Lab Score',titanLabScore(t),'Weighted solo score','good')}${metric('Roles',(lab.roles||[]).length,'Coverage lanes','primary')}</div><div class="mt-3 grid gap-2 md:grid-cols-[1fr_220px_auto]"><input value="${esc(titanLabQuery)}" oninput="titanLabQuery=this.value;render()" placeholder="Search Titan, faction, role, strength..." class="w-full min-w-0 rounded-2lg border border-neutral-700 bg-neutral-950 px-4 py-2.5 text-neutral-50 placeholder-neutral-500 focus:border-primary" /><select onchange="titanLabRole=this.value;render()" class="w-full min-w-0 rounded-2lg border border-neutral-700 bg-neutral-950 px-4 py-2.5 text-neutral-50">${roleOptions}</select><button onclick="titanLabQuery='';titanLabFaction='ALL';titanLabRole='ALL';render()" class="rounded-2lg border border-neutral-700 bg-neutral-800 px-5 py-2 font-bold text-neutral-300">Reset</button></div></section><div class="grid gap-4 xl:grid-cols-[360px_1fr]"><section class="grid gap-3 rounded-2_5xl border border-neutral-800 bg-neutral-900 p-4 shadow-dark-outline"><h3 class="text-xl font-black">Roster Filters</h3><div class="grid max-h-[420px] gap-2 overflow-auto pr-1">${factionButtons}</div><div class="grid max-h-[520px] gap-2 overflow-auto pr-1">${titanRows||`<div class="rounded-2xl border border-neutral-800 p-4 text-neutral-400">No Titans match.</div>`}</div></section><section class="grid gap-4"><div class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-4 shadow-dark-outline"><div class="flex flex-wrap items-start justify-between gap-3"><div><h3 class="text-2xl font-black text-neutral-50">${esc(t.name||'Titan')}</h3><p class="text-sm text-neutral-400">${esc(t.id||'')} · ${esc(t.faction||'')} · ${esc(t.role||'')} · ${esc(t.rarity||'')}</p></div><div class="flex flex-wrap gap-1">${(t.archetypes||[]).map(a=>badge(a,'primary')).join('')}</div></div><div class="mt-3 grid grid-cols-2 gap-2 md:grid-cols-4">${statPill('HP',s.hp)}${statPill('ATK',s.attack)}${statPill('ARM',s.armor)}${statPill('SPD',s.speed)}${statPill('ACC',s.accuracy)}${statPill('RES',s.resistance)}${statPill('RNG',s.range)}${statPill('CRIT',s.critChance)}</div><div class="mt-3 grid gap-3 lg:grid-cols-2"><div class="rounded-2xl border border-neutral-800 bg-neutral-950/70 p-3"><div class="font-black text-neutral-50">Unique Mechanic</div><p class="mt-1 text-sm text-neutral-300">${esc(t.uniqueMechanic||'Role-specific solo mechanic.')}</p></div><div class="rounded-2xl border border-neutral-800 bg-neutral-950/70 p-3"><div class="font-black text-neutral-50">Passive / Upgrade Direction</div><p class="mt-1 line-clamp-5 text-sm text-neutral-300">${esc(t.passive||t.progressionPath||'Progress through faction-true kit mastery.')}</p></div></div></div><div class="grid gap-4 lg:grid-cols-2"><section class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-4 shadow-dark-outline"><h3 class="text-xl font-black">Kit + Gear</h3><ul class="mt-3 grid gap-2">${abilityList}</ul><div class="mt-3 flex flex-wrap gap-1">${gearList}</div></section><section class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-4 shadow-dark-outline"><h3 class="text-xl font-black">Matchup Read</h3><div class="mt-3"><div class="mb-1 text-xs uppercase tracking-wide text-neutral-500">Strengths</div><div class="flex flex-wrap gap-1">${strengths}</div></div><div class="mt-3"><div class="mb-1 text-xs uppercase tracking-wide text-neutral-500">Weaknesses</div><div class="flex flex-wrap gap-1">${weaknesses}</div></div><div class="mt-3 rounded-2xl border border-neutral-800 bg-neutral-950/70 p-3"><div class="font-black text-neutral-50">Preferred Battlefield</div><p class="text-sm text-neutral-300">${esc(t.preferredBattlefield||'Objective terrain with role expression.')}</p></div><ul class="mt-3 grid gap-1">${counters}</ul></section></div><section class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-4 shadow-dark-outline"><h3 class="text-xl font-black">Best Opening Missions</h3><div class="mt-3 grid gap-2 md:grid-cols-2">${missionCards}</div></section></section></div></div>`;}
function renderCanon(){const surfaces=PLATFORM.loreSurfaces.map(s=>`<div class="rounded-2xl border border-neutral-800 bg-neutral-950/70 p-4"><div class="flex items-start justify-between gap-3"><div><div class="text-xl font-black text-neutral-50">${esc(s.name)}</div><p class="text-sm text-neutral-400">${esc(s.state)}</p></div><div class="text-3xl font-black text-primary">${fmt(s.count)}</div></div></div>`).join('');const factions=PLATFORM.factions.map(f=>`<article class="rounded-2xl border border-neutral-800 bg-neutral-950/70 p-4"><div class="mb-2 flex items-center justify-between gap-3"><div class="flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-2xl border border-primary/30 bg-primary/10 text-xl text-primary">${esc(f.symbol)}</span><div><h3 class="text-xl font-black text-neutral-50">${esc(f.name)}</h3><p class="text-xs uppercase tracking-wider text-neutral-500">${esc(f.realm||'Realm canon locked')}</p></div></div>${badge(`${f.titans} Titans`,'good')}</div><p class="line-clamp-3 text-sm text-neutral-300">${esc(f.rule||'Source-culture rules are locked into faction, Titan, mission, battlefield, and art prompt layers.')}</p><div class="mt-3 flex flex-wrap gap-2">${badge(`${f.missions} missions`,'primary')}${badge('Earth myth is echo','mute')}</div></article>`).join('');return `<div class="grid gap-4">${card('Lore Surfaces',`<div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">${surfaces}</div>`)}${card('Seven Realm Canon',`<div class="grid gap-3 lg:grid-cols-2">${factions}</div>`)}</div>`;}
function renderProduction(){const ac=Object.entries(PLATFORM.production.assetCounts||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="flex items-center justify-between rounded-xl border border-neutral-800 bg-neutral-950/60 px-3 py-2"><span class="font-bold text-neutral-300">${esc(k)}</span><span class="text-xl font-black text-primary">${fmt(v)}</span></div>`).join('');const sc=Object.entries(PLATFORM.production.statusCounts||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="flex items-center justify-between rounded-xl border border-neutral-800 bg-neutral-950/60 px-3 py-2"><span class="font-bold text-neutral-300">${esc(k)}</span><span class="text-xl font-black text-yellow-300">${fmt(v)}</span></div>`).join('');const vc=Object.entries(PLATFORM.production.validationCounts||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="flex items-center justify-between rounded-xl border border-neutral-800 bg-neutral-950/60 px-3 py-2"><span class="font-bold text-neutral-300">${esc(k)}</span><span class="text-xl font-black text-bull-400">${fmt(v)}</span></div>`).join('');return `<div class="grid gap-4 lg:grid-cols-3">${card('Asset Types',`<div class="space-y-2">${ac}</div>`)}${card('Asset Status',`<div class="space-y-2">${sc}</div>`)}${card('Validation Status',`<div class="space-y-2">${vc}</div>`)}${card('Creator Pipeline',`<div class="grid grid-cols-2 gap-3">${metric('3D Blueprints',PLATFORM.production.blueprints,'Production queue')}${metric('Handoff Batches',PLATFORM.production.handoffBatches,'Creator packages','good')}${metric('Packets',PLATFORM.production.handoffPackets,'Valid packets','good')}${metric('Approval',PLATFORM.production.approvalStatus,'Art generation state','primary')}</div>`,'lg:col-span-3')}</div>`;}
function renderOperations(){const loop=PLATFORM.operatingLoop.map((x,i)=>`<div class="flex gap-3 rounded-2xl border border-neutral-800 bg-neutral-950/70 p-3"><div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-primary text-sm font-black text-white">${i+1}</div><div><div class="font-black text-neutral-50">${esc(x)}</div><p class="text-sm text-neutral-400">${i===0?'Holder intent becomes the target.':i===1?'Canon/data changes are made in the vault.':i===2?'The source-culture gate catches drift.':i===3?'Build, assets, and gameplay checks run.':i===4?'The Reaper panel updates for the holder.':i===5?'GitHub records the new state.':'Remote head is checked against local.'}</p></div></div>`).join('');return `<div class="grid gap-4 lg:grid-cols-[.9fr_1.1fr]">${card('Operating Loop',`<div class="space-y-2">${loop}</div>`)}${card('Next Build Target',`<div class="space-y-4 text-neutral-300"><p><b class="text-neutral-50">Asset Intake Control is live.</b> The next edge is Titan Lab refinement: compare roster upgrades, matchup risk, and mission readiness from one tactical view.</p><div class="rounded-2xl border border-primary/30 bg-primary/10 p-4"><div class="text-lg font-black text-primary">Recommended next strike</div><p class="text-sm text-neutral-300">Add deeper per-Titan comparison charts and upgrade planning once live playtest data starts flowing.</p></div></div>`)}</div>`;}
function render(){const body=activeTab==='mission'?renderMission():activeTab==='assets'?renderAssets():activeTab==='handoff'?renderHandoff():activeTab==='playable'?renderPlayable():activeTab==='titanlab'?renderTitanLab():activeTab==='canon'?renderCanon():activeTab==='production'?renderProduction():activeTab==='operations'?renderOperations():renderCommand();document.getElementById('app').innerHTML=renderHeader()+body+`<footer class="py-3 text-center text-xs text-neutral-500">Generated ${esc(PLATFORM.generatedAt)} · base ${esc(PLATFORM.commit)} · Playable Ops online</footer>`;}
render();
</script>
</body>
</html>
