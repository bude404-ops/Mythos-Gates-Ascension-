  <script>
    const DATA = JSON.parse(document.getElementById('tg-data').textContent);
    const TITANS = [
      {id:'aten-ra', realm:'ATEN RA', name:'Aten-Ra, Solar Law Monolith', hp:34, atk:7, range:2, role:'Defensive solar command', sig:'Solar Verdict', color:'text-yellow-400'},
      {id:'khemet', realm:'ATEN RA', name:'Khemet Suncrown', hp:28, atk:5, range:3, role:'Radiance battery', sig:'Radiance Well', color:'text-yellow-400'},
      {id:'hrothar', realm:'ASGARDIAN', name:'Hrothar Rune-Mountain', hp:40, atk:6, range:1, role:'Durable oath tank', sig:'Oathwall', color:'text-blue-400'},
      {id:'skeld', realm:'ASGARDIAN', name:'Skeld Iron Tempest', hp:31, atk:8, range:1, role:'Counterattack bruiser', sig:'Storm Counter', color:'text-blue-400'},
      {id:'aurelion', realm:'OLYMPIAN', name:'Aurelion Heaven-Marrow', hp:32, atk:7, range:2, role:'Elite balanced Titan', sig:'Ichor Strike', color:'text-orange-400'},
      {id:'nikos', realm:'OLYMPIAN', name:'Nikos Star-Lance', hp:25, atk:9, range:3, role:'Precision ranged', sig:'Star Lance', color:'text-orange-400'},
      {id:'amaterion', realm:'KAMI', name:'Amaterion Spirit-Sun', hp:27, atk:8, range:2, role:'Spirit precision', sig:'Mirror Sun', color:'text-red-400'},
      {id:'kageyori', realm:'KAMI', name:'Kageyori Shadow Gate', hp:24, atk:10, range:1, role:'Stealth strike', sig:'Shadow Gate', color:'text-red-400'},
      {id:'dagoran', realm:'TUATHA', name:'Dagoran Root-Crown', hp:36, atk:5, range:2, role:'Nature adaptation', sig:'Root Snare', color:'text-bull-400'},
      {id:'eryndor', realm:'TUATHA', name:'Eryndor Emerald Oath', hp:29, atk:4, range:3, role:'Healing support', sig:'Emerald Renewal', color:'text-bull-400'},
      {id:'seraphel', realm:'EMPYREAN', name:'Seraphel, the Throne Eternal', hp:35, atk:6, range:2, role:'Defensive control', sig:'Throne Lock', color:'text-primary'},
      {id:'mordrath', realm:'INFERNAL DOMINION', name:'Mordrath, the Infernal King', hp:33, atk:9, range:1, role:'Aggressive assault', sig:'Hell Crown', color:'text-bear-400'}
    ];
    const S = {route:'campaigns', campaignId:null, chapterId:null, missionId:null, type:'Normal', selected:['aten-ra','hrothar','aurelion','amaterion','dagoran'], battle:null};
    const $ = id => document.getElementById(id);
    const esc = x => String(x ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const faction = id => DATA.factions.find(f=>f.id===id) || {name:'Unknown Realm'};
    const campaign = id => DATA.campaigns.find(c=>c.id===id);
    const chapter = id => DATA.chapters.find(c=>c.id===id);
    const mission = id => DATA.missions.find(m=>m.id===id);
    const byTitan = id => TITANS.find(t=>t.id===id);
    const missionsFor = (fid,type) => DATA.missions.filter(m=>m.factionId===fid && m.type===type).sort((a,b)=>a.n-b.n);
    const chaptersFor = fid => DATA.chapters.filter(c=>c.factionId===fid).sort((a,b)=>a.n-b.n);
    function setRoute(route, payload={}){ Object.assign(S,payload,{route}); render(); window.scrollTo({top:0,behavior:'smooth'}); }
    function goHome(){ setRoute('campaigns'); }
    function badge(text, tone='primary'){ const cls=tone==='ok'?'bg-bull-950 text-bull-400':tone==='bad'?'bg-bear-950 text-bear-400':'bg-primary/15 text-primary'; return `<span class="rounded-full ${cls} px-3 py-1 text-xs font-black uppercase tracking-[.12em]">${esc(text)}</span>`; }
    function campaignCards(){
      const rows = DATA.factions.map(f => {
        const ch=chaptersFor(f.id); const normal=missionsFor(f.id,'Normal'); const elite=missionsFor(f.id,'Elite'); const c=DATA.campaigns.find(x=>x.factionId===f.id) || DATA.campaigns.find(x=>x.name?.toLowerCase().includes(f.name.split(' ')[0].toLowerCase()));
        const powers = normal.map(m=>m.power); const range = powers.length ? `${Math.min(...powers)}–${Math.max(...powers)}` : '—';
        return `<button onclick="setRoute('chapters',{campaignId:'${c?.id||''}', chapterId:'${ch[0]?.id||''}', type:'Normal'})" class="rounded-3xl border border-neutral-800 bg-neutral-900 p-4 text-left active:scale-[.99] hover:border-primary/60"><div class="flex items-start justify-between gap-3"><div><p class="text-xs font-black uppercase tracking-[.24em] text-primary">${esc(f.realm || f.name)}</p><h2 class="text-2xl font-black">${esc(c?.name || f.name)}</h2></div>${badge(ch.length+' chapters','ok')}</div><p class="mt-2 line-clamp-3 text-sm text-neutral-300">${esc(c?.summary || f.philosophy)}</p><div class="mt-4 grid grid-cols-3 gap-2 text-center text-xs"><span class="rounded-xl bg-neutral-950 p-2">Normal<br><b>${normal.length}</b></span><span class="rounded-xl bg-neutral-950 p-2">Elite<br><b>${elite.length}</b></span><span class="rounded-xl bg-neutral-950 p-2">Power<br><b>${range}</b></span></div><p class="mt-3 text-xs text-neutral-400">${esc(f.combat || f.philosophy)}</p></button>`;
      }).join('');
      return `<section class="space-y-4"><header class="rounded-3xl border border-primary/40 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.3em] text-primary">Campaign Select</p><h1 class="mt-1 text-4xl font-black">Choose the Realm War</h1><p class="mt-2 max-w-3xl text-neutral-300">Seven faction campaigns are now wired into the playable path: select a faction, inspect chapters, choose Normal or Elite missions, then launch the battle shell with real mission objectives.</p><div class="mt-4 flex flex-wrap gap-2">${badge('7 factions','ok')}${badge('35 chapters','ok')}${badge(DATA.missions.length+' missions','ok')}${badge('5-Titan standard')}</div></header><div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">${rows}</div></section>`;
    }
    function chapterBrowser(){
      const fid = (chapter(S.chapterId)?.factionId) || DATA.campaigns.find(c=>c.id===S.campaignId)?.factionId || DATA.factions[0].id;
      const f=faction(fid); const chs=chaptersFor(fid); const current=chapter(S.chapterId) || chs[0]; const ids=S.type==='Elite'?current.eliteMissionIds:current.missionIds; const list=ids.map(mission).filter(Boolean);
      const tabs = chs.map(ch=>`<button onclick="setRoute('chapters',{chapterId:'${ch.id}'})" class="rounded-2lg px-3 py-2 text-sm font-black ${current.id===ch.id?'bg-primary text-white':'bg-neutral-800 text-neutral-300'}">CH ${ch.n}</button>`).join('');
      const missionRows = list.map(m=>`<button onclick="setRoute('mission',{missionId:'${m.id}'})" class="rounded-2xl border border-neutral-800 bg-neutral-900 p-3 text-left hover:border-primary/60"><div class="flex items-center justify-between gap-2"><h3 class="font-black">${esc(m.n+'. '+m.title)}</h3>${badge(m.power+' PWR')}</div><p class="mt-1 line-clamp-2 text-sm text-neutral-300">${esc(m.primary)}</p><p class="mt-2 text-xs text-neutral-500">${esc(m.mapName)} · ${esc(m.terrain)}</p></button>`).join('');
      return `<section class="space-y-4"><button onclick="setRoute('campaigns')" class="rounded-2lg bg-neutral-800 px-3 py-2 text-sm font-black text-neutral-300">← Campaigns</button><header class="rounded-3xl border border-primary/40 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.3em] text-primary">${esc(f.name)} · Chapter Select</p><h1 class="text-4xl font-black">${esc(current.title)}</h1><p class="mt-2 text-neutral-300">${esc(current.summary)}</p><div class="mt-4 flex flex-wrap gap-2"><button onclick="setRoute('chapters',{type:'Normal'})" class="rounded-full px-4 py-2 text-xs font-black ${S.type==='Normal'?'bg-primary text-white':'bg-neutral-800 text-neutral-300'}">NORMAL</button><button onclick="setRoute('chapters',{type:'Elite'})" class="rounded-full px-4 py-2 text-xs font-black ${S.type==='Elite'?'bg-bear-500 text-white':'bg-neutral-800 text-neutral-300'}">ELITE</button>${badge(list.length+' missions','ok')}</div></header><div class="flex flex-wrap gap-2">${tabs}</div><div class="grid gap-3 md:grid-cols-2">${missionRows}</div></section>`;
    }
    function missionDetail(){
      const m=mission(S.missionId) || DATA.missions[0]; const f=faction(m.factionId); const ch=DATA.chapters.find(c=>c.factionId===m.factionId && c.n===m.chapter); const enemies=(m.enemies||[]).concat(m.boss?[m.boss]:[]);
      return `<section class="space-y-4"><button onclick="setRoute('chapters',{chapterId:'${ch?.id||''}', type:'${m.type}'})" class="rounded-2lg bg-neutral-800 px-3 py-2 text-sm font-black text-neutral-300">← Chapter</button><header class="rounded-3xl border border-primary/40 bg-neutral-900 p-5"><div class="flex flex-wrap items-start justify-between gap-3"><div><p class="text-xs font-black uppercase tracking-[.3em] text-primary">${esc(f.name)} · ${esc(m.type)} Mission ${m.n}</p><h1 class="text-4xl font-black">${esc(m.title)}</h1></div>${badge(m.power+' recommended power',m.type==='Elite'?'bad':'primary')}</div><p class="mt-3 text-neutral-300">${esc(m.description)}</p><p class="mt-3 rounded-2xl border border-neutral-800 bg-neutral-950 p-3 text-sm text-neutral-300">${esc(m.lore)}</p><div class="mt-4 flex flex-wrap gap-2">${badge('Team '+m.team,'ok')}${badge(m.mapName)}${badge(m.terrain.slice(0,42))}</div></header><section class="grid gap-3 lg:grid-cols-[1.1fr_.9fr]"><div class="rounded-3xl border border-neutral-800 bg-neutral-900 p-4"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">Objectives</p><h2 class="mt-2 text-xl font-black">Primary</h2><p class="text-neutral-300">${esc(m.primary)}</p><h2 class="mt-4 text-xl font-black">Optional Stars</h2><ul class="mt-2 space-y-2">${(m.optional||[]).map(o=>`<li class="rounded-xl bg-neutral-950 p-2 text-sm text-neutral-300">✦ ${esc(o)}</li>`).join('')}</ul><button onclick="launchMission('${m.id}')" class="mt-4 w-full rounded-2lg bg-primary px-5 py-4 text-xl font-black text-white">LAUNCH MISSION</button></div><aside class="space-y-3"><div class="rounded-3xl border border-neutral-800 bg-neutral-900 p-4"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">Threats</p>${enemies.length?enemies.map(e=>`<p class="mt-2 rounded-xl bg-neutral-950 p-2 text-sm text-neutral-300">◆ ${esc(e)}</p>`).join(''):'<p class="mt-2 text-neutral-400">Threat data pending.</p>'}</div><div class="rounded-3xl border border-neutral-800 bg-neutral-900 p-4"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">First Clear</p>${(m.rewards||[]).map(r=>`<p class="mt-2 rounded-xl bg-neutral-950 p-2 text-sm text-neutral-300">${esc(r)}</p>`).join('')}</div></aside></section></section>`;
    }
    function toggleTitan(id){ if(S.selected.includes(id)) S.selected=S.selected.filter(x=>x!==id); else if(S.selected.length<5) S.selected.push(id); render(); }
    function launchMission(id){ const m=mission(id); S.missionId=id; S.route='battle'; S.battle={round:1, energy:3, log:[`Mission begins: ${m.title}`], seal:0, anchor:Math.max(18,Math.round(m.power/35)), enemies:(m.enemies.length?m.enemies:['Hollow Wretch','Gateborn Colossus','Forgotten Standard']).slice(0,4).map((name,i)=>({id:'e'+i,name,hp:14+i*5+Math.round(m.power/120),atk:3+i,dead:false})), units:S.selected.map(id=>({...byTitan(id), maxHp:byTitan(id).hp, hp:byTitan(id).hp, acted:false})), gameOver:null, stars:0}; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    function activeUnits(){ return S.battle.units.filter(u=>u.hp>0); }
    function battleLog(t){ S.battle.log.unshift(t); S.battle.log=S.battle.log.slice(0,9); }
    function strikeEnemy(idx,sig=false){ const B=S.battle; if(B.gameOver||B.energy<(sig?2:1)) return; const u=activeUnits().find(x=>!x.acted) || activeUnits()[0]; const e=B.enemies[idx]; if(!u||!e||e.hp<=0) return; const dmg=u.atk+(sig?4:0); e.hp=Math.max(0,e.hp-dmg); u.acted=true; B.energy-=sig?2:1; battleLog(`${u.name} uses ${sig?u.sig:'Strike'} on ${e.name} for ${dmg}.`); if(e.hp<=0) battleLog(`${e.name} collapses into Gate ash.`); checkBattle(); }
    function workObjective(kind){ const B=S.battle; if(B.gameOver||B.energy<1) return; const u=activeUnits().find(x=>!x.acted) || activeUnits()[0]; if(!u) return; u.acted=true; B.energy--; if(kind==='seal'){B.seal++; battleLog(`${u.name} advances the primary objective (${B.seal}/3).`);} else {B.anchor=Math.max(0,B.anchor-u.atk); battleLog(`${u.name} breaks the mission pressure node for ${u.atk}.`);} checkBattle(); }
    function enemySurge(){ const B=S.battle; if(B.gameOver) return; B.enemies.filter(e=>e.hp>0).forEach(e=>{ const t=activeUnits().sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0]; if(t){t.hp=Math.max(0,t.hp-e.atk); battleLog(`${e.name} wounds ${t.name} for ${e.atk}.`);} }); B.round++; B.energy=3; B.units.forEach(u=>u.acted=false); if(B.round>12 || activeUnits().length===0){B.gameOver='DEFEAT'; battleLog('The Gate pressure overwhelms the strike force.');} render(); }
    function enemyTurn(){ enemySurge(); }
    function scoreStars(){ const B=S.battle; return (B.round<=8 && activeUnits().length===5)?3:activeUnits().length>=3?2:1; }
    function callReinforcements(){ if(!S.battle) return; const n=S.battle.enemies.length; S.battle.enemies.push({id:'reinforcement-'+n,name:'Hollow Reinforcement',hp:16,atk:4,dead:false}); battleLog('The Hollow Anchor calls new shapes through the breach.'); }
    function checkBattle(){ const B=S.battle; if(B.seal>=3 && B.anchor<=0 && B.enemies.every(e=>e.hp<=0)){ B.gameOver='VICTORY'; B.stars=scoreStars(); battleLog(`Mission clear: ${B.stars} star${B.stars===1?'':'s'} earned.`); } else if(B.energy<=0 || activeUnits().every(u=>u.acted)) enemyTurn(); render(); }
    function battleView(){
      const m=mission(S.missionId), B=S.battle; if(!m||!B) return campaignCards(); const f=faction(m.factionId);
      return `<section class="space-y-4"><header class="rounded-3xl border border-primary/40 bg-neutral-900 p-5"><div class="flex flex-wrap items-start justify-between gap-3"><div><p class="text-xs font-black uppercase tracking-[.3em] text-primary">Battle · ${esc(f.name)} · ${esc(m.type)}</p><h1 class="text-4xl font-black">${esc(m.title)}</h1><p class="mt-2 text-neutral-300">Round ${B.round}/12 · Energy ${B.energy}/3 · Power ${m.power}</p></div><button onclick="setRoute('mission',{missionId:'${m.id}'})" class="rounded-2lg bg-neutral-800 px-3 py-2 text-sm font-black text-neutral-300">MISSION</button></div></header>${B.gameOver?`<div class="rounded-3xl border ${B.gameOver==='VICTORY'?'border-bull-500 bg-bull-950/20':'border-bear-500 bg-bear-950/20'} p-5 text-center"><p class="text-xs font-black uppercase tracking-[.3em]">${B.gameOver}</p><h2 class="text-4xl font-black">${B.gameOver==='VICTORY'?B.stars+'★ Clear':'Strike Force Broken'}</h2><button onclick="launchMission('${m.id}')" class="mt-4 rounded-2lg bg-primary px-5 py-3 font-black text-white">PLAY AGAIN</button></div>`:''}<section class="grid gap-3 lg:grid-cols-[1fr_390px]"><div class="space-y-3"><div class="rounded-3xl border border-neutral-800 bg-neutral-900 p-4"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">Mission Pressure</p><div class="mt-3 grid gap-2 sm:grid-cols-2"><button onclick="workObjective('seal')" class="rounded-2xl border border-yellow-700 bg-yellow-950/20 p-4 text-left"><b>Primary Objective</b><br><span class="text-sm text-neutral-300">${esc(m.primary)} · ${B.seal}/3</span></button><button onclick="workObjective('anchor')" class="rounded-2xl border border-bear-700 bg-bear-950/20 p-4 text-left"><b>Pressure Node</b><br><span class="text-sm text-neutral-300">Break Gate pressure · ${B.anchor} HP</span></button></div></div><div class="grid gap-2 sm:grid-cols-2">${B.enemies.map((e,i)=>`<div class="rounded-2xl border border-neutral-800 bg-neutral-900 p-3"><p class="font-black">◆ ${esc(e.name)}</p><p class="text-sm text-neutral-400">HP ${Math.max(0,e.hp)} · ATK ${e.atk}</p><div class="mt-2 flex gap-2"><button onclick="strikeEnemy(${i},false)" class="rounded-xl bg-neutral-800 px-3 py-2 text-xs font-black">Strike</button><button onclick="strikeEnemy(${i},true)" class="rounded-xl bg-primary px-3 py-2 text-xs font-black text-white">Signature</button></div></div>`).join('')}</div></div><aside class="space-y-3"><div class="rounded-3xl border border-neutral-800 bg-neutral-900 p-4"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">Strike Force</p>${B.units.map(u=>`<p class="mt-2 rounded-xl bg-neutral-950 p-2 text-sm ${u.hp>0?'text-neutral-300':'text-bear-400'}">⬢ ${esc(u.name)} · ${Math.max(0,u.hp)}/${u.maxHp} HP ${u.acted?'· acted':''}</p>`).join('')}</div><div class="rounded-3xl border border-neutral-800 bg-neutral-900 p-4"><p class="text-xs font-black uppercase tracking-[.24em] text-primary">Log</p>${B.log.map(l=>`<p class="mt-2 text-sm text-neutral-300">${esc(l)}</p>`).join('')}</div></aside></section></section>`;
    }
    function render(){ $('app').innerHTML = S.route==='campaigns'?campaignCards():S.route==='chapters'?chapterBrowser():S.route==='mission'?missionDetail():battleView(); }
    render();
  </script>
</body>
</html>
