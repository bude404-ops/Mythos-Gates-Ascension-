<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Titans Gate Ascension — First Playable Build</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://static.print.world/reaper-cdn/print-lol-tokens.js"></script>
</head>
<body class="font-rajdhani min-h-screen bg-neutral-950 text-neutral-50 overflow-auto">
  <div class="sticky top-0 z-30 border-b border-neutral-800 bg-neutral-950/95 px-3 py-2 backdrop-blur"><div class="mx-auto flex max-w-7xl items-center justify-between gap-2"><span class="text-xs font-black uppercase tracking-[.24em] text-primary">Titan Gates playable build</span><a href="preview.html" class="rounded-2lg bg-primary px-3 py-2 text-sm font-black text-white no-underline">▶ Game Preview</a></div></div>
  <div id="app" class="mx-auto max-w-7xl p-3 pb-24 md:p-5"></div>
  <script>
    const TITANS = [
      {id:'aten-ra', realm:'ATEN RA', name:'Aten-Ra, Solar Law Monolith', hp:34, atk:7, range:2, role:'Defensive solar command', sig:'Solar Verdict', color:'text-yellow-400'},
      {id:'khemet', realm:'ATEN RA', name:'Khemet Suncrown', hp:28, atk:5, range:3, role:'Radiance battery', sig:'Radiance Well', color:'text-yellow-400'},
      {id:'hrothar', realm:'ASGARDIAN', name:'Hrothar Rune-Mountain', hp:40, atk:6, range:1, role:'Durable oath tank', sig:'Oathwall', color:'text-blue-400'},
      {id:'skeld', realm:'ASGARDIAN', name:'Skeld Iron Tempest', hp:31, atk:8, range:1, role:'Counterattack bruiser', sig:'Storm Counter', color:'text-blue-400'},
      {id:'aurelion', realm:'OLYMPIAN', name:'Aurelion Heaven-Marrow', hp:32, atk:7, range:2, role:'Elite balanced Titan', sig:'Ichor Strike', color:'text-orange-400'},
      {id:'nikos', realm:'OLYMPIAN', name:'Nikos Star-Lance', hp:25, atk:9, range:3, role:'Precision ranged', sig:'Star Lance', color:'text-orange-400'},
      {id:'amaterion', realm:'KAMI', name:'Amaterion Spirit-Sun', hp:27, atk:8, range:2, role:'Spirit precision', sig:'Mirror Sun', color:'text-red-400'},
      {id:'kageyori', realm:'KAMI', name:'Kageyori Shadow Gate', hp:24, atk:10, range:1, role:'Stealth strike', sig:'Shadow Gate', color:'text-red-400'},
      {id:'dagoran', realm:'TUATHA', name:'Dagoran Root-Crown', hp:36, atk:5, range:2, role:'Nature adaptation', sig:'Root Snare', color:'text-bull-400'},
      {id:'eryndor', realm:'TUATHA', name:'Eryndor Emerald Oath', hp:29, atk:4, range:3, role:'Healing support', sig:'Emerald Renewal', color:'text-bull-400'},
      {id:'seraphel', realm:'EMPYREAN', name:'Seraphel, the Throne Eternal', hp:35, atk:6, range:2, role:'Defensive control', sig:'Throne Lock', color:'text-primary'},
      {id:'mordrath', realm:'INFERNAL DOMINION', name:'Mordrath, the Infernal King', hp:33, atk:9, range:1, role:'Aggressive assault', sig:'Hell Crown', color:'text-bear-400'}
    ];
    const ENEMIES_BASE = [
      {id:'hollow-1', name:'Hollow Memory-Eater', hp:18, atk:5, x:4, y:0, icon:'◈'},
      {id:'gateborn-1', name:'Gateborn Rift-Bruiser', hp:24, atk:6, x:4, y:2, icon:'◆'},
      {id:'forgotten-1', name:'Forgotten Oath Remnant', hp:20, atk:5, x:4, y:4, icon:'◇'}
    ];
    const S = {screen:'squad', selected:['aten-ra','hrothar','aurelion','amaterion','dagoran'], turn:'player', round:1, energy:3, active:null, log:[], units:[], enemies:[], gameOver:null};
    const $ = id => document.getElementById(id);
    const esc = x => String(x ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const byId = id => TITANS.find(t => t.id === id);
    const dist = (a,b) => Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
    function startGame(){
      S.screen='battle'; S.round=1; S.energy=3; S.turn='player'; S.gameOver=null; S.log=['The Titan Gate opens. Five warforms answer.'];
      S.units = S.selected.map((id,i)=>({...byId(id), maxHp:byId(id).hp, hp:byId(id).hp, x:0, y:i, acted:false, team:'player', icon:'⬢'}));
      S.enemies = ENEMIES_BASE.map(e=>({...e, maxHp:e.hp, team:'enemy'}));
      S.active = S.units[0].id; render();
    }
    function toggleTitan(id){
      if(S.selected.includes(id)) S.selected = S.selected.filter(x=>x!==id);
      else if(S.selected.length < 5) S.selected.push(id);
      render();
    }
    function unitAt(x,y){ return [...S.units, ...S.enemies].find(u => u.hp>0 && u.x===x && u.y===y); }
    function activeUnit(){ return S.units.find(u => u.id===S.active && u.hp>0) || S.units.find(u=>u.hp>0); }
    function addLog(t){ S.log.unshift(t); S.log = S.log.slice(0,7); }
    function selectUnit(id){ if(S.turn==='player' && S.units.find(u=>u.id===id && u.hp>0 && !u.acted)){ S.active=id; render(); } }
    function moveActive(x,y){
      const u=activeUnit(); if(!u || S.turn!=='player' || u.acted || S.energy<1 || unitAt(x,y)) return;
      if(Math.abs(u.x-x)+Math.abs(u.y-y)>1) return;
      u.x=x; u.y=y; S.energy--; addLog(`${u.name} shifts across the Gate field.`); render();
    }
    function attackEnemy(id, signature=false){
      const u=activeUnit(), e=S.enemies.find(x=>x.id===id && x.hp>0); if(!u || !e || S.turn!=='player' || u.acted) return;
      const cost = signature ? 2 : 1; if(S.energy < cost) return;
      if(dist(u,e) > u.range + (signature ? 1 : 0)) { addLog(`${e.name} is outside ${u.name}'s reach.`); render(); return; }
      let dmg = u.atk + (signature ? 4 : 0);
      if(signature && u.id==='eryndor') { const ally=[...S.units].sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0]; ally.hp=Math.min(ally.maxHp, ally.hp+10); addLog(`${u.sig} restores ${ally.name}.`); }
      else if(signature && u.id==='dagoran') { e.snared=true; e.hp-=dmg; addLog(`${u.sig} binds ${e.name} for ${dmg}.`); }
      else { e.hp-=dmg; addLog(`${u.sig || 'Strike'} hits ${e.name} for ${dmg}.`); }
      S.energy -= cost; u.acted = true; cleanup();
    }
    function cleanup(){
      S.enemies.forEach(e=>{ if(e.hp<=0) addLog(`${e.name} collapses into Gate ash.`); });
      if(S.enemies.every(e=>e.hp<=0)){ S.gameOver='VICTORY'; addLog('The Gate is sealed. The Realms remember.'); }
      else if(S.units.every(u=>u.hp<=0)){ S.gameOver='DEFEAT'; addLog('The strike force falls beneath the Hollow tide.'); }
      else if(S.turn==='player' && (S.energy<=0 || S.units.filter(u=>u.hp>0).every(u=>u.acted))) enemyTurn();
      render();
    }
    function enemyTurn(){
      S.turn='enemy'; addLog('The Gateborn surge.');
      S.enemies.filter(e=>e.hp>0).forEach(e=>{
        const target = S.units.filter(u=>u.hp>0).sort((a,b)=>dist(e,a)-dist(e,b))[0]; if(!target) return;
        if(e.snared){ e.snared=false; addLog(`${e.name} tears free of roots.`); return; }
        if(dist(e,target)>1){ e.x += Math.sign(target.x-e.x); e.y += Math.abs(target.x-e.x) ? 0 : Math.sign(target.y-e.y); addLog(`${e.name} advances.`); }
        else { target.hp -= e.atk; addLog(`${e.name} wounds ${target.name} for ${e.atk}.`); }
      });
      if(S.units.every(u=>u.hp<=0)){ S.gameOver='DEFEAT'; }
      S.turn='player'; S.round++; S.energy=3; S.units.forEach(u=>u.acted=false); S.active = S.units.find(u=>u.hp>0)?.id; render();
    }
    function endTurn(){ if(S.turn==='player' && !S.gameOver) enemyTurn(); }
    function hpBar(u){ const pct=Math.max(0,Math.round(100*u.hp/u.maxHp)); return `<div class="mt-1 h-1.5 rounded bg-neutral-800"><div class="h-1.5 rounded ${pct>50?'bg-bull-500':pct>25?'bg-primary':'bg-bear-500'}" style="width:${pct}%"></div></div>`; }
    function renderSquad(){
      return `<div class="space-y-4"><header class="rounded-3xl border border-primary/40 bg-neutral-900 p-5"><p class="text-xs font-black uppercase tracking-[.3em] text-primary">First Playable Build</p><h1 class="mt-1 text-4xl font-black">Choose Five Titans</h1><p class="mt-2 text-neutral-300">Build a 5-Titan strike force and seal the unstable Gate. This is the first GitHub game build: tactical loop, roster selection, battle grid, enemy turn, victory and defeat.</p><div class="mt-4 flex gap-2"><span class="rounded-full bg-primary/15 px-3 py-1 text-sm font-black text-primary">${S.selected.length}/5 Selected</span><span class="rounded-full bg-neutral-800 px-3 py-1 text-sm font-black text-neutral-300">Titan-only Canon</span></div></header><section class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">${TITANS.map(t=>`<button onclick="toggleTitan('${t.id}')" class="rounded-2xl border ${S.selected.includes(t.id)?'border-primary bg-primary/10':'border-neutral-800 bg-neutral-900'} p-4 text-left active:scale-[.99]"><p class="text-xs font-black uppercase tracking-[.2em] ${t.color}">${esc(t.realm)}</p><h2 class="text-xl font-black">${esc(t.name)}</h2><p class="mt-1 text-sm text-neutral-300">${esc(t.role)}</p><div class="mt-3 grid grid-cols-4 gap-2 text-center text-xs"><span class="rounded bg-neutral-950 p-2">HP<br><b>${t.hp}</b></span><span class="rounded bg-neutral-950 p-2">ATK<br><b>${t.atk}</b></span><span class="rounded bg-neutral-950 p-2">RNG<br><b>${t.range}</b></span><span class="rounded bg-neutral-950 p-2">SIG<br><b>2E</b></span></div></button>`).join('')}</section><button id="open-gate-btn" type="button" ${S.selected.length===5?'':'disabled'} onclick="startGame()" class="w-full rounded-2lg ${S.selected.length===5?'bg-primary text-white':'bg-neutral-800 text-neutral-500'} px-5 py-4 text-xl font-black">OPEN THE TITAN GATE</button></div>`;
    }
    function renderGrid(){
      let cells='';
      for(let y=0;y<5;y++) for(let x=0;x<5;x++){
        const u=unitAt(x,y), act=activeUnit(); const active=act&&act.x===x&&act.y===y;
        cells += `<button onclick="${u?u.team==='player'?`selectUnit('${u.id}')`:`attackEnemy('${u.id}',false)`:`moveActive(${x},${y})`}" class="aspect-square rounded-xl border ${active?'border-primary bg-primary/20':u&&u.team==='enemy'?'border-bear-700 bg-bear-950/30':u?'border-bull-700 bg-bull-950/20':'border-neutral-800 bg-neutral-900'} p-1 text-center active:scale-[.98]"><div class="text-2xl">${u?u.team==='enemy'?u.icon:'⬢':'·'}</div><div class="truncate text-[10px] ${u&&u.team==='enemy'?'text-bear-400':u?'text-bull-400':'text-neutral-600'}">${u?u.name.split(' ')[0]:`${x},${y}`}</div>${u?`<div class="text-[10px]">${Math.max(0,u.hp)}</div>`:''}</button>`;
      }
      return `<div class="grid grid-cols-5 gap-1">${cells}</div>`;
    }
    function renderBattle(){
      const u=activeUnit();
      return `<div class="space-y-3"><header class="rounded-3xl border border-primary/40 bg-neutral-900 p-4"><div class="flex items-start justify-between gap-3"><div><p class="text-xs font-black uppercase tracking-[.3em] text-primary">Battlefield</p><h1 class="text-3xl font-black">ATEN RA Gate Awakening</h1><p class="text-sm text-neutral-300">Round ${S.round} · ${S.turn==='player'?'Your command':'Enemy surge'} · Energy ${S.energy}/3</p></div><button onclick="S.screen='squad';render()" class="rounded-2lg bg-neutral-800 px-3 py-2 text-xs font-black">SQUAD</button></div></header>${S.gameOver?`<section class="rounded-3xl border ${S.gameOver==='VICTORY'?'border-bull-500/50 bg-bull-950/20':'border-bear-500/50 bg-bear-950/20'} p-5 text-center"><p class="text-xs uppercase tracking-[.3em] ${S.gameOver==='VICTORY'?'text-bull-400':'text-bear-400'}">${S.gameOver}</p><h2 class="text-4xl font-black">${S.gameOver==='VICTORY'?'Gate Sealed':'Strike Force Broken'}</h2><button onclick="startGame()" class="mt-4 rounded-2lg bg-primary px-5 py-3 font-black text-white">PLAY AGAIN</button></section>`:''}<section class="grid gap-3 lg:grid-cols-[1fr_360px]"><div class="rounded-3xl border border-neutral-800 bg-neutral-950 p-3">${renderGrid()}</div><aside class="space-y-3"><div class="rounded-2xl border border-neutral-800 bg-neutral-900 p-3"><p class="text-xs uppercase tracking-[.2em] text-primary">Active Titan</p>${u?`<h2 class="text-xl font-black">${esc(u.name)}</h2><p class="text-sm text-neutral-300">${esc(u.role)}</p>${hpBar(u)}<div class="mt-3 grid grid-cols-2 gap-2"><button onclick="endTurn()" class="rounded-2lg bg-neutral-800 p-3 font-black">END TURN</button><button onclick="attackEnemy('${S.enemies.find(e=>e.hp>0)?.id||''}',true)" class="rounded-2lg bg-primary p-3 font-black text-white">SIGNATURE</button></div>`:'No active Titan'}</div><div class="rounded-2xl border border-neutral-800 bg-neutral-900 p-3"><p class="text-xs uppercase tracking-[.2em] text-bear-400">Enemies</p>${S.enemies.map(e=>`<button onclick="attackEnemy('${e.id}',false)" class="mt-2 w-full rounded-xl border border-neutral-800 bg-neutral-950 p-2 text-left ${e.hp<=0?'opacity-40':''}"><b>${esc(e.name)}</b><p class="text-xs text-neutral-400">HP ${Math.max(0,e.hp)}/${e.maxHp}</p>${hpBar(e)}</button>`).join('')}</div><div class="rounded-2xl border border-neutral-800 bg-neutral-900 p-3"><p class="text-xs uppercase tracking-[.2em] text-primary">Battle Log</p>${S.log.map(l=>`<p class="mt-1 text-sm text-neutral-300">${esc(l)}</p>`).join('')}</div></aside></section><section class="rounded-2xl border border-neutral-800 bg-neutral-900 p-4"><p class="text-xs uppercase tracking-[.2em] text-primary">Lore</p><p class="mt-1 text-sm text-neutral-300">Ancient humans saw fragments through Titan Gates and called them myths. Now the Gates reopen after the Ascension Collapse, and only colossal Realm-born Titans can hold back the Hollow, the Forgotten, and the Gateborn.</p></section></div>`;
    }
    function render(){ $('app').innerHTML = S.screen === 'squad' ? renderSquad() : renderBattle(); }
    document.addEventListener('click', e => { if(e.target && e.target.closest && e.target.closest('#open-gate-btn')) startGame(); });
    document.addEventListener('touchend', e => { if(e.target && e.target.closest && e.target.closest('#open-gate-btn')) { e.preventDefault(); startGame(); } }, {passive:false});
    render();
  </script>
</body>
</html>
