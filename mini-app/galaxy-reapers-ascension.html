es are objectives first, fast-travel second, and cosmic evidence always.","Faction mechanics must emerge from culture, not generic combat tags.","Bosses are arguments in mythic form: each proves a faction belief wrong or incomplete."],"missionArcs":[{"id":"book1_m01_gate_breach","name":"Gate Breach","chapter":"I \u2014 Oathbone Wake","factionFocus":"Ilyr Gravebound","loreReveal":"The Oathbone Causeway is a funeral rite, not a temple road.","gameUnlock":"basic battle loop, Titan command, hold-Stargate objective","boss":null},{"id":"book1_m02_relic_line","name":"Relic Line","chapter":"I \u2014 Oathbone Wake","factionFocus":"Ilyr Gravebound","loreReveal":"Relics remember their first bearer and reject unbound hands.","gameUnlock":"gear slots, relic rarity, formation shielding","boss":null},{"id":"book1_m03_anchor_fall","name":"Anchor Fall","chapter":"I \u2014 Oathbone Wake","factionFocus":"Thalassari raiders","loreReveal":"Abyssal Courts are not invading; they are fleeing a deeper current.","gameUnlock":"first elite encounter, hazard movement, enemy Titan pressure","boss":"Abyssal Anchor-Beast"},{"id":"book1_m04_sun_key","name":"The Sun-Key Envoy","chapter":"II \u2014 Broken Alliances","factionFocus":"Aten-Kor","loreReveal":"Aten-Kor keys can stabilize Gates but burn false oaths into ash.","gameUnlock":"Aten-Kor ally shard path, cleanse, radiant objective modifier","boss":null},{"id":"book1_m05_salt_crown","name":"Salt Crown Parley","chapter":"II \u2014 Broken Alliances","factionFocus":"Pelagos Abyssal Courts","loreReveal":"Pelagos crowns are living pressure seals placed over sleeping Gate mouths.","gameUnlock":"choice node, diplomacy reward variant, waterline terrain","boss":null},{"id":"book1_m06_trial_of_three_oaths","name":"Trial of Three Oaths","chapter":"II \u2014 Broken Alliances","factionFocus":"Ilyr / Aten-Kor / Pelagos","loreReveal":"The three factions once guarded the same prison from different sides.","gameUnlock":"faction passive selection, mixed squad restrictions","boss":"Oath Mirror Triad"},{"id":"book1_m07_dust_choir","name":"Dust Choir","chapter":"III \u2014 Realm Roads","factionFocus":"neutral ancient world","loreReveal":"Dead realms still sing coordinates through ruined statues.","gameUnlock":"world modifiers, campaign map branching, summon denial","boss":null},{"id":"book1_m08_grave_sun","name":"Grave-Sun Relay","chapter":"III \u2014 Realm Roads","factionFocus":"Ilyr Gravebound","loreReveal":"The dead star above Ilyr is a locked Gate core.","gameUnlock":"Titan ultimate charge, marked-prey execution tutorial","boss":null},{"id":"book1_m09_the_drowned_gate","name":"The Drowned Gate","chapter":"III \u2014 Realm Roads","factionFocus":"Pelagos Abyssal Courts","loreReveal":"One Stargate lies underwater because opening it in air would poison the sky.","gameUnlock":"multi-wave defense, pressure clock, extraction zones","boss":"Court Leviathan Proxy"},{"id":"book1_m10_black_halo_signal","name":"Black Halo Signal","chapter":"IV \u2014 The Buried Voice","factionFocus":"hidden corrupted Titan","loreReveal":"The corrupted Titan is transmitting through halos, crowns, and relic rings.","gameUnlock":"corruption status, cleanse race, survival objective","boss":null},{"id":"book1_m11_synod_betrayal","name":"Synod Betrayal","chapter":"IV \u2014 The Buried Voice","factionFocus":"Ilyr Grave Synod","loreReveal":"A Synod edict was forged after the Collapse to keep the Reapers obedient.","gameUnlock":"hero loyalty modifier, betrayal ambush, restricted deployment","boss":"False Edict Keeper"},{"id":"book1_m12_first_gate_war","name":"The First Gate War","chapter":"IV \u2014 The Buried Voice","factionFocus":"allied factions","loreReveal":"The First Gate opens inward. The war is not for passage \u2014 it is for containment.","gameUnlock":"Book I finale, allied assist, corrupted Titan teaser","boss":"The Voice Below the Gate"}],"chapterBeats":[{"chapter":"I \u2014 Oathbone Wake","promise":"Teach the player that Gates are sacred weapons and the Ilyr are waking too late."},{"chapter":"II \u2014 Broken Alliances","promise":"Turn enemy factions into uneasy keepers of missing truths."},{"chapter":"III \u2014 Realm Roads","promise":"Expand from a single battlefield into a cosmic map of severed roads."},{"chapter":"IV \u2014 The Buried Voice","promise":"Reveal the war beneath the war and seed the corrupted Titan arc."}],"productionNext":["Convert mission arcs 4-12 into playable CONTENT.missions entries.","Add map variants for Sun-Key Relay, Drowned Gate, and Black Halo Signal.","Write cinematic intro/outro text for each mission.","Bind each mission to one roster/gear/faction unlock."]},"mythicOnlyLorePolicy":{"enabled":true,"rule":"Titan Gates lore and Art Needs prompts must frame power through myth, ritual, living materials, divine anatomy, relic craft, civic symbols, and realm-born architecture. Avoid industrial, modern, or generic sci-fi framing.","replacementLanguage":["rites","relic craft","living coral growths","soul-cores","prism sanctums","scarab regalia","oathbone architecture","divine anatomy"]},"directorSync":{"version":"0.88.1","status":"SYNCED_MYTHIC_ONLY","readerMode":"FAN_CODEX_UNLOCKED","rule":"All director layers read from the same mythic-only world bible: rites, relic craft, divine anatomy, living materials, civilization conflict, and realm-born architecture. No industrial or generic sci-fi framing is allowed in lore or Art Needs prompts.","sourceOfTruth":["deepWorldBible","loreDirector.mythicOnlyLorePolicy","artPromptEngine.mythicOnlyPromptPolicy","fanCodex"],"approvedLanguage":["rites","relic craft","soul-cores","living reef growths","scarab regalia","prism sanctums","divine anatomy","oathbone architecture","mythic civilization"],"avoidCategories":["industrial framing","modern factory language","generic sci-fi parts","non-mythic production cues"],"codexArchitecture":"ONE_DIRECTOR_ONE_CANON_ONE_CODEX","codexStatus":"CANONICAL_STANDALONE_REBUILT_IN_PLACE"},"canonicalCodexArchitecture":"ONE_DIRECTOR_ONE_CANON_ONE_CODEX","codexAutoPropagation":true,"codexConflictProtection":true,"codexReaderSeparation":"Codex presents lore only; game balance and development tasks remain outside reader presentation.","directorSyncVersion":"0.90.0"},"narrativeDesign":{"bookI":{"id":"book_i_narrative_layer","status":"fan-readable-cinematic-canon","cinematics":{"mission_gate_breach_01":{"intro":"The Oathbone Causeway exhales after centuries of silence. Ilyr coffins split open beneath a broken Stargate, and the first command is not spoken \u2014 it is remembered.","outro":"The Gate steadies, but the stone beneath it beats like a buried heart. Somewhere below, something hears the Reapers wake.","camera":["slow push over eclipse pillars","cyan soul-fire ignites one skull at a time","gate ring rotates against the sky"],"dialogue":["Sekk: The dead star has recalled its debt.","Ilyr Warden: Hold the anchor. If the road opens wrong, do not follow it."]},"mission_gate_breach_02":{"intro":"Relic lines rise from ash and reject every unbound hand. The enemy does not break the vault; the vault chooses what may be carried into war.","outro":"The first relic binds. Its edge hums with an old bearer\u2019s name \u2014 and with coordinates no map admits exist.","camera":["close shot of a spear refusing a living grip","rune light crawling into Reaper bone","hard cut to enemy silhouettes at the line"],"dialogue":["Relic Echo: Name your oath or bleed as a thief.","Sekk: We are not thieves. We are the receipt."]},"mission_gate_breach_03":{"intro":"Abyssal raiders breach the causeway with water in their lungs and terror in their crowns. They do not advance like conquerors. They run like survivors.","outro":"The Anchor-Beast falls, spilling black tide across the Gate. In the foam is a warning: below is not beneath. It is outside.","camera":["water erupts uphill across bone steps","the Anchor-Beast drags a chain of drowned crowns","gate flare reflected in black tide"],"dialogue":["Pelagos Herald: Seal it, grave-thing, before it sings again.","Sekk: Enemies do not beg in war. They confess."]},"mission_sun_key_04":{"intro":"Aten-Kor arrives beneath a blade of sunlight that casts no shadow. Their envoy offers a key and a threat: false oaths burn first.","outro":"The Sun-Key locks into the relay and the Gate screams clean. One Ilyr edict turns to ash before anyone admits it was forged.","camera":["gold ray cuts through cyan mist","solar key splits into three orbiting teeth","ash letters peel from a Synod seal"],"dialogue":["Aten Envoy: A true Gate obeys only a true oath.","Sekk: Then let it burn what lies."]},"mission_salt_crown_05":{"intro":"The Salt Crown Court opens under crushing water. Pelagos nobles do not lower weapons; they lower pressure, just enough for speech.","outro":"The parley ends with no peace, only shared dread. The crown seal pulses toward a Gate that must never taste air.","camera":["crown silhouettes behind glass-black water","bubbles rising like prayers","pressure seal closing over a sleeping mouth"],"dialogue":["Pelagos Crown: We raided your road because our own began whispering.","Sekk: Whispering has a source. We will cut it out."]},"mission_three_oaths_06":{"intro":"Three laws enter the tribunal: grave oath, sun oath, salt oath. The Mirror Triad answers by wearing all of their faces badly.","outro":"The mirror breaks into three usable truths. None of the factions guarded the whole prison. Each only remembered one lock.","camera":["three faction sigils reflected in black glass","mirror enemies copying player stances","shards hanging midair as choice nodes"],"dialogue":["Oath Mirror: Every guardian calls itself necessary.","Aten Envoy: Then prove which necessity survives contact with fire."]},"mission_dust_choir_07":{"intro":"Beyond the Gate lies a road of statues ground into dust. They sing without mouths, each note a coordinate severed from the living map.","outro":"The Dust Choir gives up one forbidden route. The campaign map widens \u2014 and every opened road points inward.","camera":["statues vibrating under ash","dust forming star-lines over the board","a coordinate burning into the UI map"],"dialogue":["Dust Choir: We remember the roads you murdered.","Sekk: Then sing the one that should have stayed dead."]},"mission_grave_sun_08":{"intro":"The dead star above Ilyr is not a sun. It is a locked Gate core wearing night as armor. To charge it is to wake the sky.","outro":"The Grave-Sun answers. Titan command surges through the army, but the black halo around the star answers a breath later.","camera":["sky cracks into a circular mechanism","Titan silhouette lit from behind by cyan flare","black halo ripple crossing the clouds"],"dialogue":["Ilyr Warden: The sky was sealed before our bones had names.","Sekk: Then our names are overdue."]},"mission_drowned_gate_09":{"intro":"The blackwater mouth opens beneath impossible pressure. Pelagos kept it drowned for a reason: if this Gate breathes air, the sky becomes an ocean of poison.","outro":"Extraction closes as the Leviathan Proxy sinks. Its last eye reflects a halo that was never underwater.","camera":["pressure gauge fractures on-screen","Leviathan shadow circling under tiles","extraction flare through dark water"],"dialogue":["Pelagos Crown: Hold it below. Kill anything that teaches it to rise.","Sekk: The Gate wants lungs. Deny it."]},"mission_black_halo_10":{"intro":"The signal arrives without sound. Halos, crowns, and relic rings all turn toward the same impossible center, and every oath hears its own voice calling back.","outro":"The signal is traced, not silenced. The hidden Titan is not imprisoned behind the Gate. The Gate is built around its thought.","camera":["rings across factions rotating in sync","UI corruption crawling over command cards","distant Titan eye opening inside static"],"dialogue":["Unknown Voice: You built doors and called them locks.","Sekk: A voice can bleed if we give it a throat."]},"mission_synod_betrayal_11":{"intro":"The Grave Synod issues an edict older than the Reapers\u2019 waking memory: stand down. Sekk reads the seal and hears a living hand behind dead law.","outro":"The False Edict Keeper breaks. Loyalty is no longer obedience; it is a weapon pointed by choice.","camera":["Synod mask descending like a moon","friendly markers flicker hostile","edict seal shattering into bone script"],"dialogue":["False Edict Keeper: Kneel. Your oath predates your will.","Sekk: Then my will is the newer blade."]},"mission_first_gate_war_12":{"intro":"Allied forces gather where the First Gate opens inward. The Voice Below does not threaten escape. It invites return.","outro":"The Gate seals, but not fully. The Voice Below promises a second war, and one black halo shard remains warm in the player\u2019s hand.","camera":["three faction armies at the corrupted ring","Gate aperture opening into darkness inside itself","final seal slamming shut around a smiling void"],"dialogue":["The Voice Below: You are not guarding a prison. You are standing inside one.","Sekk: Then we begin by locking the cell from within."]}},"bossEncounters":{"abyssal_anchor_beast":{"name":"Abyssal Anchor-Beast","missionId":"mission_gate_breach_03","role":"first monstrous pressure boss","faction":"thalassari","mechanics":["drags units toward Tide/Hazard tiles","breaks cover every second round","enrages when Gate Anchor is uncontrolled"],"weakness":"Marked Prey burst after chain slam recovery","lore":"A beast chained to drowned crowns, used by Pelagos to hold unstable Gate mouths shut.","gameplayKitId":"abyssal_anchor_beast"},"oath_mirror_triad":{"name":"Oath Mirror Triad","missionId":"mission_three_oaths_06","role":"three-phase faction doctrine boss","faction":"mixed","mechanics":["copies last player faction passive","splits into Grave/Sun/Salt reflections","final phase disables mixed-squad bonuses until a reflection falls"],"weakness":"focus the reflection matching your chosen oath","lore":"A pre-Collapse tribunal defense that tests whether guardians understand the prison they inherited.","gameplayKitId":"oath_mirror_triad"},"court_leviathan_proxy":{"name":"Court Leviathan Proxy","missionId":"mission_drowned_gate_09","role":"wave-defense pressure boss","faction":"thalassari","mechanics":["pressure clock accelerates reinforcements","submerges between damage windows","poisons air tiles if the Gate is not held"],"weakness":"hold Gate Anchor to force surfacing","lore":"Not the true Leviathan, but a crown-grown proxy body sent through blackwater to keep the Gate submerged.","gameplayKitId":"court_leviathan_proxy"},"false_edict_keeper":{"name":"False Edict Keeper","missionId":"mission_synod_betrayal_11","role":"betrayal/control boss","faction":"asterion","mechanics":["turns one formation hostile for a round","casts Stand Down to lock Titan command","gains armor from unspent player ability points"],"weakness":"spend command aggressively and cleanse edict seals","lore":"A Synod enforcement shell carrying a forged post-Collapse command seal.","gameplayKitId":"false_edict_keeper"},"voice_below_gate":{"name":"The Voice Below the Gate","missionId":"mission_first_gate_war_12","role":"Book I finale / corrupted Titan teaser","faction":"corrupted","mechanics":["corrupts objective rules mid-fight","spawns echo copies of defeated bosses","requires allied assist triggers to seal phases"],"weakness":"sequence Grave Mark, Sun Cleanse, Salt Seal before final strike","lore":"The hidden corrupted Titan speaking through the architecture of the First Gate rather than a full body.","gameplayKitId":"voice_below_gate"}},"loreToGameRules":["Cinematic intros teach the emotional problem before the objective appears.","Outros reveal one truth and open one rules question.","Boss mechanics must embody lore doctrine, never just bigger stats.","Every chapter ends with a rule contradiction that prepares the next chapter."],"nextProduction":["Convert dialogue into in-mission bark triggers.","Add boss abilities as deterministic combat data.","Create chapter-select presentation for the player game.","Bind outro unlock reveals to reward screens."],"directorSyncVersion":"0.88.0"}},"bossGameplay":{"bookI":{"id":"book_i_boss_gameplay_v1","status":"prototype-data-ready","globalRules":["Bosses use mechanics as lore proof, not stat inflation.","Each boss owns one board rule and one counter-rule.","Finale requires a three-doctrine seal sequence: Grave Mark, Sun Cleanse, Salt Seal."],"objectiveModifiers":{"hold_gate_anchor":{"trigger":"player controls Gate Anchor at round start","effect":"boss vulnerability window opens or pressure clock slows"},"pressure_clock":{"trigger":"round end on Pelagos boss maps","effect":"reinforcement threat rises unless objective is controlled"},"corruption_mutation":{"trigger":"Voice Below reaches phase two","effect":"objective text changes and corrupted tiles spread one ring"},"betrayal_ambush":{"trigger":"False Edict Keeper reaches 70% health","effect":"one allied formation becomes hostile for one round"},"seal_sequence":{"trigger":"finale phase three","effect":"player must apply Grave Mark, Sun Cleanse, then Salt Seal before lethal damage counts"}},"bossKits":{"abyssal_anchor_beast":{"missionId":"mission_gate_breach_03","hpBudget":"elite_intro","phaseThresholds":[100,50,0],"abilities":["BOSS_CHAIN_DRAG","BOSS_COVER_BREAK","BASIC_ATTACK"],"boardRule":"hazard lanes become lethal when chained units cross them","counterRule":"Marked Prey damage is amplified after Cover Break cooldown is spent","telemetryGoal":"teach forced movement and hazard awareness"},"oath_mirror_triad":{"missionId":"mission_three_oaths_06","hpBudget":"chapter_boss","phaseThresholds":[100,66,33,0],"abilities":["BOSS_OATH_COPY","BOSS_TRIAD_SPLIT","BASIC_ATTACK"],"boardRule":"mirrors copy recent faction passive use","counterRule":"destroy one reflection to restore mixed-squad bonuses","telemetryGoal":"teach faction doctrine identity and target priority"},"court_leviathan_proxy":{"missionId":"mission_drowned_gate_09","hpBudget":"pressure_boss","phaseThresholds":[100,75,35,0],"abilities":["BOSS_PRESSURE_CLOCK","BOSS_SUBMERGE","FORMATION_VOLLEY"],"boardRule":"pressure clock escalates until Gate Anchor is held","counterRule":"holding Gate Anchor forces Submerge to fail","telemetryGoal":"teach objective control under wave pressure"},"false_edict_keeper":{"missionId":"mission_synod_betrayal_11","hpBudget":"control_boss","phaseThresholds":[100,70,30,0],"abilities":["BOSS_STAND_DOWN","BOSS_TURNCOAT_ORDER","BASIC_ATTACK"],"boardRule":"unspent player command makes the boss more armored","counterRule":"spending AP aggressively weakens edict armor","telemetryGoal":"teach betrayal control and command tempo"},"voice_below_gate":{"missionId":"mission_first_gate_war_12","hpBudget":"book_finale","phaseThresholds":[100,75,50,25,0],"abilities":["BOSS_RULE_CORRUPTION","BOSS_ECHO_REPRISE","PLAYER_GRAVE_MARK","PLAYER_SUN_CLEANSE","PLAYER_SALT_SEAL"],"boardRule":"objective conditions mutate each phase","counterRule":"Grave Mark \u2192 Sun Cleanse \u2192 Salt Seal unlocks lethal damage","telemetryGoal":"combine every Book I doctrine into one containment puzzle"}},"bossLab":{"id":"book_i_boss_lab_v1","status":"scenario-selector-ready","defaultBossId":"voice_below_gate","previewRules":["Phase pressure is derived from HP threshold, active abilities, and objective control.","Counter hints are deterministic and built from each boss counter-rule.","Finale preview tracks the seal sequence instead of pretending lethal damage always works."],"sampleScenarios":[{"id":"anchor_intro","bossId":"abyssal_anchor_beast","hpPercent":50,"round":3,"objectiveHeld":false,"label":"Anchor-Beast after Cover Break"},{"id":"triad_split","bossId":"oath_mirror_triad","hpPercent":60,"round":4,"objectiveHeld":false,"label":"Mirror Triad split phase"},{"id":"leviathan_pressure","bossId":"court_leviathan_proxy","hpPercent":70,"round":5,"objectiveHeld":false,"label":"Leviathan pressure spike"},{"id":"edict_betrayal","bossId":"false_edict_keeper","hpPercent":65,"round":4,"objectiveHeld":true,"label":"False Edict betrayal window"},{"id":"voice_seal","bossId":"voice_below_gate","hpPercent":24,"round":8,"objectiveHeld":true,"sealStep":2,"label":"Voice Below final seal"}],"scenarioMatrixNote":"Each Book I boss scenario can be previewed from the Simulator without changing the core battle state."}}},"deepWorldBible":{"id":"deep_world_bible_v1","status":"art-prompt-bound","rule":"Every realm, faction, Titan, hero, and civilization must leave a visible trace in art prompts: silhouette, material, architecture, ritual object, palette, and VFX.","realms":{"ilyr-grave-ring":{"civilization":"The Ilyr Ossuary Dominion","cosmology":"A dead-star ring of funeral rites orbiting a sealed void wound. Roads are built from oathbone, not stone.","cities":["Varr-Keth Necropolis","The Oathbone Causeway","Censer Spire Fields"],"architecture":"ribbed cathedral bridges, gravestone pylons, suspended skull-vaults, black cloth banners sealed to bone arches","dailyLife":"citizens speak through verdict bells, record family debts in bone ledgers, and carry small cyan soul-lamps instead of coins","materials":"oathbone, bone-silver, void lacquer, grave silk, censer ash glass, cyan soul-core crystal","artPromptMustShow":["dead-star horizon","ribbed oathbone architecture","cyan soul-fire particles","bone ledgers or verdict seals","smoke-black wing shadows"]},"pelagos-vey-abyss":{"civilization":"The Pelagos Abyssal Courts","cosmology":"Pressure-city reefs built around drowned crowns and impossible upward tides. Nobility rule by surviving depth, not bloodline.","cities":["Nacre Court Below","The Drowned Gate","Pressure Choir Reef"],"architecture":"pearl palaces grown from coral ribs, shell amphitheaters, abyss-glass tunnels, pressure-ring thrones","dailyLife":"court houses duel with tide poems, larvae are sworn to reef guilds, and every crown contains a survival bell","materials":"abyss pearl, living coral pl function simulator(){const b=Platform.battle, scenarios=TGCore.bossLabScenarios(), lab=TGCore.bossLabScenarioPreview(Platform.selectedBossScenario||'voice_seal'), matrix=TGCore.bossLabScenarioMatrix(); return `<div class="space-y-4"><header><p class="text-xs uppercase tracking-[.25em] text-primary">Combat Simulator</p><h1 class="text-3xl font-black">Shared Engine Debugger</h1></header>${card('Boss Lab — Scenario Selector',`<div class="space-y-3"><div class="flex flex-wrap gap-2">${scenarios.map(sc=>`<button class="rounded-2lg px-3 py-2 text-xs font-black ${Platform.selectedBossScenario===sc.id?'bg-primary text-white':'bg-neutral-800 text-neutral-300'}" onclick="Platform.selectedBossScenario='${esc(sc.id)}';render()">${esc(sc.label)}</button>`).join('')}</div><div class="grid gap-2 sm:grid-cols-4 text-center text-xs"><span class="rounded-xl bg-neutral-950 p-2">Phase<br><b>${lab.phase.phase}/${lab.phase.total}</b></span><span class="rounded-xl bg-neutral-950 p-2">Pressure<br><b class="text-bear-400">${lab.pressure}</b></span><span class="rounded-xl bg-neutral-950 p-2">Seal Need<br><b class="text-primary">${lab.sealNeed}</b></span><span class="rounded-xl bg-neutral-950 p-2">Mission<br><b>${esc(lab.missionId)}</b></span></div><p class="rounded-xl bg-primary/15 p-3 text-sm text-primary"><b>${esc((lab.scenario||{}).label||lab.id)}</b> — Counter: ${esc(lab.counterHint)}</p><div class="grid gap-2 lg:grid-cols-2"><div class="rounded-2xl border border-neutral-800 bg-neutral-950 p-3"><b>Active Abilities</b>${lab.activeAbilities.map(a=>`<p class="mt-1 text-xs text-neutral-300"><span class="text-primary">${esc(a.id)}</span> — ${esc(a.description)}</p>`).join('')}</div><div class="rounded-2xl border border-neutral-800 bg-neutral-950 p-3"><b>Timeline</b>${lab.timeline.map(r=>`<p class="mt-1 text-xs text-neutral-300">R${r.round}: ${esc(r.name)} • pressure ${r.pressure}</p>`).join('')}</div></div><div class="overflow-x-auto"><table class="w-full min-w-[640px] text-xs"><thead><tr cla
