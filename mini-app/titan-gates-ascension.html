const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function badge(label, tone='primary') { const map={primary:'bg-primary/15 text-primary border-primary/30',good:'bg-bull-950 text-bull-400 border-bull-700/50',warn:'bg-yellow-950/40 text-yellow-300 border-yellow-500/40',bad:'bg-bear-950 text-bear-400 border-bear-700/50',mute:'bg-neutral-800 text-neutral-300 border-neutral-700'}; return `<span class="inline-flex items-center rounded-full border ${map[tone]||map.primary} px-3 py-1 text-xs font-bold uppercase tracking-wide">${esc(label)}</span>`; }
function card(title, body, extra='') { return `<section class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-4 shadow-dark-outline ${extra}"><h3 class="mb-3 text-lg font-bold text-neutral-50">${esc(title)}</h3>${body}</section>`; }
function metric(label, value, hint='', tone='primary') { const color=tone==='good'?'text-bull-400':tone==='warn'?'text-yellow-300':tone==='bad'?'text-bear-400':'text-primary'; return `<div class="rounded-2xl border border-neutral-800 bg-neutral-950/70 p-4"><div class="text-xs font-bold uppercase tracking-wider text-neutral-500">${esc(label)}</div><div class="mt-1 text-3xl font-black ${color}">${esc(value)}</div><div class="mt-1 text-sm text-neutral-400">${esc(hint)}</div></div>`; }
function navButton(id,label) { const on=activeTab===id; return `<button onclick="setTab('${id}')" class="rounded-2xl border px-4 py-2 text-sm font-bold uppercase tracking-wide transition ${on?'border-primary bg-primary text-white':'border-neutral-800 bg-neutral-900 text-neutral-300 hover:bg-neutral-800'}">${esc(label)}</button>`; }

function renderHeader(){const h=PLATFORM.health;return `<header class="relative overflow-hidden rounded-2_5xl border border-neutral-800 bg-neutral-900 p-5 shadow-dark-outline"><div class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_top_right,oklch(0.75_0.18_250),transparent_36%),radial-gradient(circle_at_bottom_left,oklch(0.72_0.16_145),transparent_30%)]"></div><div class="relative flex flex-col gap-4"><div class="flex flex-wrap items-start justify-between gap-3"><div><div class="mb-2 flex flex-wrap gap-2">${badge('Platform Command Center','primary')}${badge(h.sourceLoreAudit,'good')}${badge(h.githubMain==='MATCHED'?'GitHub Matched':'GitHub Check',h.githubMain==='MATCHED'?'good':'warn')}</div><h1 class="text-4xl font-black leading-none text-neutral-50 md:text-6xl">Titan Gates: Ascension</h1><p class="mt-2 max-w-3xl text-base text-neutral-300">A Reaper-operated, GitHub-backed mythic tactics platform: canon vault, Mission Control, production pipeline, lore audit gate, and creator handoff command layer.</p></div><div class="rounded-2xl border border-neutral-700 bg-neutral-950/80 p-3 text-right"><div class="text-xs font-bold uppercase tracking-wider text-neutral-500">Verified Base</div><div class="font-mono text-xl font-black text-primary">${esc(PLATFORM.commit)}</div><div class="text-xs text-neutral-400">${esc(PLATFORM.branch)} · ${PLATFORM.workingTreeClean?'clean':'dirty'}</div></div></div><div class="flex flex-wrap gap-2">${navButton('command','Command')}${navButton('mission','Mission Control')}${navButton('canon','Canon')}${navButton('production','Production')}${navButton('operations','Operations')}</div></div></header>`;}
function renderCommand(){const c=PLATFORM.counts,p=PLATFORM.production;const metrics=[metric('Factions',c.factions,'Playable Realm cultures','primary'),metric('Titans',c.titans,'Solo combat roster','good'),metric('Missions',c.missions,'Campaign mission registry','primary'),metric('Art Needs',p.assetsTotal,'GitHub asset registry entries','warn'),metric('Battlefields',c.maps,'Map prompts and 3D handoffs','primary'),metric('Handoff Packets',p.handoffPackets,'Creator-ready packets','good')].join('');const health=Object.entries(PLATFORM.health).map(([k,v])=>`<div class="flex items-center justify-between gap-3 rounded-xl border border-neutral-800 bg-neutral-950/60 px-3 py-2"><span class="text-neutral-400">${esc(k.replace(/[A-Z]/g,m=>' '+m).replace(/^./,m=>m.toUpperCase()))}</span>${badge(v,String(v).match(/PASS|MATCHED|CLEAN/)?'good':'warn')}</div>`).join('');const commits=PLATFORM.recentCommits.map(x=>`<li class="rounded-xl border border-neutral-800 bg-neutral-950/60 px-3 py-2 font-mono text-xs text-neutral-300">${esc(x)}</li>`).join('');return `<div class="grid gap-4 lg:grid-cols-[1.45fr_.85fr]"><section class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-4 shadow-dark-outline"><div class="mb-3 flex items-center justify-between gap-3"><h2 class="text-2xl font-black">Platform Pulse</h2>${badge('GitHub source of truth','primary')}</div><div class="grid grid-cols-2 gap-3 md:grid-cols-3">${metrics}</div></section>${card('Gate Health',`<div class="space-y-2">${health}</div>`)}${card('Recent GitHub Trail',`<ul class="space-y-2">${commits}</ul>`,'lg:col-span-2')}</div>`;}
function renderMission(){const summary=PLATFORM.missionSummary.map(s=>`<button onclick="factionFilter='${esc(s.id)}';render()" class="rounded-2xl border ${factionFilter===s.id?'border-primary bg-primary/15':'border-neutral-800 bg-neutral-950/70'} p-3 text-left"><div class="flex items-center justify-between gap-2"><div class="font-black text-neutral-50">${esc(s.name)}</div>${badge(`${s.missions}`,'primary')}</div><div class="mt-2 grid grid-cols-3 gap-2 text-xs text-neutral-400"><span>${s.packages} packs</span><span>${s.dialogue} talks</span><span>${s.loreLocked} locked</span></div></button>`).join('');const q=missionQuery.toLowerCase();const rows=PLATFORM.missions.filter(m=>(factionFilter==='ALL'||m.factionId===factionFilter)&&(!q||`${m.title} ${m.faction} ${m.battlefield} ${m.id}`.toLowerCase().includes(q))).slice(0,80);const table=rows.map(m=>`<tr class="border-b border-neutral-800/70 align-top"><td class="px-3 py-3"><div class="font-black text-neutral-50">${esc(m.title)}</div><div class="font-mono text-xs text-neutral-500">${esc(m.id)}</div></td><td class="px-3 py-3 text-neutral-300">${esc(m.faction)}</td><td class="px-3 py-3 text-neutral-300">${esc(m.battlefield)}</td><td class="px-3 py-3 text-neutral-300">${fmt(m.objectives)}</td><td class="px-3 py-3"><div class="flex flex-wrap gap-1">${badge(m.package?'Package':'No package',m.package?'good':'bad')}${badge(m.dialogue?'Dialogue':'No dialogue',m.dialogue?'good':'bad')}${badge(m.readiness,m.readiness==='LORE_LOCKED'?'good':'warn')}</div></td></tr>`).join('');return `<div class="grid gap-4"><section class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-4 shadow-dark-outline"><div class="mb-3 flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-2xl font-black">Mission Control</h2><p class="text-sm text-neutral-400">Inspect mission canon, battlefield linkage, dialogue, art packages, and creator readiness.</p></div>${badge(`${rows.length} shown of ${PLATFORM.missions.length}`,'primary')}</div><div class="mb-3 grid gap-2 md:grid-cols-[1fr_auto]"><input value="${esc(missionQuery)}" oninput="missionQuery=this.value;render()" placeholder="Search missions, factions, battlefields..." class="w-full rounded-2lg border border-neutral-700 bg-neutral-950 px-4 py-2.5 text-neutral-50 placeholder-neutral-500 focus:border-primary" /><button onclick="factionFilter='ALL';missionQuery='';render()" class="rounded-2lg border border-neutral-700 bg-neutral-800 px-5 py-2 font-bold text-neutral-300">Reset</button></div><div class="grid gap-2 md:grid-cols-2 xl:grid-cols-4"><button onclick="factionFilter='ALL';render()" class="rounded-2xl border ${factionFilter==='ALL'?'border-primary bg-primary/15':'border-neutral-800 bg-neutral-950/70'} p-3 text-left"><div class="font-black text-neutral-50">All Factions</div><div class="text-xs text-neutral-400">${PLATFORM.missions.length} missions</div></button>${summary}</div></section><section class="overflow-hidden rounded-2_5xl border border-neutral-800 bg-neutral-900 shadow-dark-outline"><div class="overflow-x-auto"><table class="w-full min-w-[840px] border-collapse"><thead><tr><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Mission</th><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Faction</th><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Battlefield</th><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Objectives</th><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Readiness</th></tr></thead><tbody>${table||`<tr><td colspan="5" class="px-3 py-8 text-center text-neutral-400">No missions match the current shadow.</td></tr>`}</tbody></table></div></section></div>`;}
function renderCanon(){const surfaces=PLATFORM.loreSurfaces.map(s=>`<div class="rounded-2xl border border-neutral-800 bg-neutral-950/70 p-4"><div class="flex items-start justify-between gap-3"><div><div class="text-xl font-black text-neutral-50">${esc(s.name)}</div><p class="text-sm text-neutral-400">${esc(s.state)}</p></div><div class="text-3xl font-black text-primary">${fmt(s.count)}</div></div></div>`).join('');const factions=PLATFORM.factions.map(f=>`<article class="rounded-2xl border border-neutral-800 bg-neutral-950/70 p-4"><div class="mb-2 flex items-center justify-between gap-3"><div class="flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-2xl border border-primary/30 bg-primary/10 text-xl text-primary">${esc(f.symbol)}</span><div><h3 class="text-xl font-black text-neutral-50">${esc(f.name)}</h3><p class="text-xs uppercase tracking-wider text-neutral-500">${esc(f.realm||'Realm canon locked')}</p></div></div>${badge(`${f.titans} Titans`,'good')}</div><p class="line-clamp-3 text-sm text-neutral-300">${esc(f.rule||'Source-culture rules are locked into faction, Titan, mission, battlefield, and art prompt layers.')}</p><div class="mt-3 flex flex-wrap gap-2">${badge(`${f.missions} missions`,'primary')}${badge('Earth myth is echo','mute')}</div></article>`).join('');return `<div class="grid gap-4">${card('Lore Surfaces',`<div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">${surfaces}</div>`)}${card('Seven Realm Canon',`<div class="grid gap-3 lg:grid-cols-2">${factions}</div>`)}</div>`;}
function renderProduction(){const ac=Object.entries(PLATFORM.production.assetCounts||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="flex items-center justify-between rounded-xl border border-neutral-800 bg-neutral-950/60 px-3 py-2"><span class="font-bold text-neutral-300">${esc(k)}</span><span class="text-xl font-black text-primary">${fmt(v)}</span></div>`).join('');const sc=Object.entries(PLATFORM.production.statusCounts||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="flex items-center justify-between rounded-xl border border-neutral-800 bg-neutral-950/60 px-3 py-2"><span class="font-bold text-neutral-300">${esc(k)}</span><span class="text-xl font-black text-yellow-300">${fmt(v)}</span></div>`).join('');return `<div class="grid gap-4 lg:grid-cols-2">${card('Asset Types',`<div class="space-y-2">${ac||'<p class="text-neutral-400">No asset registry rows found.</p>'}</div>`)}${card('Asset Status',`<div class="space-y-2">${sc||'<p class="text-neutral-400">No asset status rows found.</p>'}</div>`)}${card('Creator Pipeline',`<div class="grid grid-cols-2 gap-3">${metric('3D Blueprints',PLATFORM.production.blueprints,'Production queue')}${metric('Handoff Batches',PLATFORM.production.handoffBatches,'Creator packages','good')}${metric('Packets',PLATFORM.production.handoffPackets,'Valid packets','good')}${metric('Approval',PLATFORM.production.approvalStatus,'Art generation state','primary')}</div>`,'lg:col-span-2')}</div>`;}
function renderOperations(){const loop=PLATFORM.operatingLoop.map((x,i)=>`<div class="flex gap-3 rounded-2xl border border-neutral-800 bg-neutral-950/70 p-3"><div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-primary text-sm font-black text-white">${i+1}</div><div><div class="font-black text-neutral-50">${esc(x)}</div><p class="text-sm text-neutral-400">${i===0?'Holder intent becomes the target.':i===1?'Canon/data changes are made in the vault.':i===2?'The source-culture gate catches drift.':i===3?'Build, assets, and gameplay checks run.':i===4?'The Reaper panel updates for the holder.':i===5?'GitHub records the new state.':'Remote head is checked against local.'}</p></div></div>`).join('');return `<div class="grid gap-4 lg:grid-cols-[.9fr_1.1fr]">${card('Operating Loop',`<div class="space-y-2">${loop}</div>`)}${card('Next Build Target',`<div class="space-y-4 text-neutral-300"><p><b class="text-neutral-50">Mission Control is live.</b> The next edge is Asset Intake Control: mark GitHub asset arrivals, canon review status, and source-ready files from inside this platform view.</p><div class="rounded-2xl border border-primary/30 bg-primary/10 p-4"><div class="text-lg font-black text-primary">Recommended next strike</div><p class="text-sm text-neutral-300">Add Asset Intake Control so every 3D/art source file can be tracked from awaiting source to canon-approved.</p></div></div>`)}</div>`;}
function render(){const body=activeTab==='mission'?renderMission():activeTab==='canon'?renderCanon():activeTab==='production'?renderProduction():activeTab==='operations'?renderOperations():renderCommand();document.getElementById('app').innerHTML=renderHeader()+body+`<footer class="py-3 text-center text-xs text-neutral-500">Generated ${esc(PLATFORM.generatedAt)} · commit ${esc(PLATFORM.commit)} · Mission Control online</footer>`;}
render();
</script>
</body>
</html>
