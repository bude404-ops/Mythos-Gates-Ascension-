function renderCommand(){const c=PLATFORM.counts,p=PLATFORM.production;const metrics=[metric('Factions',c.factions,'Playable Realm cultures','primary'),metric('Titans',c.titans,'Solo combat roster','good'),metric('Missions',c.missions,'Campaign mission registry','primary'),metric('Assets',p.assetsTotal,'GitHub asset intake rows','warn'),metric('Battlefields',c.maps,'Map prompts and 3D handoffs','primary'),metric('Handoff Packets',p.handoffPackets,'Creator-ready packets','good')].join('');const health=Object.entries(PLATFORM.health).map(([k,v])=>`<div class="flex items-center justify-between gap-3 rounded-xl border border-neutral-800 bg-neutral-950/60 px-3 py-2"><span class="text-neutral-400">${esc(k.replace(/[A-Z]/g,m=>' '+m).replace(/^./,m=>m.toUpperCase()))}</span>${badge(v,String(v).match(/PASS|MATCHED|CLEAN/)?'good':'warn')}</div>`).join('');const commits=PLATFORM.recentCommits.map(x=>`<li class="rounded-xl border border-neutral-800 bg-neutral-950/60 px-3 py-2 font-mono text-xs text-neutral-300">${esc(x)}</li>`).join('');return `<div class="grid gap-4 lg:grid-cols-[1.45fr_.85fr]"><section class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-4 shadow-dark-outline"><div class="mb-3 flex items-center justify-between gap-3"><h2 class="text-2xl font-black">Platform Pulse</h2>${badge('GitHub source of truth','primary')}</div><div class="grid grid-cols-2 gap-3 md:grid-cols-3">${metrics}</div></section>${card('Gate Health',`<div class="space-y-2">${health}</div>`)}${card('Recent GitHub Trail',`<ul class="space-y-2">${commits}</ul>`,'lg:col-span-2')}</div>`;}
function renderMission(){const summary=PLATFORM.missionSummary.map(s=>`<button onclick="factionFilter='${esc(s.id)}';render()" class="rounded-2xl border ${factionFilter===s.id?'border-primary bg-primary/15':'border-neutral-800 bg-neutral-950/70'} p-3 text-left"><div class="flex items-center justify-between gap-2"><div class="font-black text-neutral-50">${esc(s.name)}</div>${badge(`${s.missions}`,'primary')}</div><div class="mt-2 grid grid-cols-3 gap-2 text-xs text-neutral-400"><span>${s.packages} packs</span><span>${s.dialogue} talks</span><span>${s.loreLocked} locked</span></div></button>`).join('');const q=missionQuery.toLowerCase();const rows=PLATFORM.missions.filter(m=>(factionFilter==='ALL'||m.factionId===factionFilter)&&(!q||`${m.title} ${m.faction} ${m.battlefield} ${m.id}`.toLowerCase().includes(q))).slice(0,80);const table=rows.map(m=>`<tr class="border-b border-neutral-800/70 align-top"><td class="px-3 py-3"><div class="font-black text-neutral-50">${esc(m.title)}</div><div class="font-mono text-xs text-neutral-500">${esc(m.id)}</div></td><td class="px-3 py-3 text-neutral-300">${esc(m.faction)}</td><td class="px-3 py-3 text-neutral-300">${esc(m.battlefield)}</td><td class="px-3 py-3 text-neutral-300">${fmt(m.objectives)}</td><td class="px-3 py-3"><div class="flex flex-wrap gap-1">${badge(m.package?'Package':'No package',m.package?'good':'bad')}${badge(m.dialogue?'Dialogue':'No dialogue',m.dialogue?'good':'bad')}${badge(m.readiness,m.readiness==='LORE_LOCKED'?'good':'warn')}</div></td></tr>`).join('');return `<div class="grid gap-4"><section class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-4 shadow-dark-outline"><div class="mb-3 flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-2xl font-black">Mission Control</h2><p class="text-sm text-neutral-400">Inspect mission canon, battlefield linkage, dialogue, art packages, and creator readiness.</p></div>${badge(`${rows.length} shown of ${PLATFORM.missions.length}`,'primary')}</div><div class="mb-3 grid gap-2 md:grid-cols-[1fr_auto]"><input value="${esc(missionQuery)}" oninput="missionQuery=this.value;render()" placeholder="Search missions, factions, battlefields..." class="w-full rounded-2lg border border-neutral-700 bg-neutral-950 px-4 py-2.5 text-neutral-50 placeholder-neutral-500 focus:border-primary" /><button onclick="factionFilter='ALL';missionQuery='';render()" class="rounded-2lg border border-neutral-700 bg-neutral-800 px-5 py-2 font-bold text-neutral-300">Reset</button></div><div class="grid gap-2 md:grid-cols-2 xl:grid-cols-4"><button onclick="factionFilter='ALL';render()" class="rounded-2xl border ${factionFilter==='ALL'?'border-primary bg-primary/15':'border-neutral-800 bg-neutral-950/70'} p-3 text-left"><div class="font-black text-neutral-50">All Factions</div><div class="text-xs text-neutral-400">${PLATFORM.missions.length} missions</div></button>${summary}</div></section><section class="overflow-hidden rounded-2_5xl border border-neutral-800 bg-neutral-900 shadow-dark-outline"><div class="overflow-x-auto"><table class="w-full min-w-[840px] border-collapse"><thead><tr><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Mission</th><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Faction</th><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Battlefield</th><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Objectives</th><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Readiness</th></tr></thead><tbody>${table||`<tr><td colspan="5" class="px-3 py-8 text-center text-neutral-400">No missions match the current shadow.</td></tr>`}</tbody></table></div></section></div>`;}
function renderAssets(){const types=Object.entries(PLATFORM.production.assetCounts||{}).sort((a,b)=>b[1]-a[1]);const statuses=Object.entries(PLATFORM.production.statusCounts||{}).sort((a,b)=>b[1]-a[1]);const typeButtons=types.map(([k,v])=>`<button onclick="assetTypeFilter='${esc(k)}';render()" class="rounded-2xl border ${assetTypeFilter===k?'border-primary bg-primary/15':'border-neutral-800 bg-neutral-950/70'} p-3 text-left"><div class="flex items-center justify-between"><span class="font-black text-neutral-50">${esc(k)}</span>${badge(v,'primary')}</div></button>`).join('');const statusButtons=statuses.map(([k,v])=>`<button onclick="assetStatusFilter='${esc(k)}';render()" class="rounded-2xl border ${assetStatusFilter===k?'border-primary bg-primary/15':'border-neutral-800 bg-neutral-950/70'} p-3 text-left"><div class="flex items-center justify-between"><span class="font-black text-neutral-50">${esc(k)}</span>${badge(v,k.includes('AWAITING')?'warn':'good')}</div></button>`).join('');const q=assetQuery.toLowerCase();const rows=PLATFORM.assets.filter(a=>(assetTypeFilter==='ALL'||a.type===assetTypeFilter)&&(assetStatusFilter==='ALL'||a.status===assetStatusFilter)&&(!q||`${a.id} ${a.name} ${a.type} ${a.status} ${a.lore} ${a.lane} ${a.phase}`.toLowerCase().includes(q))).slice(0,90);const sourceReady=PLATFORM.assets.filter(a=>a.sourceReady).length;const awaiting=PLATFORM.assets.length-sourceReady;const table=rows.map(a=>`<tr class="border-b border-neutral-800/70 align-top"><td class="px-3 py-3"><div class="font-black text-neutral-50">${esc(a.name)}</div><div class="font-mono text-xs text-neutral-500">${esc(a.id)} · ${esc(a.version)}</div></td><td class="px-3 py-3">${badge(a.type,'primary')}</td><td class="px-3 py-3"><div class="flex flex-wrap gap-1">${badge(a.status,a.status.includes('AWAITING')?'warn':'good')}${badge(a.validation,a.validation.includes('NEEDS')?'warn':'good')}${badge(a.intakeStage,a.sourceReady?'good':'warn')}</div></td><td class="px-3 py-3 text-neutral-300"><div>${esc(a.lane)}</div><div class="text-xs text-neutral-500">${esc(a.phase)}</div></td><td class="px-3 py-3 text-neutral-300"><div class="font-mono text-xs">${esc(a.repositoryPath)}</div><div class="mt-1 text-xs text-neutral-500">Deps ${a.dependencyCount} · checks ${a.revalidates}</div></td></tr>`).join('');return `<div class="grid gap-4"><section class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-4 shadow-dark-outline"><div class="mb-3 flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-2xl font-black">Asset Intake Control</h2><p class="text-sm text-neutral-400">Track each required source asset from awaiting source to canon review and validation.</p></div>${badge(`${rows.length} shown of ${PLATFORM.assets.length}`,'primary')}</div><div class="grid grid-cols-2 gap-3 md:grid-cols-4">${metric('Registry Rows',PLATFORM.assets.length,'Permanent GitHub asset IDs','primary')}${metric('Awaiting Source',awaiting,'Files not supplied yet','warn')}${metric('Source Ready',sourceReady,'Detected source files','good')}${metric('Revalidation Nodes',PLATFORM.assets.reduce((s,a)=>s+a.revalidates,0),'Checks queued after intake','primary')}</div><div class="mt-3 grid gap-2 md:grid-cols-[1fr_auto]"><input value="${esc(assetQuery)}" oninput="assetQuery=this.value;render()" placeholder="Search asset ID, type, lane, lore ref..." class="w-full rounded-2lg border border-neutral-700 bg-neutral-950 px-4 py-2.5 text-neutral-50 placeholder-neutral-500 focus:border-primary" /><button onclick="assetTypeFilter='ALL';assetStatusFilter='ALL';assetQuery='';render()" class="rounded-2lg border border-neutral-700 bg-neutral-800 px-5 py-2 font-bold text-neutral-300">Reset</button></div></section><div class="grid gap-3 lg:grid-cols-2">${card('Asset Types',`<div class="grid gap-2 md:grid-cols-2">${typeButtons}<button onclick="assetTypeFilter='ALL';render()" class="rounded-2xl border ${assetTypeFilter==='ALL'?'border-primary bg-primary/15':'border-neutral-800 bg-neutral-950/70'} p-3 text-left"><span class="font-black text-neutral-50">All Types</span></button></div>`)}${card('Intake Status',`<div class="grid gap-2">${statusButtons}<button onclick="assetStatusFilter='ALL';render()" class="rounded-2xl border ${assetStatusFilter==='ALL'?'border-primary bg-primary/15':'border-neutral-800 bg-neutral-950/70'} p-3 text-left"><span class="font-black text-neutral-50">All Statuses</span></button></div>`)}</div><section class="overflow-hidden rounded-2_5xl border border-neutral-800 bg-neutral-900 shadow-dark-outline"><div class="overflow-x-auto"><table class="w-full min-w-[980px] border-collapse"><thead><tr><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Asset</th><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Type</th><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Status</th><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Lane</th><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Repository Target</th></tr></thead><tbody>${table||`<tr><td colspan="5" class="px-3 py-8 text-center text-neutral-400">No assets match the current shadow.</td></tr>`}</tbody></table></div></section></div>`;}
function renderHandoff(){const h=PLATFORM.creatorHandoffDetail||{rows:[],batches:[]};const batches=(h.batches||[]).map(b=>`<button onclick="handoffBatchFilter='${esc(b.id)}';render()" class="rounded-2xl border ${handoffBatchFilter===b.id?'border-primary bg-primary/15':'border-neutral-800 bg-neutral-950/70'} p-3 text-left"><div class="flex items-center justify-between gap-2"><span class="font-black text-neutral-50">${esc(b.name)}</span>${badge(b.packetCount,'primary')}</div><div class="mt-1 font-mono text-xs text-neutral-500">${esc(b.id)}</div><div class="mt-1 text-xs text-neutral-400">${esc(b.type)}</div></button>`).join('');const types=[...new Set((h.rows||[]).map(r=>r.type))].sort();const typeButtons=types.map(t=>`<button onclick="handoffTypeFilter='${esc(t)}';render()" class="rounded-2xl border ${handoffTypeFilter===t?'border-primary bg-primary/15':'border-neutral-800 bg-neutral-950/70'} px-3 py-2 text-left font-bold text-neutral-200">${esc(t)}</button>`).join('');const q=handoffQuery.toLowerCase();const rows=(h.rows||[]).filter(r=>(handoffBatchFilter==='ALL'||r.batch===handoffBatchFilter)&&(handoffTypeFilter==='ALL'||r.type===handoffTypeFilter)&&(!q||`${r.packetId} ${r.name} ${r.type} ${r.batch} ${r.entityId} ${r.blueprint} ${r.promptId}`.toLowerCase().includes(q))).slice(0,80);const table=rows.map(r=>`<tr class="border-b border-neutral-800/70 align-top"><td class="px-3 py-3"><div class="font-black text-neutral-50">${esc(r.name)}</div><div class="font-mono text-xs text-neutral-500">${esc(r.packetId)} · ${esc(r.entityId||'')}</div><div class="mt-1 flex flex-wrap gap-1">${badge(r.priority||'NORMAL','primary')}${badge(r.status||'READY','good')}</div></td><td class="px-3 py-3"><div>${badge(r.type,'primary')}</div><div class="mt-1 font-mono text-xs text-neutral-500">${esc(r.batch)}</div></td><td class="px-3 py-3 text-neutral-300"><div class="font-mono text-xs">${esc(r.blueprint||'No blueprint')}</div><div class="mt-1 text-xs text-neutral-500">${esc(r.blueprintStatus||r.promptStatus||'prompt only')}</div></td><td class="px-3 py-3 text-neutral-300"><div class="font-mono text-xs">${esc(r.manifest||r.uploadTarget)}</div><div class="mt-1 text-xs text-neutral-500">Return files ${r.requiredFiles} · gates ${r.qualityGates} · rejects ${r.rejectionTriggers}</div></td><td class="px-3 py-3 text-neutral-300"><div class="line-clamp-4 text-sm">${esc(r.promptPreview||r.reason||'Blueprint handoff packet')}</div><div class="mt-2 flex flex-wrap gap-1">${(r.canonLocks||[]).slice(0,3).map(x=>badge(x.replaceAll('_',' '),'mute')).join('')}</div></td></tr>`).join('');return `<div class="grid gap-4"><section class="rounded-2_5xl border border-neutral-800 bg-neutral-900 p-4 shadow-dark-outline"><div class="mb-3 flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-2xl font-black">Creator Handoff Detail</h2><p class="text-sm text-neutral-400">Inspect every creator packet, batch, blueprint path, prompt contract, output target, and acceptance rule.</p></div>${badge(`${rows.length} shown of ${h.packets}`,'primary')}</div><div class="grid grid-cols-2 gap-3 md:grid-cols-4">${metric('Packets',h.packets,'Creator contracts','good')}${metric('Batches',(h.batches||[]).length,'Grouped handoffs','primary')}${metric('Art Packets',h.approvedArtPackets,'Approved prompt work','good')}${metric('3D Packets',h.battlefield3dPackets,'Battlefield blueprint work','primary')}</div><div class="mt-3 grid gap-2 md:grid-cols-[1fr_auto]"><input value="${esc(handoffQuery)}" oninput="handoffQuery=this.value;render()" placeholder="Search packets, blueprints, prompts, entity IDs..." class="w-full rounded-2lg border border-neutral-700 bg-neutral-950 px-4 py-2.5 text-neutral-50 placeholder-neutral-500 focus:border-primary" /><button onclick="handoffBatchFilter='ALL';handoffTypeFilter='ALL';handoffQuery='';render()" class="rounded-2lg border border-neutral-700 bg-neutral-800 px-5 py-2 font-bold text-neutral-300">Reset</button></div></section><div class="grid gap-3 lg:grid-cols-[1.2fr_.8fr]">${card('Handoff Batches',`<div class="grid gap-2">${batches}<button onclick="handoffBatchFilter='ALL';render()" class="rounded-2xl border ${handoffBatchFilter==='ALL'?'border-primary bg-primary/15':'border-neutral-800 bg-neutral-950/70'} p-3 text-left font-black text-neutral-50">All Batches</button></div>`)}${card('Packet Types',`<div class="grid gap-2">${typeButtons}<button onclick="handoffTypeFilter='ALL';render()" class="rounded-2xl border ${handoffTypeFilter==='ALL'?'border-primary bg-primary/15':'border-neutral-800 bg-neutral-950/70'} px-3 py-2 text-left font-bold text-neutral-50">All Types</button></div>`)}</div><section class="overflow-hidden rounded-2_5xl border border-neutral-800 bg-neutral-900 shadow-dark-outline"><div class="overflow-x-auto"><table class="w-full min-w-[1120px] border-collapse"><thead><tr><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Packet</th><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Batch / Type</th><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Blueprint / Prompt</th><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Output Contract</th><th class="sticky top-0 bg-neutral-900 px-3 py-2 text-left text-xs uppercase tracking-wider text-neutral-500">Canon Notes</th></tr></thead><tbody>${table||`<tr><td colspan="5" class="px-3 py-8 text-center text-neutral-400">No handoff packets match the current shadow.</td></tr>`}</tbody></table></div></section></div>`;}
function renderCanon(){const surfaces=PLATFORM.loreSurfaces.map(s=>`<div class="rounded-2xl border border-neutral-800 bg-neutral-950/70 p-4"><div class="flex items-start justify-between gap-3"><div><div class="text-xl font-black text-neutral-50">${esc(s.name)}</div><p class="text-sm text-neutral-400">${esc(s.state)}</p></div><div class="text-3xl font-black text-primary">${fmt(s.count)}</div></div></div>`).join('');const factions=PLATFORM.factions.map(f=>`<article class="rounded-2xl border border-neutral-800 bg-neutral-950/70 p-4"><div class="mb-2 flex items-center justify-between gap-3"><div class="flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-2xl border border-primary/30 bg-primary/10 text-xl text-primary">${esc(f.symbol)}</span><div><h3 class="text-xl font-black text-neutral-50">${esc(f.name)}</h3><p class="text-xs uppercase tracking-wider text-neutral-500">${esc(f.realm||'Realm canon locked')}</p></div></div>${badge(`${f.titans} Titans`,'good')}</div><p class="line-clamp-3 text-sm text-neutral-300">${esc(f.rule||'Source-culture rules are locked into faction, Titan, mission, battlefield, and art prompt layers.')}</p><div class="mt-3 flex flex-wrap gap-2">${badge(`${f.missions} missions`,'primary')}${badge('Earth myth is echo','mute')}</div></article>`).join('');return `<div class="grid gap-4">${card('Lore Surfaces',`<div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">${surfaces}</div>`)}${card('Seven Realm Canon',`<div class="grid gap-3 lg:grid-cols-2">${factions}</div>`)}</div>`;}
function renderProduction(){const ac=Object.entries(PLATFORM.production.assetCounts||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="flex items-center justify-between rounded-xl border border-neutral-800 bg-neutral-950/60 px-3 py-2"><span class="font-bold text-neutral-300">${esc(k)}</span><span class="text-xl font-black text-primary">${fmt(v)}</span></div>`).join('');const sc=Object.entries(PLATFORM.production.statusCounts||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="flex items-center justify-between rounded-xl border border-neutral-800 bg-neutral-950/60 px-3 py-2"><span class="font-bold text-neutral-300">${esc(k)}</span><span class="text-xl font-black text-yellow-300">${fmt(v)}</span></div>`).join('');const vc=Object.entries(PLATFORM.production.validationCounts||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="flex items-center justify-between rounded-xl border border-neutral-800 bg-neutral-950/60 px-3 py-2"><span class="font-bold text-neutral-300">${esc(k)}</span><span class="text-xl font-black text-bull-400">${fmt(v)}</span></div>`).join('');return `<div class="grid gap-4 lg:grid-cols-3">${card('Asset Types',`<div class="space-y-2">${ac}</div>`)}${card('Asset Status',`<div class="space-y-2">${sc}</div>`)}${card('Validation Status',`<div class="space-y-2">${vc}</div>`)}${card('Creator Pipeline',`<div class="grid grid-cols-2 gap-3">${metric('3D Blueprints',PLATFORM.production.blueprints,'Production queue')}${metric('Handoff Batches',PLATFORM.production.handoffBatches,'Creator packages','good')}${metric('Packets',PLATFORM.production.handoffPackets,'Valid packets','good')}${metric('Approval',PLATFORM.production.approvalStatus,'Art generation state','primary')}</div>`,'lg:col-span-3')}</div>`;}
function renderOperations(){const loop=PLATFORM.operatingLoop.map((x,i)=>`<div class="flex gap-3 rounded-2xl border border-neutral-800 bg-neutral-950/70 p-3"><div class="grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-primary text-sm font-black text-white">${i+1}</div><div><div class="font-black text-neutral-50">${esc(x)}</div><p class="text-sm text-neutral-400">${i===0?'Holder intent becomes the target.':i===1?'Canon/data changes are made in the vault.':i===2?'The source-culture gate catches drift.':i===3?'Build, assets, and gameplay checks run.':i===4?'The Reaper panel updates for the holder.':i===5?'GitHub records the new state.':'Remote head is checked against local.'}</p></div></div>`).join('');return `<div class="grid gap-4 lg:grid-cols-[.9fr_1.1fr]">${card('Operating Loop',`<div class="space-y-2">${loop}</div>`)}${card('Next Build Target',`<div class="space-y-4 text-neutral-300"><p><b class="text-neutral-50">Asset Intake Control is live.</b> The next edge is Creator Handoff Detail: inspect each packet, prompt, blueprint path, and acceptance criteria without opening raw files.</p><div class="rounded-2xl border border-primary/30 bg-primary/10 p-4"><div class="text-lg font-black text-primary">Recommended next strike</div><p class="text-sm text-neutral-300">Add Creator Handoff Detail so every art and 3D packet becomes reviewable from the platform panel.</p></div></div>`)}</div>`;}
function render(){const body=activeTab==='mission'?renderMission():activeTab==='assets'?renderAssets():activeTab==='handoff'?renderHandoff():activeTab==='canon'?renderCanon():activeTab==='production'?renderProduction():activeTab==='operations'?renderOperations():renderCommand();document.getElementById('app').innerHTML=renderHeader()+body+`<footer class="py-3 text-center text-xs text-neutral-500">Generated ${esc(PLATFORM.generatedAt)} · base ${esc(PLATFORM.commit)} · Creator Handoff online</footer>`;}
render();
</script>
</body>
